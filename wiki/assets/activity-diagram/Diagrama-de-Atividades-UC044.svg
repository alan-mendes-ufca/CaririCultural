<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2368.0" viewBox="0 0 1400.0 2368.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-044 — Cadastrar oferta</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2368.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-044</text>
  <text class="subtitle" x="70" y="75">Cadastrar oferta · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2118.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FED7AA"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">ADMIN. DO ESTABELECIMENTO</tspan></text><rect x="700.0" y="100" width="640.0" height="2118.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1204.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1654.0" width="1224.0" height="218.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V385.5 H1020.0 V413.0"/><path class="flow" d="M1020.0 481.0 V536.0"/><path class="flow" d="M1020.0 604.0 V631.5 H380.0 V659.0"/><path class="flow" d="M380.0 747.0 V774.5 H1020.0 V802.0"/><path class="flow" d="M1020.0 890.0 V945.0"/><path class="flow" d="M1020.0 1013.0 V1068.0"/><path class="branch-bus no-arrow" d="M1110.0 1120.0 H1350.0 V1254.0"/><path class="flow" d="M1350.0 1254.0 H1020.0 V1274.0"/><path class="main-flow" d="M930.0 1120.0 H80.0 V1460.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1342.0 H1382.0 V1460.0"/><path class="return-flow" d="M1382.0 1460.0 H1035.0"/><path class="flow" d="M1020.0 1475.0 V1518.0"/><path class="branch-bus no-arrow" d="M1110.0 1570.0 H1350.0 V1704.0"/><path class="error-flow" d="M1350.0 1704.0 H1020.0 V1724.0"/><path class="main-flow" d="M930.0 1570.0 H80.0 V1942.0 H1005.0"/><path class="error-flow" d="M1020.0 1788.0 V1826.0"/><path class="flow" d="M1020.0 1957.0 V2000.0"/><path class="flow" d="M1020.0 2088.0 V2125.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador de estabelecimento</tspan><tspan x="380.0" y="319.0">gastronômico acessa as ofertas do</tspan><tspan x="380.0" y="339.0">estabelecimento ao qual está vinculado</tspan></text><rect class="node system-node" x="825.0" y="413.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="442.0" text-anchor="middle"><tspan x="1020.0" y="442.0">o sistema inclui UC-038 para confirmar a</tspan><tspan x="1020.0" y="462.0">sessão administrativa.</tspan></text><rect class="node system-node" x="825.0" y="536.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="565.0" text-anchor="middle"><tspan x="1020.0" y="565.0">O sistema verifica o escopo do administrador</tspan><tspan x="1020.0" y="585.0">sobre o estabelecimento (RN-066).</tspan></text><rect class="node" x="185.0" y="659.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="688.0" text-anchor="middle"><tspan x="380.0" y="688.0">O administrador informa título, descrição,</tspan><tspan x="380.0" y="708.0">responsável e período de validade da oferta</tspan><tspan x="380.0" y="728.0">(RN-069).</tspan></text><rect class="node system-node" x="825.0" y="802.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="831.0" text-anchor="middle"><tspan x="1020.0" y="831.0">O sistema valida o vínculo com o</tspan><tspan x="1020.0" y="851.0">estabelecimento ativo e os dados mínimos</tspan><tspan x="1020.0" y="871.0">(RN-068, RN-071).</tspan></text><rect class="node system-node" x="825.0" y="945.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="974.0" text-anchor="middle"><tspan x="1020.0" y="974.0">O sistema registra a oferta e a operação de</tspan><tspan x="1020.0" y="994.0">auditoria (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,1068.0 1110.0,1120.0 1020.0,1172.0 930.0,1120.0"/><text class="small" x="1020.0" y="1115.0" text-anchor="middle"><tspan x="1020.0" y="1115.0">Há dados mínimos</tspan><tspan x="1020.0" y="1135.0">pendentes?</tspan></text><rect class="node system-node" x="825.0" y="1274.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1303.0" text-anchor="middle"><tspan x="1020.0" y="1303.0">O sistema mantém a oferta fora da exibição</tspan><tspan x="1020.0" y="1323.0">pública</tspan></text><polygon class="merge" points="1020.0,1445.0 1035.0,1460.0 1020.0,1475.0 1005.0,1460.0"/><polygon class="node system-node decision" points="1020.0,1518.0 1110.0,1570.0 1020.0,1622.0 930.0,1570.0"/><text class="small" x="1020.0" y="1545.0" text-anchor="middle"><tspan x="1020.0" y="1545.0">Administrador tenta</tspan><tspan x="1020.0" y="1565.0">cadastrar oferta fora</tspan><tspan x="1020.0" y="1585.0">do estabelecimento</tspan><tspan x="1020.0" y="1605.0">vinculado?</tspan></text><rect class="node exception-node" x="825.0" y="1724.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1761.0" text-anchor="middle"><tspan x="1020.0" y="1761.0">O sistema nega a operação (RN-066)</tspan></text><circle cx="1020.0" cy="1844.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1844.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1927.0 1035.0,1942.0 1020.0,1957.0 1005.0,1942.0"/><rect class="node system-node" x="825.0" y="2000.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2029.0" text-anchor="middle"><tspan x="1020.0" y="2029.0">Resultado: Oferta é criada, com estado de</tspan><tspan x="1020.0" y="2049.0">publicação compatível com os dados mínimos e</tspan><tspan x="1020.0" y="2069.0">trilha de auditoria.</tspan></text><circle cx="1020.0" cy="2143.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2143.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1451.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1236.0" text-anchor="start"><tspan x="110.0" y="1236.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="1110.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1849.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1686.0" text-anchor="start"><tspan x="110.0" y="1686.0">E1 — Administrador tenta cadastrar oferta fora do estabelecimento vinculado</tspan></text><text class="guard" x="92" y="1560.0">[fluxo principal]</text>

  <g transform="translate(340.0 2238.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
