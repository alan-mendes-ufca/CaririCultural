<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2576.0" viewBox="0 0 1400.0 2576.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-069 — Validar parâmetros de busca</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2576.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-069</text>
  <text class="subtitle" x="70" y="75">Validar parâmetros de busca · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2326.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">VISITANTE</tspan></text><rect x="700.0" y="100" width="640.0" height="2326.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="938.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1388.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1838.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V233.5 H1020.0 V270.0"/><path class="flow" d="M1020.0 358.0 V413.0"/><path class="flow" d="M1020.0 501.0 V556.0"/><path class="flow" d="M1020.0 624.0 V679.0"/><path class="flow" d="M1020.0 747.0 V802.0"/><path class="branch-bus no-arrow" d="M1110.0 854.0 H1350.0 V988.0"/><path class="flow" d="M1350.0 988.0 H380.0 V1008.0"/><path class="main-flow" d="M930.0 854.0 H80.0 V1194.0 H1005.0"/><path class="return-flow no-arrow" d="M380.0 1076.0 H1382.0 V1194.0"/><path class="return-flow" d="M1382.0 1194.0 H1035.0"/><path class="flow" d="M1020.0 1209.0 V1252.0"/><path class="branch-bus no-arrow" d="M1110.0 1304.0 H1350.0 V1438.0"/><path class="error-flow" d="M1350.0 1438.0 H1020.0 V1458.0"/><path class="main-flow" d="M930.0 1304.0 H80.0 V1644.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1526.0 H1382.0 V1644.0"/><path class="return-flow" d="M1382.0 1644.0 H1035.0"/><path class="flow" d="M1020.0 1659.0 V1702.0"/><path class="branch-bus no-arrow" d="M1110.0 1754.0 H1350.0 V1888.0"/><path class="error-flow" d="M1350.0 1888.0 H1020.0 V1908.0"/><path class="main-flow" d="M930.0 1754.0 H80.0 V2130.0 H1005.0"/><path class="error-flow" d="M1020.0 1976.0 V2014.0"/><path class="flow" d="M1020.0 2145.0 V2188.0"/><path class="flow" d="M1020.0 2296.0 V2333.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node system-node" x="825.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="299.0" text-anchor="middle"><tspan x="1020.0" y="299.0">O caso base (UC-004 ou UC-005) inclui esta</tspan><tspan x="1020.0" y="319.0">validação assim que o visitante envia termo</tspan><tspan x="1020.0" y="339.0">e/ou filtros.</tspan></text><rect class="node system-node" x="825.0" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="442.0" text-anchor="middle"><tspan x="1020.0" y="442.0">O sistema verifica formato, tamanho,</tspan><tspan x="1020.0" y="462.0">cardinalidade, domínio e taxonomia de cada</tspan><tspan x="1020.0" y="482.0">parâmetro informado.</tspan></text><rect class="node system-node" x="825.0" y="556.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="585.0" text-anchor="middle"><tspan x="1020.0" y="585.0">Parâmetros válidos são liberados para a etapa</tspan><tspan x="1020.0" y="605.0">de pesquisa do caso base.</tspan></text><rect class="node system-node" x="825.0" y="679.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="708.0" text-anchor="middle"><tspan x="1020.0" y="708.0">O sistema retorna o controle ao caso base</tspan><tspan x="1020.0" y="728.0">para prosseguir com a consulta.</tspan></text><polygon class="node system-node decision" points="1020.0,802.0 1110.0,854.0 1020.0,906.0 930.0,854.0"/><text class="small" x="1020.0" y="859.0" text-anchor="middle"><tspan x="1020.0" y="859.0">A1 aplicável?</tspan></text><rect class="node" x="185.0" y="1008.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="1037.0" text-anchor="middle"><tspan x="380.0" y="1037.0">O visitante corrige o parâmetro apontado como</tspan><tspan x="380.0" y="1057.0">inválido e reenvia a busca ao caso base</tspan></text><polygon class="merge" points="1020.0,1179.0 1035.0,1194.0 1020.0,1209.0 1005.0,1194.0"/><polygon class="node system-node decision" points="1020.0,1252.0 1110.0,1304.0 1020.0,1356.0 930.0,1304.0"/><text class="small" x="1020.0" y="1299.0" text-anchor="middle"><tspan x="1020.0" y="1299.0">Valor de filtro fora</tspan><tspan x="1020.0" y="1319.0">do domínio permitido?</tspan></text><rect class="node exception-node" x="825.0" y="1458.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1487.0" text-anchor="middle"><tspan x="1020.0" y="1487.0">O sistema rejeita a busca e oferece apenas</tspan><tspan x="1020.0" y="1507.0">valores aprovados, sem processar a consulta</tspan></text><polygon class="merge" points="1020.0,1629.0 1035.0,1644.0 1020.0,1659.0 1005.0,1644.0"/><polygon class="node system-node decision" points="1020.0,1702.0 1110.0,1754.0 1020.0,1806.0 930.0,1754.0"/><text class="small" x="1020.0" y="1729.0" text-anchor="middle"><tspan x="1020.0" y="1729.0">Parâmetro em formato</tspan><tspan x="1020.0" y="1749.0">ou cardinalidade</tspan><tspan x="1020.0" y="1769.0">inválidos (por</tspan><tspan x="1020.0" y="1789.0">exemplo, caracteres</tspan></text><rect class="node exception-node" x="825.0" y="1908.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1937.0" text-anchor="middle"><tspan x="1020.0" y="1937.0">O sistema recusa o processamento e orienta o</tspan><tspan x="1020.0" y="1957.0">visitante sobre o formato esperado</tspan></text><circle cx="1020.0" cy="2032.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2032.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2115.0 1035.0,2130.0 1020.0,2145.0 1005.0,2130.0"/><rect class="node system-node" x="825.0" y="2188.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1020.0" y="2217.0" text-anchor="middle"><tspan x="1020.0" y="2217.0">Resultado: Parâmetros válidos seguem para a</tspan><tspan x="1020.0" y="2237.0">etapa de pesquisa do caso base; parâmetros</tspan><tspan x="1020.0" y="2257.0">inválidos são rejeitados antes de qualquer</tspan><tspan x="1020.0" y="2277.0">consulta ser processada.</tspan></text><circle cx="1020.0" cy="2351.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2351.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1185.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="970.0" text-anchor="start"><tspan x="110.0" y="970.0">A1 — A1 aplicável</tspan></text><text class="guard" x="92" y="844.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1635.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1420.0" text-anchor="start"><tspan x="110.0" y="1420.0">E1 — Valor de filtro fora do domínio permitido</tspan></text><text class="guard" x="92" y="1294.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2037.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1860.0" text-anchor="start"><tspan x="110.0" y="1860.0">E2 — Parâmetro em formato ou cardinalidade inválidos (por exemplo, caracteres não</tspan><tspan x="110.0" y="1880.0">suportados ou número de filtros acima do limite)</tspan></text><text class="guard" x="92" y="1744.0">[fluxo principal]</text>

  <g transform="translate(340.0 2446.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
