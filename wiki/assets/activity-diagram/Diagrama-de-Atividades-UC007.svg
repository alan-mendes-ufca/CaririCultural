<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580.1" height="2312.0" viewBox="0 0 1580.1 2312.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-007 — Consultar localização, acesso e opções de transporte</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="2312.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-007</text>
  <text class="subtitle" x="70" y="75">Consultar localização, acesso e opções de transporte · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="2062.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">VISITANTE</tspan></text><rect x="546.7" y="100" width="486.7" height="2062.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="2062.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#E5E7EB"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">SERVIÇO DE MAPAS E TRANSPORTES</tspan></text>
  <rect class="alternative-band" x="88" y="1160.0" width="1404.1" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1610.0" width="1404.1" height="206.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 334.0 V361.5 H790.0 V389.0"/><path class="flow" d="M790.0 457.0 V512.0"/><path class="flow" d="M790.0 580.0 V635.0"/><path class="flow" d="M790.0 703.0 V758.0"/><path class="flow" d="M790.0 846.0 V873.5 H1276.8 V901.0"/><path class="flow" d="M1276.8 969.0 V996.5 H790.0 V1024.0"/><path class="branch-bus no-arrow" d="M880.0 1076.0 H1530.1 V1210.0"/><path class="flow" d="M1530.1 1210.0 H790.0 V1230.0"/><path class="main-flow" d="M700.0 1076.0 H80.0 V1416.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1298.0 H1562.1 V1416.0"/><path class="return-flow" d="M1562.1 1416.0 H805.0"/><path class="flow" d="M790.0 1431.0 V1474.0"/><path class="branch-bus no-arrow" d="M880.0 1526.0 H1530.1 V1660.0"/><path class="error-flow" d="M1530.1 1660.0 H303.4 V1680.0"/><path class="main-flow" d="M700.0 1526.0 H80.0 V1886.0 H775.0"/><path class="return-flow no-arrow" d="M303.4 1768.0 H1562.1 V1886.0"/><path class="return-flow" d="M1562.1 1886.0 H805.0"/><path class="flow" d="M790.0 1901.0 V1944.0"/><path class="flow" d="M790.0 2032.0 V2069.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="303.4" y="307.0" text-anchor="middle"><tspan x="303.4" y="307.0">O visitante abre a página de um local.</tspan></text><rect class="node system-node" x="595.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="418.0" text-anchor="middle"><tspan x="790.0" y="418.0">O sistema busca as informações necessárias</tspan><tspan x="790.0" y="438.0">para exibir sobre o local.</tspan></text><rect class="node system-node" x="595.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="541.0" text-anchor="middle"><tspan x="790.0" y="541.0">O sistema executa UC-071 para identificar a</tspan><tspan x="790.0" y="561.0">fonte e a data da última verificação.</tspan></text><rect class="node system-node" x="595.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="664.0" text-anchor="middle"><tspan x="790.0" y="664.0">O sistema apresenta localização, perfil do</tspan><tspan x="790.0" y="684.0">bairro, formas de acesso e distância a pé.</tspan></text><rect class="node system-node" x="595.0" y="758.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="787.0" text-anchor="middle"><tspan x="790.0" y="787.0">O sistema consulta o Serviço de Mapas e</tspan><tspan x="790.0" y="807.0">Transportes para calcular trajeto e opções de</tspan><tspan x="790.0" y="827.0">transporte.</tspan></text><rect class="node" x="1081.8" y="901.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="930.0" text-anchor="middle"><tspan x="1276.8" y="930.0">O visitante pode abrir o trajeto no serviço</tspan><tspan x="1276.8" y="950.0">externo.</tspan></text><polygon class="node system-node decision" points="790.0,1024.0 880.0,1076.0 790.0,1128.0 700.0,1076.0"/><text class="small" x="790.0" y="1071.0" text-anchor="middle"><tspan x="790.0" y="1071.0">Trajeto oficial</tspan><tspan x="790.0" y="1091.0">disponível?</tspan></text><rect class="node system-node" x="595.0" y="1230.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1259.0" text-anchor="middle"><tspan x="790.0" y="1259.0">O sistema abre o serviço externo após a ação</tspan><tspan x="790.0" y="1279.0">do visitante</tspan></text><polygon class="merge" points="790.0,1401.0 805.0,1416.0 790.0,1431.0 775.0,1416.0"/><polygon class="node system-node decision" points="790.0,1474.0 880.0,1526.0 790.0,1578.0 700.0,1526.0"/><text class="small" x="790.0" y="1521.0" text-anchor="middle"><tspan x="790.0" y="1521.0">Serviço externo</tspan><tspan x="790.0" y="1541.0">indisponível?</tspan></text><rect class="node exception-node" x="108.4" y="1680.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="1709.0" text-anchor="middle"><tspan x="303.4" y="1709.0">Os dados locais permanecem visíveis e o</tspan><tspan x="303.4" y="1729.0">sistema informa que o trajeto não pôde ser</tspan><tspan x="303.4" y="1749.0">aberto</tspan></text><polygon class="merge" points="790.0,1871.0 805.0,1886.0 790.0,1901.0 775.0,1886.0"/><rect class="node system-node" x="595.0" y="1944.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1973.0" text-anchor="middle"><tspan x="790.0" y="1973.0">Resultado: Localização, trajeto, formas de</tspan><tspan x="790.0" y="1993.0">acesso, opções de transporte, distância a pé</tspan><tspan x="790.0" y="2013.0">e estabelecimentos próximos são exibidos.</tspan></text><circle cx="790.0" cy="2087.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2087.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1407.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1192.0" text-anchor="start"><tspan x="110.0" y="1192.0">A1 — Trajeto oficial disponível</tspan></text><text class="guard" x="92" y="1066.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="1877.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1642.0" text-anchor="start"><tspan x="110.0" y="1642.0">E1 — Serviço externo indisponível</tspan></text><text class="guard" x="92" y="1516.0">[fluxo principal]</text>

  <g transform="translate(430.0 2182.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
