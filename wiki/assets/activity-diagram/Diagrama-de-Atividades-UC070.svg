<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580.1" height="2763.0" viewBox="0 0 1580.1 2763.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-070 — Buscar por proximidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="2763.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-070</text>
  <text class="subtitle" x="70" y="75">Buscar por proximidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="2513.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">VISITANTE</tspan></text><rect x="546.7" y="100" width="486.7" height="2513.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="2513.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#BAE6FD"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">SERVIÇO DE GEOLOCALIZAÇÃO</tspan></text>
  <rect class="alternative-band" x="88" y="1081.0" width="1404.1" height="206.0" rx="18"/><rect class="exception-band" x="88" y="1551.0" width="1404.1" height="206.0" rx="18"/><rect class="exception-band" x="88" y="2021.0" width="1404.1" height="206.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 358.0 V385.5 H790.0 V413.0"/><path class="flow" d="M790.0 481.0 V508.5 H1276.8 V536.0"/><path class="flow" d="M1276.8 624.0 V651.5 H790.0 V679.0"/><path class="flow" d="M790.0 747.0 V802.0"/><path class="flow" d="M790.0 890.0 V945.0"/><path class="branch-bus no-arrow" d="M880.0 997.0 H1530.1 V1131.0"/><path class="flow" d="M1530.1 1131.0 H303.4 V1151.0"/><path class="main-flow" d="M700.0 997.0 H80.0 V1357.0 H775.0"/><path class="return-flow no-arrow" d="M303.4 1239.0 H1562.1 V1357.0"/><path class="return-flow" d="M1562.1 1357.0 H805.0"/><path class="flow" d="M790.0 1372.0 V1415.0"/><path class="branch-bus no-arrow" d="M880.0 1467.0 H1530.1 V1601.0"/><path class="error-flow" d="M1530.1 1601.0 H790.0 V1621.0"/><path class="main-flow" d="M700.0 1467.0 H80.0 V1827.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1709.0 H1562.1 V1827.0"/><path class="return-flow" d="M1562.1 1827.0 H805.0"/><path class="flow" d="M790.0 1842.0 V1885.0"/><path class="branch-bus no-arrow" d="M880.0 1937.0 H1530.1 V2071.0"/><path class="error-flow" d="M1530.1 2071.0 H790.0 V2091.0"/><path class="main-flow" d="M700.0 1937.0 H80.0 V2297.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 2179.0 H1562.1 V2297.0"/><path class="return-flow" d="M1562.1 2297.0 H805.0"/><path class="flow" d="M790.0 2312.0 V2355.0"/><path class="flow" d="M790.0 2483.0 V2520.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="299.0" text-anchor="middle"><tspan x="303.4" y="299.0">Durante a pesquisa (UC-004) ou a filtragem</tspan><tspan x="303.4" y="319.0">(UC-005), o visitante escolhe “Mais</tspan><tspan x="303.4" y="339.0">próximos”.</tspan></text><rect class="node system-node" x="595.0" y="413.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="442.0" text-anchor="middle"><tspan x="790.0" y="442.0">O sistema solicita consentimento para uso da</tspan><tspan x="790.0" y="462.0">localização atual.</tspan></text><rect class="node" x="1081.8" y="536.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1276.8" y="565.0" text-anchor="middle"><tspan x="1276.8" y="565.0">O Serviço de Geolocalização retorna a posição</tspan><tspan x="1276.8" y="585.0">atual, ou o visitante informa bairro, cidade</tspan><tspan x="1276.8" y="605.0">ou ponto de referência como origem manual.</tspan></text><rect class="node system-node" x="595.0" y="679.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="708.0" text-anchor="middle"><tspan x="790.0" y="708.0">O sistema calcula a distância dos registros</tspan><tspan x="790.0" y="728.0">públicos e elegíveis com localização válida.</tspan></text><rect class="node system-node" x="595.0" y="802.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="831.0" text-anchor="middle"><tspan x="790.0" y="831.0">O sistema ordena os resultados por distância</tspan><tspan x="790.0" y="851.0">crescente e retorna o controle ao caso</tspan><tspan x="790.0" y="871.0">estendido.</tspan></text><polygon class="node system-node decision" points="790.0,945.0 880.0,997.0 790.0,1049.0 700.0,997.0"/><text class="small" x="790.0" y="1002.0" text-anchor="middle"><tspan x="790.0" y="1002.0">A1 aplicável?</tspan></text><rect class="node" x="108.4" y="1151.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="1180.0" text-anchor="middle"><tspan x="303.4" y="1180.0">O visitante prefere não usar a localização</tspan><tspan x="303.4" y="1200.0">atual e informa diretamente um bairro, cidade</tspan><tspan x="303.4" y="1220.0">ou ponto de referência como origem</tspan></text><polygon class="merge" points="790.0,1342.0 805.0,1357.0 790.0,1372.0 775.0,1357.0"/><polygon class="node system-node decision" points="790.0,1415.0 880.0,1467.0 790.0,1519.0 700.0,1467.0"/><text class="small" x="790.0" y="1452.0" text-anchor="middle"><tspan x="790.0" y="1452.0">Permissão de</tspan><tspan x="790.0" y="1472.0">localização negada ou</tspan><tspan x="790.0" y="1492.0">posição indisponível?</tspan></text><rect class="node exception-node" x="595.0" y="1621.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1650.0" text-anchor="middle"><tspan x="790.0" y="1650.0">A busca continua por cidade e o sistema</tspan><tspan x="790.0" y="1670.0">oferece a origem manual, sem bloquear o</tspan><tspan x="790.0" y="1690.0">catálogo</tspan></text><polygon class="merge" points="790.0,1812.0 805.0,1827.0 790.0,1842.0 775.0,1827.0"/><polygon class="node system-node decision" points="790.0,1885.0 880.0,1937.0 790.0,1989.0 700.0,1937.0"/><text class="small" x="790.0" y="1922.0" text-anchor="middle"><tspan x="790.0" y="1922.0">Distância não</tspan><tspan x="790.0" y="1942.0">calculável para um</tspan><tspan x="790.0" y="1962.0">registro?</tspan></text><rect class="node exception-node" x="595.0" y="2091.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="2120.0" text-anchor="middle"><tspan x="790.0" y="2120.0">O item pode permanecer no resultado, mas sem</tspan><tspan x="790.0" y="2140.0">distância estimada e sem ser indevidamente</tspan><tspan x="790.0" y="2160.0">priorizado como próximo</tspan></text><polygon class="merge" points="790.0,2282.0 805.0,2297.0 790.0,2312.0 775.0,2297.0"/><rect class="node system-node" x="595.0" y="2355.0" width="390.0" height="128.0" rx="18"/><text class="text" x="790.0" y="2384.0" text-anchor="middle"><tspan x="790.0" y="2384.0">Resultado: Resultados públicos e elegíveis</tspan><tspan x="790.0" y="2404.0">com localização válida são ordenados por</tspan><tspan x="790.0" y="2424.0">distância crescente, com origem e distância</tspan><tspan x="790.0" y="2444.0">explícitas; ou a busca prossegue por cidade</tspan><tspan x="790.0" y="2464.0">quando a proximidade não é viável.</tspan></text><circle cx="790.0" cy="2538.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2538.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1348.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1113.0" text-anchor="start"><tspan x="110.0" y="1113.0">A1 — A1 aplicável</tspan></text><text class="guard" x="92" y="987.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="1818.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1583.0" text-anchor="start"><tspan x="110.0" y="1583.0">E1 — Permissão de localização negada ou posição indisponível</tspan></text><text class="guard" x="92" y="1457.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="2288.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="2053.0" text-anchor="start"><tspan x="110.0" y="2053.0">E2 — Distância não calculável para um registro</tspan></text><text class="guard" x="92" y="1927.0">[fluxo principal]</text>

  <g transform="translate(430.0 2633.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
