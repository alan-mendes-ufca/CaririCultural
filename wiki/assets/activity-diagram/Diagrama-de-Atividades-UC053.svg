<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2086.0" viewBox="0 0 1400.0 2086.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-053 — Iniciar tópico de discussão na comunidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2086.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-053</text>
  <text class="subtitle" x="70" y="75">Iniciar tópico de discussão na comunidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1836.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="1836.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="918.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1368.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V393.0"/><path class="flow" d="M380.0 461.0 V488.5 H1020.0 V516.0"/><path class="flow" d="M1020.0 584.0 V639.0"/><path class="flow" d="M1020.0 727.0 V782.0"/><path class="branch-bus no-arrow" d="M1110.0 834.0 H1350.0 V968.0"/><path class="flow" d="M1350.0 968.0 H1020.0 V988.0"/><path class="main-flow" d="M930.0 834.0 H80.0 V1174.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1056.0 H1382.0 V1174.0"/><path class="return-flow" d="M1382.0 1174.0 H1035.0"/><path class="flow" d="M1020.0 1189.0 V1232.0"/><path class="branch-bus no-arrow" d="M1110.0 1284.0 H1350.0 V1418.0"/><path class="error-flow" d="M1350.0 1418.0 H1020.0 V1438.0"/><path class="main-flow" d="M930.0 1284.0 H80.0 V1660.0 H1005.0"/><path class="error-flow" d="M1020.0 1506.0 V1544.0"/><path class="flow" d="M1020.0 1675.0 V1718.0"/><path class="flow" d="M1020.0 1806.0 V1843.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O usuário acessa a seção de comunidade de um</tspan><tspan x="380.0" y="319.0">local ou evento.</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="422.0" text-anchor="middle"><tspan x="380.0" y="422.0">Aciona &quot;iniciar tópico&quot; e informa título e</tspan><tspan x="380.0" y="442.0">mensagem inicial.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema valida o vínculo com o local/evento</tspan><tspan x="1020.0" y="565.0">e o conteúdo mínimo informado.</tspan></text><rect class="node system-node" x="825.0" y="639.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="668.0" text-anchor="middle"><tspan x="1020.0" y="668.0">O sistema publica o tópico associado ao autor</tspan><tspan x="1020.0" y="688.0">e o disponibiliza para respostas da</tspan><tspan x="1020.0" y="708.0">comunidade.</tspan></text><polygon class="node system-node decision" points="1020.0,782.0 1110.0,834.0 1020.0,886.0 930.0,834.0"/><text class="small" x="1020.0" y="829.0" text-anchor="middle"><tspan x="1020.0" y="829.0">O usuário anexa fotos</tspan><tspan x="1020.0" y="849.0">ou vídeos ao tópico?</tspan></text><rect class="node system-node" x="825.0" y="988.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1017.0" text-anchor="middle"><tspan x="1020.0" y="1017.0">O sistema valida a mídia conforme as regras</tspan><tspan x="1020.0" y="1037.0">de conteúdo comunitário</tspan></text><polygon class="merge" points="1020.0,1159.0 1035.0,1174.0 1020.0,1189.0 1005.0,1174.0"/><polygon class="node system-node decision" points="1020.0,1232.0 1110.0,1284.0 1020.0,1336.0 930.0,1284.0"/><text class="small" x="1020.0" y="1259.0" text-anchor="middle"><tspan x="1020.0" y="1259.0">Conteúdo do tópico</tspan><tspan x="1020.0" y="1279.0">viola regra grave</tspan><tspan x="1020.0" y="1299.0">(ameaça,</tspan><tspan x="1020.0" y="1319.0">discriminação, dado</tspan></text><rect class="node exception-node" x="825.0" y="1438.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1467.0" text-anchor="middle"><tspan x="1020.0" y="1467.0">O sistema oculta preventivamente e informa o</tspan><tspan x="1020.0" y="1487.0">motivo</tspan></text><circle cx="1020.0" cy="1562.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1562.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1645.0 1035.0,1660.0 1020.0,1675.0 1005.0,1660.0"/><rect class="node system-node" x="825.0" y="1718.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1747.0" text-anchor="middle"><tspan x="1020.0" y="1747.0">Resultado: Tópico de discussão é criado,</tspan><tspan x="1020.0" y="1767.0">vinculado ao local/evento e ao autor, e fica</tspan><tspan x="1020.0" y="1787.0">disponível para respostas da comunidade.</tspan></text><circle cx="1020.0" cy="1861.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1861.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1165.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="950.0" text-anchor="start"><tspan x="110.0" y="950.0">A1 — O usuário anexa fotos ou vídeos ao tópico</tspan></text><text class="guard" x="92" y="824.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1567.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1400.0" text-anchor="start"><tspan x="110.0" y="1400.0">E1 — Conteúdo do tópico viola regra grave (ameaça, discriminação, dado pessoal exposto)</tspan></text><text class="guard" x="92" y="1274.0">[fluxo principal]</text>

  <g transform="translate(340.0 1956.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
