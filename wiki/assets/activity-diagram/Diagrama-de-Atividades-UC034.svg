<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2842.0" viewBox="0 0 1400.0 2842.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-034 — Cadastrar equipamento cultural</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2842.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-034</text>
  <text class="subtitle" x="70" y="75">Cadastrar equipamento cultural · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2592.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FBCFE8"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">ADMIN. DA PLATAFORMA</tspan></text><rect x="700.0" y="100" width="640.0" height="2592.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1224.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1674.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="2124.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V488.5 H380.0 V516.0"/><path class="flow" d="M380.0 624.0 V651.5 H1020.0 V679.0"/><path class="flow" d="M1020.0 767.0 V822.0"/><path class="flow" d="M1020.0 890.0 V945.0"/><path class="flow" d="M1020.0 1033.0 V1088.0"/><path class="branch-bus no-arrow" d="M1110.0 1140.0 H1350.0 V1274.0"/><path class="flow" d="M1350.0 1274.0 H1020.0 V1294.0"/><path class="main-flow" d="M930.0 1140.0 H80.0 V1480.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1362.0 H1382.0 V1480.0"/><path class="return-flow" d="M1382.0 1480.0 H1035.0"/><path class="flow" d="M1020.0 1495.0 V1538.0"/><path class="branch-bus no-arrow" d="M1110.0 1590.0 H1350.0 V1724.0"/><path class="flow" d="M1350.0 1724.0 H1020.0 V1744.0"/><path class="main-flow" d="M930.0 1590.0 H80.0 V1930.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1812.0 H1382.0 V1930.0"/><path class="return-flow" d="M1382.0 1930.0 H1035.0"/><path class="flow" d="M1020.0 1945.0 V1988.0"/><path class="branch-bus no-arrow" d="M1110.0 2040.0 H1350.0 V2174.0"/><path class="error-flow" d="M1350.0 2174.0 H1020.0 V2194.0"/><path class="main-flow" d="M930.0 2040.0 H80.0 V2416.0 H1005.0"/><path class="error-flow" d="M1020.0 2262.0 V2300.0"/><path class="flow" d="M1020.0 2431.0 V2474.0"/><path class="flow" d="M1020.0 2562.0 V2599.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador da plataforma inicia o</tspan><tspan x="380.0" y="319.0">cadastro de um equipamento cultural</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">o sistema inclui UC-038 para confirmar a</tspan><tspan x="1020.0" y="442.0">sessão administrativa autorizada.</tspan></text><rect class="node" x="185.0" y="516.0" width="390.0" height="108.0" rx="18"/><text class="text" x="380.0" y="545.0" text-anchor="middle"><tspan x="380.0" y="545.0">O administrador informa identificação,</tspan><tspan x="380.0" y="565.0">localização, dados de funcionamento,</tspan><tspan x="380.0" y="585.0">responsável, CNPJ quanto aplicável e demais</tspan><tspan x="380.0" y="605.0">informações exigidas para o tipo de local.</tspan></text><rect class="node system-node" x="825.0" y="679.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="708.0" text-anchor="middle"><tspan x="1020.0" y="708.0">O sistema valida os dados mínimos do cadastro</tspan><tspan x="1020.0" y="728.0">e verifica duplicidade conforme o critério</tspan><tspan x="1020.0" y="748.0">aplicável (RN-095).</tspan></text><rect class="node system-node" x="825.0" y="822.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="851.0" text-anchor="middle"><tspan x="1020.0" y="851.0">O sistema registra o equipamento e a operação</tspan><tspan x="1020.0" y="871.0">de auditoria (RN-076).</tspan></text><rect class="node system-node" x="825.0" y="945.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="974.0" text-anchor="middle"><tspan x="1020.0" y="974.0">O sistema disponibiliza o equipamento ou o</tspan><tspan x="1020.0" y="994.0">mantém pendente até que atenda às condições</tspan><tspan x="1020.0" y="1014.0">de publicação (RN-068).</tspan></text><polygon class="node system-node decision" points="1020.0,1088.0 1110.0,1140.0 1020.0,1192.0 930.0,1140.0"/><text class="small" x="1020.0" y="1135.0" text-anchor="middle"><tspan x="1020.0" y="1135.0">Há dados mínimos</tspan><tspan x="1020.0" y="1155.0">pendentes?</tspan></text><rect class="node system-node" x="825.0" y="1294.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1323.0" text-anchor="middle"><tspan x="1020.0" y="1323.0">O sistema mantém o cadastro como não</tspan><tspan x="1020.0" y="1343.0">publicado e informa os campos necessários</tspan></text><polygon class="merge" points="1020.0,1465.0 1035.0,1480.0 1020.0,1495.0 1005.0,1480.0"/><polygon class="node system-node decision" points="1020.0,1538.0 1110.0,1590.0 1020.0,1642.0 930.0,1590.0"/><text class="small" x="1020.0" y="1585.0" text-anchor="middle"><tspan x="1020.0" y="1585.0">O equipamento já</tspan><tspan x="1020.0" y="1605.0">possui cadastro?</tspan></text><rect class="node system-node" x="825.0" y="1744.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1773.0" text-anchor="middle"><tspan x="1020.0" y="1773.0">O sistema direciona o administrador para</tspan><tspan x="1020.0" y="1793.0">UC-035</tspan></text><polygon class="merge" points="1020.0,1915.0 1035.0,1930.0 1020.0,1945.0 1005.0,1930.0"/><polygon class="node system-node decision" points="1020.0,1988.0 1110.0,2040.0 1020.0,2092.0 930.0,2040.0"/><text class="small" x="1020.0" y="2015.0" text-anchor="middle"><tspan x="1020.0" y="2015.0">A sessão</tspan><tspan x="1020.0" y="2035.0">administrativa não é</tspan><tspan x="1020.0" y="2055.0">confirmada pelo</tspan><tspan x="1020.0" y="2075.0">UC-038?</tspan></text><rect class="node exception-node" x="825.0" y="2194.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2223.0" text-anchor="middle"><tspan x="1020.0" y="2223.0">O sistema nega o cadastro e não cria registro</tspan><tspan x="1020.0" y="2243.0">público</tspan></text><circle cx="1020.0" cy="2318.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2318.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2401.0 1035.0,2416.0 1020.0,2431.0 1005.0,2416.0"/><rect class="node system-node" x="825.0" y="2474.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2503.0" text-anchor="middle"><tspan x="1020.0" y="2503.0">Resultado: Equipamento é registrado, com</tspan><tspan x="1020.0" y="2523.0">estado de publicação compatível com os dados</tspan><tspan x="1020.0" y="2543.0">informados e trilha de auditoria.</tspan></text><circle cx="1020.0" cy="2617.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2617.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1471.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1256.0" text-anchor="start"><tspan x="110.0" y="1256.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="1130.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1921.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1706.0" text-anchor="start"><tspan x="110.0" y="1706.0">A2 — O equipamento já possui cadastro</tspan></text><text class="guard" x="92" y="1580.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2323.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2156.0" text-anchor="start"><tspan x="110.0" y="2156.0">E1 — A sessão administrativa não é confirmada pelo UC-038</tspan></text><text class="guard" x="92" y="2030.0">[fluxo principal]</text>

  <g transform="translate(340.0 2712.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
