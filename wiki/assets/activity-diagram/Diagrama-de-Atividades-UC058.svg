<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2058.0" viewBox="0 0 1400.0 2058.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-058 — Responder publicamente a uma avaliação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2058.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-058</text>
  <text class="subtitle" x="70" y="75">Responder publicamente a uma avaliação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1808.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FECACA"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">GESTOR</tspan></text><rect x="700.0" y="100" width="640.0" height="1808.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="894.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1344.0" width="1224.0" height="218.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V393.0"/><path class="flow" d="M380.0 457.0 V484.5 H1020.0 V512.0"/><path class="flow" d="M1020.0 580.0 V635.0"/><path class="flow" d="M1020.0 703.0 V758.0"/><path class="branch-bus no-arrow" d="M1110.0 810.0 H1350.0 V944.0"/><path class="flow" d="M1350.0 944.0 H1020.0 V964.0"/><path class="main-flow" d="M930.0 810.0 H80.0 V1150.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1032.0 H1382.0 V1150.0"/><path class="return-flow" d="M1382.0 1150.0 H1035.0"/><path class="flow" d="M1020.0 1165.0 V1208.0"/><path class="branch-bus no-arrow" d="M1110.0 1260.0 H1350.0 V1394.0"/><path class="error-flow" d="M1350.0 1394.0 H1020.0 V1414.0"/><path class="main-flow" d="M930.0 1260.0 H80.0 V1632.0 H1005.0"/><path class="error-flow" d="M1020.0 1478.0 V1516.0"/><path class="flow" d="M1020.0 1647.0 V1690.0"/><path class="flow" d="M1020.0 1778.0 V1815.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O gestor abre uma avaliação recebida pelo</tspan><tspan x="380.0" y="319.0">estabelecimento que administra.</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="430.0" text-anchor="middle"><tspan x="380.0" y="430.0">Escreve o texto da resposta pública.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="541.0" text-anchor="middle"><tspan x="1020.0" y="541.0">O sistema valida o vínculo administrativo do</tspan><tspan x="1020.0" y="561.0">gestor com o estabelecimento avaliado.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema publica a resposta associada ao</tspan><tspan x="1020.0" y="684.0">autor administrativo e à avaliação original.</tspan></text><polygon class="node system-node decision" points="1020.0,758.0 1110.0,810.0 1020.0,862.0 930.0,810.0"/><text class="small" x="1020.0" y="795.0" text-anchor="middle"><tspan x="1020.0" y="795.0">O gestor edita uma</tspan><tspan x="1020.0" y="815.0">resposta já</tspan><tspan x="1020.0" y="835.0">publicada?</tspan></text><rect class="node system-node" x="825.0" y="964.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="993.0" text-anchor="middle"><tspan x="1020.0" y="993.0">O sistema mantém o vínculo com a avaliação</tspan><tspan x="1020.0" y="1013.0">original</tspan></text><polygon class="merge" points="1020.0,1135.0 1035.0,1150.0 1020.0,1165.0 1005.0,1150.0"/><polygon class="node system-node decision" points="1020.0,1208.0 1110.0,1260.0 1020.0,1312.0 930.0,1260.0"/><text class="small" x="1020.0" y="1235.0" text-anchor="middle"><tspan x="1020.0" y="1235.0">Gestor tenta</tspan><tspan x="1020.0" y="1255.0">responder a avaliação</tspan><tspan x="1020.0" y="1275.0">de estabelecimento</tspan><tspan x="1020.0" y="1295.0">fora de seu vínculo</tspan></text><rect class="node exception-node" x="825.0" y="1414.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1451.0" text-anchor="middle"><tspan x="1020.0" y="1451.0">O sistema nega a operação</tspan></text><circle cx="1020.0" cy="1534.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1534.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1617.0 1035.0,1632.0 1020.0,1647.0 1005.0,1632.0"/><rect class="node system-node" x="825.0" y="1690.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1719.0" text-anchor="middle"><tspan x="1020.0" y="1719.0">Resultado: Resposta pública do gestor é</tspan><tspan x="1020.0" y="1739.0">publicada e vinculada à avaliação e ao</tspan><tspan x="1020.0" y="1759.0">estabelecimento.</tspan></text><circle cx="1020.0" cy="1833.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1833.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1141.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="926.0" text-anchor="start"><tspan x="110.0" y="926.0">A1 — O gestor edita uma resposta já publicada</tspan></text><text class="guard" x="92" y="800.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1539.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1366.0" text-anchor="start"><tspan x="110.0" y="1366.0">E1 — Gestor tenta responder a avaliação de estabelecimento fora de seu vínculo</tspan><tspan x="110.0" y="1386.0">administrativo</tspan></text><text class="guard" x="92" y="1250.0">[fluxo principal]</text>

  <g transform="translate(340.0 1928.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
