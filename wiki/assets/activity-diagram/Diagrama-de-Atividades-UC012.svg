<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2456.0" viewBox="0 0 1400.0 2456.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-012 — Consultar avaliações da comunidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2456.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-012</text>
  <text class="subtitle" x="70" y="75">Consultar avaliações da comunidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2206.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">VISITANTE</tspan></text><rect x="700.0" y="100" width="640.0" height="2206.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="898.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1348.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1798.0" width="1224.0" height="182.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V488.5 H380.0 V516.0"/><path class="flow" d="M380.0 584.0 V611.5 H1020.0 V639.0"/><path class="flow" d="M1020.0 707.0 V762.0"/><path class="branch-bus no-arrow" d="M1110.0 814.0 H1350.0 V948.0"/><path class="flow" d="M1350.0 948.0 H1020.0 V968.0"/><path class="main-flow" d="M930.0 814.0 H80.0 V1154.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1036.0 H1382.0 V1154.0"/><path class="return-flow" d="M1382.0 1154.0 H1035.0"/><path class="flow" d="M1020.0 1169.0 V1212.0"/><path class="branch-bus no-arrow" d="M1110.0 1264.0 H1350.0 V1398.0"/><path class="flow" d="M1350.0 1398.0 H1020.0 V1418.0"/><path class="main-flow" d="M930.0 1264.0 H80.0 V1604.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1486.0 H1382.0 V1604.0"/><path class="return-flow" d="M1382.0 1604.0 H1035.0"/><path class="flow" d="M1020.0 1619.0 V1662.0"/><path class="branch-bus no-arrow" d="M1110.0 1714.0 H1350.0 V1848.0"/><path class="error-flow" d="M1350.0 1848.0 H1020.0 V1868.0"/><path class="main-flow" d="M930.0 1714.0 H80.0 V2050.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1932.0 H1382.0 V2050.0"/><path class="return-flow" d="M1382.0 2050.0 H1035.0"/><path class="flow" d="M1020.0 2065.0 V2108.0"/><path class="flow" d="M1020.0 2176.0 V2213.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O visitante abre a área de avaliações de um</tspan><tspan x="380.0" y="319.0">local.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema mostra avaliações aprovadas com</tspan><tspan x="1020.0" y="442.0">autoria, nota e data.</tspan></text><rect class="node" x="185.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="545.0" text-anchor="middle"><tspan x="380.0" y="545.0">O visitante ordena as avaliações por recência</tspan><tspan x="380.0" y="565.0">ou relevância.</tspan></text><rect class="node system-node" x="825.0" y="639.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="668.0" text-anchor="middle"><tspan x="1020.0" y="668.0">O sistema exibe o conteúdo ordenado e permite</tspan><tspan x="1020.0" y="688.0">abrir cada avaliação individualmente.</tspan></text><polygon class="node system-node decision" points="1020.0,762.0 1110.0,814.0 1020.0,866.0 930.0,814.0"/><text class="small" x="1020.0" y="809.0" text-anchor="middle"><tspan x="1020.0" y="809.0">Não há avaliações</tspan><tspan x="1020.0" y="829.0">publicadas?</tspan></text><rect class="node system-node" x="825.0" y="968.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="997.0" text-anchor="middle"><tspan x="1020.0" y="997.0">O sistema informa a ausência de conteúdo sem</tspan><tspan x="1020.0" y="1017.0">fabricar nota</tspan></text><polygon class="merge" points="1020.0,1139.0 1035.0,1154.0 1020.0,1169.0 1005.0,1154.0"/><polygon class="node system-node decision" points="1020.0,1212.0 1110.0,1264.0 1020.0,1316.0 930.0,1264.0"/><text class="small" x="1020.0" y="1259.0" text-anchor="middle"><tspan x="1020.0" y="1259.0">Uma avaliação foi</tspan><tspan x="1020.0" y="1279.0">denunciada?</tspan></text><rect class="node system-node" x="825.0" y="1418.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1447.0" text-anchor="middle"><tspan x="1020.0" y="1447.0">Ela permanece visível ou é preventivamente</tspan><tspan x="1020.0" y="1467.0">ocultada conforme a gravidade da denúncia</tspan></text><polygon class="merge" points="1020.0,1589.0 1035.0,1604.0 1020.0,1619.0 1005.0,1604.0"/><polygon class="node system-node decision" points="1020.0,1662.0 1110.0,1714.0 1020.0,1766.0 930.0,1714.0"/><text class="small" x="1020.0" y="1699.0" text-anchor="middle"><tspan x="1020.0" y="1699.0">Mídia anexada a uma</tspan><tspan x="1020.0" y="1719.0">avaliação não pode</tspan><tspan x="1020.0" y="1739.0">ser carregada?</tspan></text><rect class="node exception-node" x="825.0" y="1868.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1905.0" text-anchor="middle"><tspan x="1020.0" y="1905.0">O texto da avaliação continua disponível</tspan></text><polygon class="merge" points="1020.0,2035.0 1035.0,2050.0 1020.0,2065.0 1005.0,2050.0"/><rect class="node system-node" x="825.0" y="2108.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2137.0" text-anchor="middle"><tspan x="1020.0" y="2137.0">Resultado: Avaliações são exibidas na</tspan><tspan x="1020.0" y="2157.0">ordenação escolhida pelo visitante.</tspan></text><circle cx="1020.0" cy="2231.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2231.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1145.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="930.0" text-anchor="start"><tspan x="110.0" y="930.0">A1 — Não há avaliações publicadas</tspan></text><text class="guard" x="92" y="804.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1595.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1380.0" text-anchor="start"><tspan x="110.0" y="1380.0">A2 — Uma avaliação foi denunciada</tspan></text><text class="guard" x="92" y="1254.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="2041.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1830.0" text-anchor="start"><tspan x="110.0" y="1830.0">E1 — Mídia anexada a uma avaliação não pode ser carregada</tspan></text><text class="guard" x="92" y="1704.0">[fluxo principal]</text>

  <g transform="translate(340.0 2326.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
