<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2229.0" viewBox="0 0 1400.0 2229.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-073 — Retomar rascunho após autenticação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2229.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-073</text>
  <text class="subtitle" x="70" y="75">Retomar rascunho após autenticação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1979.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="1979.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1061.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1511.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V385.5 H1020.0 V413.0"/><path class="flow" d="M1020.0 501.0 V556.0"/><path class="flow" d="M1020.0 624.0 V679.0"/><path class="flow" d="M1020.0 747.0 V774.5 H380.0 V802.0"/><path class="flow" d="M380.0 870.0 V897.5 H1020.0 V925.0"/><path class="branch-bus no-arrow" d="M1110.0 977.0 H1350.0 V1111.0"/><path class="flow" d="M1350.0 1111.0 H1020.0 V1131.0"/><path class="main-flow" d="M930.0 977.0 H80.0 V1317.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1199.0 H1382.0 V1317.0"/><path class="return-flow" d="M1382.0 1317.0 H1035.0"/><path class="flow" d="M1020.0 1332.0 V1375.0"/><path class="branch-bus no-arrow" d="M1110.0 1427.0 H1350.0 V1561.0"/><path class="error-flow" d="M1350.0 1561.0 H1020.0 V1581.0"/><path class="main-flow" d="M930.0 1427.0 H80.0 V1803.0 H1005.0"/><path class="error-flow" d="M1020.0 1649.0 V1687.0"/><path class="flow" d="M1020.0 1818.0 V1861.0"/><path class="flow" d="M1020.0 1949.0 V1986.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O usuário preenche nota, comentário ou dados</tspan><tspan x="380.0" y="319.0">de sinalização no caso estendido (UC-013 ou</tspan><tspan x="380.0" y="339.0">UC-080) sem sessão autenticada.</tspan></text><rect class="node system-node" x="825.0" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="442.0" text-anchor="middle"><tspan x="1020.0" y="442.0">Ao tentar enviar, o sistema identifica a</tspan><tspan x="1020.0" y="462.0">exigência de autenticação e retém</tspan><tspan x="1020.0" y="482.0">temporariamente o conteúdo preenchido.</tspan></text><rect class="node system-node" x="825.0" y="556.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="585.0" text-anchor="middle"><tspan x="1020.0" y="585.0">O sistema solicita que o usuário se</tspan><tspan x="1020.0" y="605.0">autentique.</tspan></text><rect class="node system-node" x="825.0" y="679.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="708.0" text-anchor="middle"><tspan x="1020.0" y="708.0">Após a autenticação, o sistema restaura o</tspan><tspan x="1020.0" y="728.0">conteúdo preenchido no formulário de origem.</tspan></text><rect class="node" x="185.0" y="802.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="831.0" text-anchor="middle"><tspan x="380.0" y="831.0">O usuário confirma o envio, e o sistema</tspan><tspan x="380.0" y="851.0">descarta o rascunho temporário.</tspan></text><polygon class="node system-node decision" points="1020.0,925.0 1110.0,977.0 1020.0,1029.0 930.0,977.0"/><text class="small" x="1020.0" y="972.0" text-anchor="middle"><tspan x="1020.0" y="972.0">O usuário desiste do</tspan><tspan x="1020.0" y="992.0">envio?</tspan></text><rect class="node system-node" x="825.0" y="1131.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1160.0" text-anchor="middle"><tspan x="1020.0" y="1160.0">O sistema descarta o rascunho preservado de</tspan><tspan x="1020.0" y="1180.0">forma explícita</tspan></text><polygon class="merge" points="1020.0,1302.0 1035.0,1317.0 1020.0,1332.0 1005.0,1317.0"/><polygon class="node system-node decision" points="1020.0,1375.0 1110.0,1427.0 1020.0,1479.0 930.0,1427.0"/><text class="small" x="1020.0" y="1402.0" text-anchor="middle"><tspan x="1020.0" y="1402.0">A autenticação não é</tspan><tspan x="1020.0" y="1422.0">concluída dentro do</tspan><tspan x="1020.0" y="1442.0">prazo de retenção do</tspan><tspan x="1020.0" y="1462.0">rascunho?</tspan></text><rect class="node exception-node" x="825.0" y="1581.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1610.0" text-anchor="middle"><tspan x="1020.0" y="1610.0">O sistema descarta o conteúdo e informa que</tspan><tspan x="1020.0" y="1630.0">será necessário preenchê-lo novamente</tspan></text><circle cx="1020.0" cy="1705.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1705.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1788.0 1035.0,1803.0 1020.0,1818.0 1005.0,1803.0"/><rect class="node system-node" x="825.0" y="1861.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1890.0" text-anchor="middle"><tspan x="1020.0" y="1890.0">Resultado: Conteúdo preenchido é restaurado</tspan><tspan x="1020.0" y="1910.0">após a autenticação; o rascunho é descartado</tspan><tspan x="1020.0" y="1930.0">após o envio ou o descarte explícito.</tspan></text><circle cx="1020.0" cy="2004.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2004.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1308.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1093.0" text-anchor="start"><tspan x="110.0" y="1093.0">A1 — O usuário desiste do envio</tspan></text><text class="guard" x="92" y="967.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1710.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1543.0" text-anchor="start"><tspan x="110.0" y="1543.0">E1 — A autenticação não é concluída dentro do prazo de retenção do rascunho</tspan></text><text class="guard" x="92" y="1417.0">[fluxo principal]</text>

  <g transform="translate(340.0 2099.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
