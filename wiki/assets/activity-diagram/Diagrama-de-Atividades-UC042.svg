<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2564.0" viewBox="0 0 1400.0 2564.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-042 — Consultar atrações cadastradas</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2564.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-042</text>
  <text class="subtitle" x="70" y="75">Consultar atrações cadastradas · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2314.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">VISITANTE</tspan></text><rect x="700.0" y="100" width="640.0" height="2314.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="974.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1424.0" width="1224.0" height="182.0" rx="18"/><rect class="exception-band" x="88" y="1870.0" width="1224.0" height="218.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V488.5 H380.0 V516.0"/><path class="flow" d="M380.0 580.0 V607.5 H1020.0 V635.0"/><path class="flow" d="M1020.0 783.0 V838.0"/><path class="branch-bus no-arrow" d="M1110.0 890.0 H1350.0 V1024.0"/><path class="flow" d="M1350.0 1024.0 H380.0 V1044.0"/><path class="main-flow" d="M930.0 890.0 H80.0 V1230.0 H1005.0"/><path class="return-flow no-arrow" d="M380.0 1112.0 H1382.0 V1230.0"/><path class="return-flow" d="M1382.0 1230.0 H1035.0"/><path class="flow" d="M1020.0 1245.0 V1288.0"/><path class="branch-bus no-arrow" d="M1110.0 1340.0 H1350.0 V1474.0"/><path class="flow" d="M1350.0 1474.0 H380.0 V1494.0"/><path class="main-flow" d="M930.0 1340.0 H80.0 V1676.0 H1005.0"/><path class="return-flow no-arrow" d="M380.0 1558.0 H1382.0 V1676.0"/><path class="return-flow" d="M1382.0 1676.0 H1035.0"/><path class="flow" d="M1020.0 1691.0 V1734.0"/><path class="branch-bus no-arrow" d="M1110.0 1786.0 H1350.0 V1920.0"/><path class="error-flow" d="M1350.0 1920.0 H1020.0 V1940.0"/><path class="main-flow" d="M930.0 1786.0 H80.0 V2158.0 H1005.0"/><path class="error-flow" d="M1020.0 2004.0 V2042.0"/><path class="flow" d="M1020.0 2173.0 V2216.0"/><path class="flow" d="M1020.0 2284.0 V2321.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O visitante acessa as atrações de um</tspan><tspan x="380.0" y="319.0">equipamento cultural.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema lista as atrações publicadas e com</tspan><tspan x="1020.0" y="442.0">vínculo válido (RN-022).</tspan></text><rect class="node" x="185.0" y="516.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="553.0" text-anchor="middle"><tspan x="380.0" y="553.0">O visitante seleciona uma atração.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="148.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema exibe as informações públicas</tspan><tspan x="1020.0" y="684.0">disponíveis: descrição, horários,</tspan><tspan x="1020.0" y="704.0">localização, valor de ingresso quando</tspan><tspan x="1020.0" y="724.0">aplicável, acessibilidade, adequação</tspan><tspan x="1020.0" y="744.0">infantil, segurança do entorno, programação e</tspan><tspan x="1020.0" y="764.0">contato (RN-012).</tspan></text><polygon class="node system-node decision" points="1020.0,838.0 1110.0,890.0 1020.0,942.0 930.0,890.0"/><text class="small" x="1020.0" y="875.0" text-anchor="middle"><tspan x="1020.0" y="875.0">O visitante</tspan><tspan x="1020.0" y="895.0">identifica um dado</tspan><tspan x="1020.0" y="915.0">incorreto?</tspan></text><rect class="node" x="185.0" y="1044.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="1073.0" text-anchor="middle"><tspan x="380.0" y="1073.0">Aciona a extensão UC-080 sem precisar</tspan><tspan x="380.0" y="1093.0">publicar uma avaliação</tspan></text><polygon class="merge" points="1020.0,1215.0 1035.0,1230.0 1020.0,1245.0 1005.0,1230.0"/><polygon class="node system-node decision" points="1020.0,1288.0 1110.0,1340.0 1020.0,1392.0 930.0,1340.0"/><text class="small" x="1020.0" y="1325.0" text-anchor="middle"><tspan x="1020.0" y="1325.0">O visitante deseja</tspan><tspan x="1020.0" y="1345.0">compartilhar a</tspan><tspan x="1020.0" y="1365.0">atração?</tspan></text><rect class="node" x="185.0" y="1494.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="1531.0" text-anchor="middle"><tspan x="380.0" y="1531.0">Aciona a extensão UC-033</tspan></text><polygon class="merge" points="1020.0,1661.0 1035.0,1676.0 1020.0,1691.0 1005.0,1676.0"/><polygon class="node system-node decision" points="1020.0,1734.0 1110.0,1786.0 1020.0,1838.0 930.0,1786.0"/><text class="small" x="1020.0" y="1771.0" text-anchor="middle"><tspan x="1020.0" y="1771.0">A atração não possui</tspan><tspan x="1020.0" y="1791.0">vínculo válido com um</tspan><tspan x="1020.0" y="1811.0">equipamento ativo?</tspan></text><rect class="node exception-node" x="825.0" y="1940.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1977.0" text-anchor="middle"><tspan x="1020.0" y="1977.0">O sistema não a exibe como conteúdo público</tspan></text><circle cx="1020.0" cy="2060.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2060.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2143.0 1035.0,2158.0 1020.0,2173.0 1005.0,2158.0"/><rect class="node system-node" x="825.0" y="2216.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2245.0" text-anchor="middle"><tspan x="1020.0" y="2245.0">Resultado: Atrações publicadas são exibidas</tspan><tspan x="1020.0" y="2265.0">ao visitante.</tspan></text><circle cx="1020.0" cy="2339.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2339.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1221.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1006.0" text-anchor="start"><tspan x="110.0" y="1006.0">A1 — O visitante identifica um dado incorreto</tspan></text><text class="guard" x="92" y="880.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1667.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1456.0" text-anchor="start"><tspan x="110.0" y="1456.0">A2 — O visitante deseja compartilhar a atração</tspan></text><text class="guard" x="92" y="1330.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2065.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1902.0" text-anchor="start"><tspan x="110.0" y="1902.0">E1 — A atração não possui vínculo válido com um equipamento ativo</tspan></text><text class="guard" x="92" y="1776.0">[fluxo principal]</text>

  <g transform="translate(340.0 2434.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
