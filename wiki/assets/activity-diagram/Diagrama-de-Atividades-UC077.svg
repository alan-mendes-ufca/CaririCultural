  <title id="title">Diagrama de Atividades UML — UC-077 — Votar em enquete sob as regras de ciclo de vida</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="3675.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-077</text>
  <text class="subtitle" x="70" y="75">Votar em enquete sob as regras de ciclo de vida · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="3425.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#A7F3D0"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">VOTANTE ANÔNIMO</tspan></text><rect x="546.7" y="100" width="486.7" height="3425.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="3425.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#FDE68A"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">CRIADOR DA ENQUETE</tspan></text>
  <rect class="alternative-band" x="88" y="1081.0" width="1404.1" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1531.0" width="1404.1" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1981.0" width="1404.1" height="186.0" rx="18"/><rect class="exception-band" x="88" y="2431.0" width="1404.1" height="222.0" rx="18"/><rect class="exception-band" x="88" y="2917.0" width="1404.1" height="222.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V233.5 H790.0 V270.0"/><path class="flow" d="M790.0 358.0 V385.5 H303.4 V413.0"/><path class="flow" d="M303.4 501.0 V556.0"/><path class="flow" d="M303.4 644.0 V671.5 H790.0 V699.0"/><path class="flow" d="M790.0 767.0 V822.0"/><path class="flow" d="M790.0 890.0 V945.0"/><path class="branch-bus no-arrow" d="M880.0 997.0 H1530.1 V1131.0"/><path class="flow" d="M1530.1 1131.0 H1276.8 V1151.0"/><path class="main-flow" d="M700.0 997.0 H80.0 V1337.0 H775.0"/><path class="return-flow no-arrow" d="M1276.8 1219.0 H1562.1 V1337.0"/><path class="return-flow" d="M1562.1 1337.0 H805.0"/><path class="flow" d="M790.0 1352.0 V1395.0"/><path class="branch-bus no-arrow" d="M880.0 1447.0 H1530.1 V1581.0"/><path class="flow" d="M1530.1 1581.0 H1276.8 V1601.0"/><path class="main-flow" d="M700.0 1447.0 H80.0 V1787.0 H775.0"/><path class="return-flow no-arrow" d="M1276.8 1669.0 H1562.1 V1787.0"/><path class="return-flow" d="M1562.1 1787.0 H805.0"/><path class="flow" d="M790.0 1802.0 V1845.0"/><path class="branch-bus no-arrow" d="M880.0 1897.0 H1530.1 V2031.0"/><path class="flow" d="M1530.1 2031.0 H1276.8 V2051.0"/><path class="main-flow" d="M700.0 1897.0 H80.0 V2237.0 H775.0"/><path class="return-flow no-arrow" d="M1276.8 2119.0 H1562.1 V2237.0"/><path class="return-flow" d="M1562.1 2237.0 H805.0"/><path class="flow" d="M790.0 2252.0 V2295.0"/><path class="branch-bus no-arrow" d="M880.0 2347.0 H1530.1 V2481.0"/><path class="error-flow" d="M1530.1 2481.0 H790.0 V2501.0"/><path class="main-flow" d="M700.0 2347.0 H80.0 V2723.0 H775.0"/><path class="error-flow" d="M790.0 2569.0 V2607.0"/><path class="flow" d="M790.0 2738.0 V2781.0"/><path class="branch-bus no-arrow" d="M880.0 2833.0 H1530.1 V2967.0"/><path class="error-flow" d="M1530.1 2967.0 H790.0 V2987.0"/><path class="main-flow" d="M700.0 2833.0 H80.0 V3209.0 H775.0"/><path class="error-flow" d="M790.0 3055.0 V3093.0"/><path class="flow" d="M790.0 3224.0 V3267.0"/><path class="flow" d="M790.0 3395.0 V3432.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node system-node" x="595.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="299.0" text-anchor="middle"><tspan x="790.0" y="299.0">O caso UC-029 inclui este caso a partir da</tspan><tspan x="790.0" y="319.0">criação da enquete e mantém suas regras</tspan><tspan x="790.0" y="339.0">válidas durante toda a existência dela.</tspan></text><rect class="node" x="108.4" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="442.0" text-anchor="middle"><tspan x="303.4" y="442.0">O votante abre o link público e o sistema</tspan><tspan x="303.4" y="462.0">mostra as opções e a situação atual da</tspan><tspan x="303.4" y="482.0">enquete.</tspan></text><rect class="node" x="108.4" y="556.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="585.0" text-anchor="middle"><tspan x="303.4" y="585.0">O votante escolhe uma opção (ou, se</tspan><tspan x="303.4" y="605.0">permitido, múltiplas até o limite definido) e</tspan><tspan x="303.4" y="625.0">confirma.</tspan></text><rect class="node system-node" x="595.0" y="699.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="728.0" text-anchor="middle"><tspan x="790.0" y="728.0">O sistema aplica os controles antifraude sem</tspan><tspan x="790.0" y="748.0">expor a identidade do votante.</tspan></text><rect class="node system-node" x="595.0" y="822.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="851.0" text-anchor="middle"><tspan x="790.0" y="851.0">O sistema contabiliza o voto e atualiza o</tspan><tspan x="790.0" y="871.0">resultado.</tspan></text><polygon class="node system-node decision" points="790.0,945.0 880.0,997.0 790.0,1049.0 700.0,997.0"/><text class="small" x="790.0" y="992.0" text-anchor="middle"><tspan x="790.0" y="992.0">Configuração permite</tspan><tspan x="790.0" y="1012.0">múltipla escolha?</tspan></text><rect class="node" x="1081.8" y="1151.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="1180.0" text-anchor="middle"><tspan x="1276.8" y="1180.0">O votante seleciona até o limite entre 1 e o</tspan><tspan x="1276.8" y="1200.0">número de opções definido pelo criador</tspan></text><polygon class="merge" points="790.0,1322.0 805.0,1337.0 790.0,1352.0 775.0,1337.0"/><polygon class="node system-node decision" points="790.0,1395.0 880.0,1447.0 790.0,1499.0 700.0,1447.0"/><text class="small" x="790.0" y="1452.0" text-anchor="middle"><tspan x="790.0" y="1452.0">A2 aplicável?</tspan></text><rect class="node" x="1081.8" y="1601.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="1630.0" text-anchor="middle"><tspan x="1276.8" y="1630.0">O criador altera as opções da enquete antes</tspan><tspan x="1276.8" y="1650.0">de registrado o primeiro voto</tspan></text><polygon class="merge" points="790.0,1772.0 805.0,1787.0 790.0,1802.0 775.0,1787.0"/><polygon class="node system-node decision" points="790.0,1845.0 880.0,1897.0 790.0,1949.0 700.0,1897.0"/><text class="small" x="790.0" y="1902.0" text-anchor="middle"><tspan x="790.0" y="1902.0">A3 aplicável?</tspan></text><rect class="node" x="1081.8" y="2051.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="2080.0" text-anchor="middle"><tspan x="1276.8" y="2080.0">O criador encerra a enquete manualmente antes</tspan><tspan x="1276.8" y="2100.0">do prazo previsto</tspan></text><polygon class="merge" points="790.0,2222.0 805.0,2237.0 790.0,2252.0 775.0,2237.0"/><polygon class="node system-node decision" points="790.0,2295.0 880.0,2347.0 790.0,2399.0 700.0,2347.0"/><text class="small" x="790.0" y="2352.0" text-anchor="middle"><tspan x="790.0" y="2352.0">Enquete encerrada?</tspan></text><rect class="node exception-node" x="595.0" y="2501.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="2530.0" text-anchor="middle"><tspan x="790.0" y="2530.0">O sistema não registra o voto e mostra apenas</tspan><tspan x="790.0" y="2550.0">o resultado disponível</tspan></text><circle cx="790.0" cy="2625.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="2625.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,2708.0 805.0,2723.0 790.0,2738.0 775.0,2723.0"/><polygon class="node system-node decision" points="790.0,2781.0 880.0,2833.0 790.0,2885.0 700.0,2833.0"/><text class="small" x="790.0" y="2818.0" text-anchor="middle"><tspan x="790.0" y="2818.0">Controle antifraude</tspan><tspan x="790.0" y="2838.0">rejeita duplicidade</tspan><tspan x="790.0" y="2858.0">de voto?</tspan></text><rect class="node exception-node" x="595.0" y="2987.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="3016.0" text-anchor="middle"><tspan x="790.0" y="3016.0">O sistema informa ao votante que o voto não</tspan><tspan x="790.0" y="3036.0">foi aceito</tspan></text><circle cx="790.0" cy="3111.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="3111.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,3194.0 805.0,3209.0 790.0,3224.0 775.0,3209.0"/><rect class="node system-node" x="595.0" y="3267.0" width="390.0" height="128.0" rx="18"/><text class="text" x="790.0" y="3296.0" text-anchor="middle"><tspan x="790.0" y="3296.0">Resultado: Voto é contabilizado sem exigir</tspan><tspan x="790.0" y="3316.0">login nem identificar o votante; resultado é</tspan><tspan x="790.0" y="3336.0">atualizado; a enquete respeita as regras de</tspan><tspan x="790.0" y="3356.0">edição e encerramento ao longo de todo o</tspan><tspan x="790.0" y="3376.0">ciclo.</tspan></text><circle cx="790.0" cy="3450.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="3450.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1328.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1113.0" text-anchor="start"><tspan x="110.0" y="1113.0">A1 — Configuração permite múltipla escolha</tspan></text><text class="guard" x="92" y="987.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="1778.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1563.0" text-anchor="start"><tspan x="110.0" y="1563.0">A2 — A2 aplicável</tspan></text><text class="guard" x="92" y="1437.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="2228.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="2013.0" text-anchor="start"><tspan x="110.0" y="2013.0">A3 — A3 aplicável</tspan></text><text class="guard" x="92" y="1887.0">[fluxo principal]</text><text class="result-label" x="818.0" y="2630.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2463.0" text-anchor="start"><tspan x="110.0" y="2463.0">E1 — Enquete encerrada</tspan></text><text class="guard" x="92" y="2337.0">[fluxo principal]</text><text class="result-label" x="818.0" y="3116.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2949.0" text-anchor="start"><tspan x="110.0" y="2949.0">E2 — Controle antifraude rejeita duplicidade de voto</tspan></text><text class="guard" x="92" y="2823.0">[fluxo principal]</text>

  <g transform="translate(430.0 3545.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
