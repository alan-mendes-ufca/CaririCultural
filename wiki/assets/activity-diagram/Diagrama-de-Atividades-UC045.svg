<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2320.0" viewBox="0 0 1400.0 2320.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-045 — Editar oferta</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2320.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-045</text>
  <text class="subtitle" x="70" y="75">Editar oferta · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2070.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FED7AA"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">ADMIN. DO ESTABELECIMENTO</tspan></text><rect x="700.0" y="100" width="640.0" height="2070.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1156.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1606.0" width="1224.0" height="218.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V516.0"/><path class="flow" d="M1020.0 604.0 V631.5 H380.0 V659.0"/><path class="flow" d="M380.0 723.0 V750.5 H1020.0 V778.0"/><path class="flow" d="M1020.0 842.0 V897.0"/><path class="flow" d="M1020.0 965.0 V1020.0"/><path class="branch-bus no-arrow" d="M1110.0 1072.0 H1350.0 V1206.0"/><path class="flow" d="M1350.0 1206.0 H1020.0 V1226.0"/><path class="main-flow" d="M930.0 1072.0 H80.0 V1412.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1294.0 H1382.0 V1412.0"/><path class="return-flow" d="M1382.0 1412.0 H1035.0"/><path class="flow" d="M1020.0 1427.0 V1470.0"/><path class="branch-bus no-arrow" d="M1110.0 1522.0 H1350.0 V1656.0"/><path class="error-flow" d="M1350.0 1656.0 H1020.0 V1676.0"/><path class="main-flow" d="M930.0 1522.0 H80.0 V1894.0 H1005.0"/><path class="error-flow" d="M1020.0 1740.0 V1778.0"/><path class="flow" d="M1020.0 1909.0 V1952.0"/><path class="flow" d="M1020.0 2040.0 V2077.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador seleciona uma oferta</tspan><tspan x="380.0" y="319.0">cadastrada</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">o sistema inclui UC-038 para confirmar a</tspan><tspan x="1020.0" y="442.0">sessão administrativa.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema verifica o escopo do administrador</tspan><tspan x="1020.0" y="565.0">sobre o estabelecimento e o vínculo da oferta</tspan><tspan x="1020.0" y="585.0">com o estabelecimento ativo (RN-066, RN-071).</tspan></text><rect class="node" x="185.0" y="659.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="696.0" text-anchor="middle"><tspan x="380.0" y="696.0">O administrador altera os dados necessários.</tspan></text><rect class="node system-node" x="825.0" y="778.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="815.0" text-anchor="middle"><tspan x="1020.0" y="815.0">O sistema valida os dados e o vínculo.</tspan></text><rect class="node system-node" x="825.0" y="897.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="926.0" text-anchor="middle"><tspan x="1020.0" y="926.0">O sistema salva a alteração e registra o</tspan><tspan x="1020.0" y="946.0">histórico da operação (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,1020.0 1110.0,1072.0 1020.0,1124.0 930.0,1072.0"/><text class="small" x="1020.0" y="1047.0" text-anchor="middle"><tspan x="1020.0" y="1047.0">A edição invalida o</tspan><tspan x="1020.0" y="1067.0">vínculo com o</tspan><tspan x="1020.0" y="1087.0">estabelecimento</tspan><tspan x="1020.0" y="1107.0">ativo?</tspan></text><rect class="node system-node" x="825.0" y="1226.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1255.0" text-anchor="middle"><tspan x="1020.0" y="1255.0">A oferta deixa de ficar visível ao público</tspan><tspan x="1020.0" y="1275.0">(RN-072)</tspan></text><polygon class="merge" points="1020.0,1397.0 1035.0,1412.0 1020.0,1427.0 1005.0,1412.0"/><polygon class="node system-node decision" points="1020.0,1470.0 1110.0,1522.0 1020.0,1574.0 930.0,1522.0"/><text class="small" x="1020.0" y="1507.0" text-anchor="middle"><tspan x="1020.0" y="1507.0">A oferta não pertence</tspan><tspan x="1020.0" y="1527.0">ao escopo do</tspan><tspan x="1020.0" y="1547.0">administrador?</tspan></text><rect class="node exception-node" x="825.0" y="1676.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1713.0" text-anchor="middle"><tspan x="1020.0" y="1713.0">O sistema nega a alteração (RN-066)</tspan></text><circle cx="1020.0" cy="1796.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1796.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1879.0 1035.0,1894.0 1020.0,1909.0 1005.0,1894.0"/><rect class="node system-node" x="825.0" y="1952.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1981.0" text-anchor="middle"><tspan x="1020.0" y="1981.0">Resultado: Dados da oferta são atualizados;</tspan><tspan x="1020.0" y="2001.0">oferta sem vínculo válido deixa de ficar</tspan><tspan x="1020.0" y="2021.0">visível ao público.</tspan></text><circle cx="1020.0" cy="2095.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2095.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1403.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1188.0" text-anchor="start"><tspan x="110.0" y="1188.0">A1 — A edição invalida o vínculo com o estabelecimento ativo</tspan></text><text class="guard" x="92" y="1062.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1801.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1638.0" text-anchor="start"><tspan x="110.0" y="1638.0">E1 — A oferta não pertence ao escopo do administrador</tspan></text><text class="guard" x="92" y="1512.0">[fluxo principal]</text>

  <g transform="translate(340.0 2190.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
