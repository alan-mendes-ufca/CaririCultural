<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="3161.0" viewBox="0 0 1400.0 3161.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-013 — Publicar avaliação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="3161.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-013</text>
  <text class="subtitle" x="70" y="75">Publicar avaliação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2911.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="2911.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1017.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1467.0" width="1224.0" height="226.0" rx="18"/><rect class="exception-band" x="88" y="1957.0" width="1224.0" height="222.0" rx="18"/><rect class="exception-band" x="88" y="2443.0" width="1224.0" height="242.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V393.0"/><path class="flow" d="M380.0 461.0 V488.5 H1020.0 V516.0"/><path class="flow" d="M1020.0 584.0 V611.5 H380.0 V639.0"/><path class="flow" d="M380.0 703.0 V730.5 H1020.0 V758.0"/><path class="flow" d="M1020.0 826.0 V881.0"/><path class="branch-bus no-arrow" d="M1110.0 933.0 H1350.0 V1067.0"/><path class="flow" d="M1350.0 1067.0 H1020.0 V1087.0"/><path class="main-flow" d="M930.0 933.0 H80.0 V1273.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1155.0 H1382.0 V1273.0"/><path class="return-flow" d="M1382.0 1273.0 H1035.0"/><path class="flow" d="M1020.0 1288.0 V1331.0"/><path class="branch-bus no-arrow" d="M1110.0 1383.0 H1350.0 V1517.0"/><path class="flow" d="M1350.0 1517.0 H1020.0 V1537.0"/><path class="main-flow" d="M930.0 1383.0 H80.0 V1763.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1645.0 H1382.0 V1763.0"/><path class="return-flow" d="M1382.0 1763.0 H1035.0"/><path class="flow" d="M1020.0 1778.0 V1821.0"/><path class="branch-bus no-arrow" d="M1110.0 1873.0 H1350.0 V2007.0"/><path class="error-flow" d="M1350.0 2007.0 H1020.0 V2027.0"/><path class="main-flow" d="M930.0 1873.0 H80.0 V2249.0 H1005.0"/><path class="error-flow" d="M1020.0 2095.0 V2133.0"/><path class="flow" d="M1020.0 2264.0 V2307.0"/><path class="branch-bus no-arrow" d="M1110.0 2359.0 H1350.0 V2493.0"/><path class="error-flow" d="M1350.0 2493.0 H1020.0 V2513.0"/><path class="main-flow" d="M930.0 2359.0 H80.0 V2755.0 H1005.0"/><path class="error-flow" d="M1020.0 2601.0 V2639.0"/><path class="flow" d="M1020.0 2770.0 V2813.0"/><path class="flow" d="M1020.0 2881.0 V2918.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O usuário abre o formulário de avaliação do</tspan><tspan x="380.0" y="319.0">local.</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="422.0" text-anchor="middle"><tspan x="380.0" y="422.0">Informa nota, comentário e, opcionalmente,</tspan><tspan x="380.0" y="442.0">contexto e mídias.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema valida formato e vínculo do</tspan><tspan x="1020.0" y="565.0">conteúdo enviado.</tspan></text><rect class="node" x="185.0" y="639.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="676.0" text-anchor="middle"><tspan x="380.0" y="676.0">O usuário confirma o envio.</tspan></text><rect class="node system-node" x="825.0" y="758.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="787.0" text-anchor="middle"><tspan x="1020.0" y="787.0">O sistema associa a avaliação ao perfil do</tspan><tspan x="1020.0" y="807.0">autor e a publica ou encaminha à moderação.</tspan></text><polygon class="node system-node decision" points="1020.0,881.0 1110.0,933.0 1020.0,985.0 930.0,933.0"/><text class="small" x="1020.0" y="928.0" text-anchor="middle"><tspan x="1020.0" y="928.0">A avaliação contém</tspan><tspan x="1020.0" y="948.0">mídia?</tspan></text><rect class="node system-node" x="825.0" y="1087.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1116.0" text-anchor="middle"><tspan x="1020.0" y="1116.0">O envio de arquivo segue as validações</tspan><tspan x="1020.0" y="1136.0">descritas em UC-031</tspan></text><polygon class="merge" points="1020.0,1258.0 1035.0,1273.0 1020.0,1288.0 1005.0,1273.0"/><polygon class="node system-node decision" points="1020.0,1331.0 1110.0,1383.0 1020.0,1435.0 930.0,1383.0"/><text class="small" x="1020.0" y="1358.0" text-anchor="middle"><tspan x="1020.0" y="1358.0">O usuário também</tspan><tspan x="1020.0" y="1378.0">percebe um dado</tspan><tspan x="1020.0" y="1398.0">cadastral incorreto</tspan><tspan x="1020.0" y="1418.0">no mesmo local?</tspan></text><rect class="node system-node" x="825.0" y="1537.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1020.0" y="1566.0" text-anchor="middle"><tspan x="1020.0" y="1566.0">Essa ação é tratada separadamente pelo caso</tspan><tspan x="1020.0" y="1586.0">de sinalização de dado incorreto (UC-080,</tspan><tspan x="1020.0" y="1606.0">fora deste escopo), preservando a avaliação</tspan><tspan x="1020.0" y="1626.0">já preenchida</tspan></text><polygon class="merge" points="1020.0,1748.0 1035.0,1763.0 1020.0,1778.0 1005.0,1763.0"/><polygon class="node system-node decision" points="1020.0,1821.0 1110.0,1873.0 1020.0,1925.0 930.0,1873.0"/><text class="small" x="1020.0" y="1868.0" text-anchor="middle"><tspan x="1020.0" y="1868.0">Conteúdo viola regra</tspan><tspan x="1020.0" y="1888.0">grave?</tspan></text><rect class="node exception-node" x="825.0" y="2027.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2056.0" text-anchor="middle"><tspan x="1020.0" y="2056.0">O sistema rejeita ou oculta a avaliação e</tspan><tspan x="1020.0" y="2076.0">informa o motivo aplicável</tspan></text><circle cx="1020.0" cy="2151.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2151.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2234.0 1035.0,2249.0 1020.0,2264.0 1005.0,2249.0"/><polygon class="node system-node decision" points="1020.0,2307.0 1110.0,2359.0 1020.0,2411.0 930.0,2359.0"/><text class="small" x="1020.0" y="2354.0" text-anchor="middle"><tspan x="1020.0" y="2354.0">Sessão expira durante</tspan><tspan x="1020.0" y="2374.0">o preenchimento?</tspan></text><rect class="node exception-node" x="825.0" y="2513.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2542.0" text-anchor="middle"><tspan x="1020.0" y="2542.0">O caso aciona a extensão UC-073, que preserva</tspan><tspan x="1020.0" y="2562.0">o conteúdo já preenchido e solicita nova</tspan><tspan x="1020.0" y="2582.0">autenticação antes de restaurá-lo</tspan></text><circle cx="1020.0" cy="2657.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2657.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2740.0 1035.0,2755.0 1020.0,2770.0 1005.0,2755.0"/><rect class="node system-node" x="825.0" y="2813.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2842.0" text-anchor="middle"><tspan x="1020.0" y="2842.0">Resultado: Avaliação é enviada para</tspan><tspan x="1020.0" y="2862.0">publicação ou moderação e vinculada ao autor.</tspan></text><circle cx="1020.0" cy="2936.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2936.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1264.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1049.0" text-anchor="start"><tspan x="110.0" y="1049.0">A1 — A avaliação contém mídia</tspan></text><text class="guard" x="92" y="923.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1754.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1499.0" text-anchor="start"><tspan x="110.0" y="1499.0">A2 — O usuário também percebe um dado cadastral incorreto no mesmo local</tspan></text><text class="guard" x="92" y="1373.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2156.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1989.0" text-anchor="start"><tspan x="110.0" y="1989.0">E1 — Conteúdo viola regra grave</tspan></text><text class="guard" x="92" y="1863.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2662.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2475.0" text-anchor="start"><tspan x="110.0" y="2475.0">E2 — Sessão expira durante o preenchimento</tspan></text><text class="guard" x="92" y="2349.0">[fluxo principal]</text>

  <g transform="translate(340.0 3031.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
