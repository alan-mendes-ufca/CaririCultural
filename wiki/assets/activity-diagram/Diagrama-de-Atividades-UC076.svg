<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2066.0" viewBox="0 0 1400.0 2066.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-076 — Alertar item de checklist vinculado a atração inativa</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2066.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-076</text>
  <text class="subtitle" x="70" y="75">Alertar item de checklist vinculado a atração inativa · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1816.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="1816.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="914.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1364.0" width="1224.0" height="206.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 334.0 V361.5 H1020.0 V389.0"/><path class="flow" d="M1020.0 457.0 V512.0"/><path class="flow" d="M1020.0 580.0 V635.0"/><path class="flow" d="M1020.0 723.0 V778.0"/><path class="branch-bus no-arrow" d="M1110.0 830.0 H1350.0 V964.0"/><path class="flow" d="M1350.0 964.0 H1020.0 V984.0"/><path class="main-flow" d="M930.0 830.0 H80.0 V1170.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1052.0 H1382.0 V1170.0"/><path class="return-flow" d="M1382.0 1170.0 H1035.0"/><path class="flow" d="M1020.0 1185.0 V1228.0"/><path class="branch-bus no-arrow" d="M1110.0 1280.0 H1350.0 V1414.0"/><path class="error-flow" d="M1350.0 1414.0 H1020.0 V1434.0"/><path class="main-flow" d="M930.0 1280.0 H80.0 V1640.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1522.0 H1382.0 V1640.0"/><path class="return-flow" d="M1382.0 1640.0 H1035.0"/><path class="flow" d="M1020.0 1655.0 V1698.0"/><path class="flow" d="M1020.0 1786.0 V1823.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O usuário abre o checklist (UC-020).</tspan></text><rect class="node system-node" x="825.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="418.0" text-anchor="middle"><tspan x="1020.0" y="418.0">O sistema verifica o estado da atração</tspan><tspan x="1020.0" y="438.0">vinculada a cada item.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="541.0" text-anchor="middle"><tspan x="1020.0" y="541.0">O sistema identifica um item cuja atração</tspan><tspan x="1020.0" y="561.0">está inativa ou arquivada.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema exibe um alerta visível ao lado do</tspan><tspan x="1020.0" y="684.0">item, sem bloquear as demais interações do</tspan><tspan x="1020.0" y="704.0">checklist.</tspan></text><polygon class="node system-node decision" points="1020.0,778.0 1110.0,830.0 1020.0,882.0 930.0,830.0"/><text class="small" x="1020.0" y="825.0" text-anchor="middle"><tspan x="1020.0" y="825.0">A atração volta a</tspan><tspan x="1020.0" y="845.0">ficar ativa?</tspan></text><rect class="node system-node" x="825.0" y="984.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1013.0" text-anchor="middle"><tspan x="1020.0" y="1013.0">O alerta deixa de ser exibido no próximo</tspan><tspan x="1020.0" y="1033.0">carregamento do checklist</tspan></text><polygon class="merge" points="1020.0,1155.0 1035.0,1170.0 1020.0,1185.0 1005.0,1170.0"/><polygon class="node system-node decision" points="1020.0,1228.0 1110.0,1280.0 1020.0,1332.0 930.0,1280.0"/><text class="small" x="1020.0" y="1265.0" text-anchor="middle"><tspan x="1020.0" y="1265.0">Usuário tenta marcar</tspan><tspan x="1020.0" y="1285.0">o item alertado como</tspan><tspan x="1020.0" y="1305.0">concluído?</tspan></text><rect class="node exception-node" x="825.0" y="1434.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1463.0" text-anchor="middle"><tspan x="1020.0" y="1463.0">O sistema permite a marcação pessoal, mas</tspan><tspan x="1020.0" y="1483.0">mantém o alerta visível, deixando claro que o</tspan><tspan x="1020.0" y="1503.0">dado oficial não foi alterado</tspan></text><polygon class="merge" points="1020.0,1625.0 1035.0,1640.0 1020.0,1655.0 1005.0,1640.0"/><rect class="node system-node" x="825.0" y="1698.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1727.0" text-anchor="middle"><tspan x="1020.0" y="1727.0">Resultado: Usuário visualiza o alerta; o</tspan><tspan x="1020.0" y="1747.0">andamento pessoal e o dado oficial da atração</tspan><tspan x="1020.0" y="1767.0">permanecem inalterados.</tspan></text><circle cx="1020.0" cy="1841.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1841.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1161.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="946.0" text-anchor="start"><tspan x="110.0" y="946.0">A1 — A atração volta a ficar ativa</tspan></text><text class="guard" x="92" y="820.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1631.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1396.0" text-anchor="start"><tspan x="110.0" y="1396.0">E1 — Usuário tenta marcar o item alertado como concluído</tspan></text><text class="guard" x="92" y="1270.0">[fluxo principal]</text>

  <g transform="translate(340.0 1936.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
