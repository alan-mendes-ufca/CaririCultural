<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2066.8" height="1955.0" viewBox="0 0 2066.8 1955.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-038 — Autenticar administrador</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="2066.8" height="1955.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-038</text>
  <text class="subtitle" x="70" y="75">Autenticar administrador · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1705.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FECDD3"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">ADMIN. DO EQUIPAMENTO</tspan></text><rect x="546.7" y="100" width="486.7" height="1705.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="1705.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#FBCFE8"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">ADMIN. DA PLATAFORMA</tspan></text><rect x="1520.1" y="100" width="486.7" height="1705.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1530.1 100 H1996.8 Q2006.8 100 2006.8 110 V155 H1520.1 V110 Q1520.1 100 1530.1 100 Z" fill="#FED7AA"/><text class="lane-title" x="1763.5" y="133.0" text-anchor="middle"><tspan x="1763.5" y="133.0">ADMIN. DO ESTABELECIMENTO</tspan></text>
  <rect class="alternative-band" x="88" y="791.0" width="1890.8" height="206.0" rx="18"/><rect class="exception-band" x="88" y="1261.0" width="1890.8" height="218.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 334.0 V361.5 H790.0 V389.0"/><path class="flow" d="M790.0 457.0 V512.0"/><path class="flow" d="M790.0 600.0 V655.0"/><path class="branch-bus no-arrow" d="M880.0 707.0 H2016.8 V841.0"/><path class="flow" d="M2016.8 841.0 H790.0 V861.0"/><path class="main-flow" d="M700.0 707.0 H80.0 V1067.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 949.0 H2048.8 V1067.0"/><path class="return-flow" d="M2048.8 1067.0 H805.0"/><path class="flow" d="M790.0 1082.0 V1125.0"/><path class="branch-bus no-arrow" d="M880.0 1177.0 H2016.8 V1311.0"/><path class="error-flow" d="M2016.8 1311.0 H790.0 V1331.0"/><path class="main-flow" d="M700.0 1177.0 H80.0 V1549.0 H775.0"/><path class="error-flow" d="M790.0 1395.0 V1433.0"/><path class="flow" d="M790.0 1564.0 V1607.0"/><path class="flow" d="M790.0 1675.0 V1712.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="303.4" y="307.0" text-anchor="middle"><tspan x="303.4" y="307.0">O administrador informa suas credenciais.</tspan></text><rect class="node system-node" x="595.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="418.0" text-anchor="middle"><tspan x="790.0" y="418.0">O sistema verifica a identidade e o vínculo</tspan><tspan x="790.0" y="438.0">administrativo aplicável.</tspan></text><rect class="node system-node" x="595.0" y="512.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="541.0" text-anchor="middle"><tspan x="790.0" y="541.0">O sistema inicia uma sessão com as permissões</tspan><tspan x="790.0" y="561.0">correspondentes ao escopo autorizado</tspan><tspan x="790.0" y="581.0">(RN-023).</tspan></text><polygon class="node system-node decision" points="790.0,655.0 880.0,707.0 790.0,759.0 700.0,707.0"/><text class="small" x="790.0" y="692.0" text-anchor="middle"><tspan x="790.0" y="692.0">A conta ainda não</tspan><tspan x="790.0" y="712.0">possui vínculo com um</tspan><tspan x="790.0" y="732.0">equipamento?</tspan></text><rect class="node system-node" x="595.0" y="861.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="890.0" text-anchor="middle"><tspan x="790.0" y="890.0">O sistema mantém apenas as permissões</tspan><tspan x="790.0" y="910.0">compatíveis e orienta a associação por</tspan><tspan x="790.0" y="930.0">UC-037, quando necessária</tspan></text><polygon class="merge" points="790.0,1052.0 805.0,1067.0 790.0,1082.0 775.0,1067.0"/><polygon class="node system-node decision" points="790.0,1125.0 880.0,1177.0 790.0,1229.0 700.0,1177.0"/><text class="small" x="790.0" y="1172.0" text-anchor="middle"><tspan x="790.0" y="1172.0">Credenciais inválidas</tspan><tspan x="790.0" y="1192.0">ou conta inativa?</tspan></text><rect class="node exception-node" x="595.0" y="1331.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="1368.0" text-anchor="middle"><tspan x="790.0" y="1368.0">O sistema não inicia a sessão administrativa</tspan></text><circle cx="790.0" cy="1451.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1451.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1534.0 805.0,1549.0 790.0,1564.0 775.0,1549.0"/><rect class="node system-node" x="595.0" y="1607.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1636.0" text-anchor="middle"><tspan x="790.0" y="1636.0">Resultado: Sessão administrativa é iniciada</tspan><tspan x="790.0" y="1656.0">com o escopo de acesso aplicável.</tspan></text><circle cx="790.0" cy="1730.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="1730.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="2028.8" y="1058.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="823.0" text-anchor="start"><tspan x="110.0" y="823.0">A1 — A conta ainda não possui vínculo com um equipamento</tspan></text><text class="guard" x="92" y="697.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1456.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1293.0" text-anchor="start"><tspan x="110.0" y="1293.0">E1 — Credenciais inválidas ou conta inativa</tspan></text><text class="guard" x="92" y="1167.0">[fluxo principal]</text>

  <g transform="translate(673.4 1825.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
