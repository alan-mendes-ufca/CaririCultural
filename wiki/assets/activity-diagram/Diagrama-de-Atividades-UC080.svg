<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2066.8" height="4758.0" viewBox="0 0 2066.8 4758.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-080 — Sinalizar e acompanhar dado incorreto</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="2066.8" height="4758.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-080</text>
  <text class="subtitle" x="70" y="75">Sinalizar e acompanhar dado incorreto · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="4508.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="546.7" y="100" width="486.7" height="4508.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="4508.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#F5D0FE"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">ADMIN. AUTORIZADO</tspan></text><rect x="1520.1" y="100" width="486.7" height="4508.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1530.1 100 H1996.8 Q2006.8 100 2006.8 110 V155 H1520.1 V110 Q1520.1 100 1530.1 100 Z" fill="#D9F99D"/><text class="lane-title" x="1763.5" y="133.0" text-anchor="middle"><tspan x="1763.5" y="133.0">RESPONSÁVEL PELO LOCAL</tspan></text>
  <rect class="alternative-band" x="88" y="1284.0" width="1890.8" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1734.0" width="1890.8" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="2184.0" width="1890.8" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="2634.0" width="1890.8" height="206.0" rx="18"/><rect class="exception-band" x="88" y="3104.0" width="1890.8" height="186.0" rx="18"/><rect class="exception-band" x="88" y="3554.0" width="1890.8" height="218.0" rx="18"/><rect class="exception-band" x="88" y="4036.0" width="1890.8" height="186.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 358.0 V413.0"/><path class="flow" d="M303.4 501.0 V528.5 H790.0 V556.0"/><path class="flow" d="M790.0 644.0 V671.5 H1276.8 V699.0"/><path class="flow" d="M1276.8 807.0 V862.0"/><path class="flow" d="M1276.8 950.0 V977.5 H790.0 V1005.0"/><path class="flow" d="M790.0 1093.0 V1148.0"/><path class="branch-bus no-arrow" d="M880.0 1200.0 H2016.8 V1334.0"/><path class="flow" d="M2016.8 1334.0 H790.0 V1354.0"/><path class="main-flow" d="M700.0 1200.0 H80.0 V1540.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1422.0 H2048.8 V1540.0"/><path class="return-flow" d="M2048.8 1540.0 H805.0"/><path class="flow" d="M790.0 1555.0 V1598.0"/><path class="branch-bus no-arrow" d="M880.0 1650.0 H2016.8 V1784.0"/><path class="flow" d="M2016.8 1784.0 H790.0 V1804.0"/><path class="main-flow" d="M700.0 1650.0 H80.0 V1990.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1872.0 H2048.8 V1990.0"/><path class="return-flow" d="M2048.8 1990.0 H805.0"/><path class="flow" d="M790.0 2005.0 V2048.0"/><path class="branch-bus no-arrow" d="M880.0 2100.0 H2016.8 V2234.0"/><path class="flow" d="M2016.8 2234.0 H1276.8 V2254.0"/><path class="main-flow" d="M700.0 2100.0 H80.0 V2440.0 H775.0"/><path class="return-flow no-arrow" d="M1276.8 2322.0 H2048.8 V2440.0"/><path class="return-flow" d="M2048.8 2440.0 H805.0"/><path class="flow" d="M790.0 2455.0 V2498.0"/><path class="branch-bus no-arrow" d="M880.0 2550.0 H2016.8 V2684.0"/><path class="flow" d="M2016.8 2684.0 H303.4 V2704.0"/><path class="main-flow" d="M700.0 2550.0 H80.0 V2910.0 H775.0"/><path class="return-flow no-arrow" d="M303.4 2792.0 H2048.8 V2910.0"/><path class="return-flow" d="M2048.8 2910.0 H805.0"/><path class="flow" d="M790.0 2925.0 V2968.0"/><path class="branch-bus no-arrow" d="M880.0 3020.0 H2016.8 V3154.0"/><path class="error-flow" d="M2016.8 3154.0 H790.0 V3174.0"/><path class="main-flow" d="M700.0 3020.0 H80.0 V3360.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 3242.0 H2048.8 V3360.0"/><path class="return-flow" d="M2048.8 3360.0 H805.0"/><path class="flow" d="M790.0 3375.0 V3418.0"/><path class="branch-bus no-arrow" d="M880.0 3470.0 H2016.8 V3604.0"/><path class="error-flow" d="M2016.8 3604.0 H790.0 V3624.0"/><path class="main-flow" d="M700.0 3470.0 H80.0 V3842.0 H775.0"/><path class="error-flow" d="M790.0 3688.0 V3726.0"/><path class="flow" d="M790.0 3857.0 V3900.0"/><path class="branch-bus no-arrow" d="M880.0 3952.0 H2016.8 V4086.0"/><path class="error-flow" d="M2016.8 4086.0 H303.4 V4106.0"/><path class="main-flow" d="M700.0 3952.0 H80.0 V4292.0 H775.0"/><path class="return-flow no-arrow" d="M303.4 4174.0 H2048.8 V4292.0"/><path class="return-flow" d="M2048.8 4292.0 H805.0"/><path class="flow" d="M790.0 4307.0 V4350.0"/><path class="flow" d="M790.0 4478.0 V4515.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="299.0" text-anchor="middle"><tspan x="303.4" y="299.0">O usuário aciona “Sinalizar dado incorreto”</tspan><tspan x="303.4" y="319.0">no local, evento, equipamento cultural ou</tspan><tspan x="303.4" y="339.0">atração.</tspan></text><rect class="node" x="108.4" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="442.0" text-anchor="middle"><tspan x="303.4" y="442.0">Seleciona o campo afetado, informa o valor</tspan><tspan x="303.4" y="462.0">observado, data da constatação e,</tspan><tspan x="303.4" y="482.0">opcionalmente, anexa evidência.</tspan></text><rect class="node system-node" x="595.0" y="556.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="585.0" text-anchor="middle"><tspan x="790.0" y="585.0">O sistema valida o envio, preserva uma cópia</tspan><tspan x="790.0" y="605.0">do valor publicado e cria um protocolo com</tspan><tspan x="790.0" y="625.0">estado “pendente”.</tspan></text><rect class="node" x="1081.8" y="699.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1276.8" y="728.0" text-anchor="middle"><tspan x="1276.8" y="728.0">O administrador em função de curadoria</tspan><tspan x="1276.8" y="748.0">compara a sinalização com fonte verificável</tspan><tspan x="1276.8" y="768.0">e, quando necessário, solicita confirmação ao</tspan><tspan x="1276.8" y="788.0">responsável pelo local.</tspan></text><rect class="node" x="1081.8" y="862.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1276.8" y="891.0" text-anchor="middle"><tspan x="1276.8" y="891.0">Confirmada a inconsistência, o administrador</tspan><tspan x="1276.8" y="911.0">corrige ou invalida o campo e registra fonte,</tspan><tspan x="1276.8" y="931.0">data, responsável e justificativa da decisão.</tspan></text><rect class="node system-node" x="595.0" y="1005.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1034.0" text-anchor="middle"><tspan x="790.0" y="1034.0">O sistema atualiza a data de verificação,</tspan><tspan x="790.0" y="1054.0">encerra o protocolo e comunica o resultado ao</tspan><tspan x="790.0" y="1074.0">usuário que sinalizou.</tspan></text><polygon class="node system-node decision" points="790.0,1148.0 880.0,1200.0 790.0,1252.0 700.0,1200.0"/><text class="small" x="790.0" y="1195.0" text-anchor="middle"><tspan x="790.0" y="1195.0">Já existe sinalização</tspan><tspan x="790.0" y="1215.0">equivalente pendente?</tspan></text><rect class="node system-node" x="595.0" y="1354.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1383.0" text-anchor="middle"><tspan x="790.0" y="1383.0">O sistema associa o novo relato ao protocolo</tspan><tspan x="790.0" y="1403.0">existente, preservando autoria e evidências</tspan></text><polygon class="merge" points="790.0,1525.0 805.0,1540.0 790.0,1555.0 775.0,1540.0"/><polygon class="node system-node decision" points="790.0,1598.0 880.0,1650.0 790.0,1702.0 700.0,1650.0"/><text class="small" x="790.0" y="1645.0" text-anchor="middle"><tspan x="790.0" y="1645.0">A apuração ainda não</tspan><tspan x="790.0" y="1665.0">terminou?</tspan></text><rect class="node system-node" x="595.0" y="1804.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1833.0" text-anchor="middle"><tspan x="790.0" y="1833.0">O campo permanece “em revisão” sem substituir</tspan><tspan x="790.0" y="1853.0">automaticamente o dado oficial</tspan></text><polygon class="merge" points="790.0,1975.0 805.0,1990.0 790.0,2005.0 775.0,1990.0"/><polygon class="node system-node decision" points="790.0,2048.0 880.0,2100.0 790.0,2152.0 700.0,2100.0"/><text class="small" x="790.0" y="2095.0" text-anchor="middle"><tspan x="790.0" y="2095.0">A sinalização não</tspan><tspan x="790.0" y="2115.0">procede?</tspan></text><rect class="node" x="1081.8" y="2254.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="2283.0" text-anchor="middle"><tspan x="1276.8" y="2283.0">O administrador mantém o valor, registra a</tspan><tspan x="1276.8" y="2303.0">justificativa e comunica o encerramento</tspan></text><polygon class="merge" points="790.0,2425.0 805.0,2440.0 790.0,2455.0 775.0,2440.0"/><polygon class="node system-node decision" points="790.0,2498.0 880.0,2550.0 790.0,2602.0 700.0,2550.0"/><text class="small" x="790.0" y="2535.0" text-anchor="middle"><tspan x="790.0" y="2535.0">O usuário inicia a</tspan><tspan x="790.0" y="2555.0">sinalização sem estar</tspan><tspan x="790.0" y="2575.0">autenticado?</tspan></text><rect class="node" x="108.4" y="2704.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.4" y="2733.0" text-anchor="middle"><tspan x="303.4" y="2733.0">Aciona-se a extensão UC-073, que preserva o</tspan><tspan x="303.4" y="2753.0">conteúdo preenchido e retoma o envio após a</tspan><tspan x="303.4" y="2773.0">autenticação</tspan></text><polygon class="merge" points="790.0,2895.0 805.0,2910.0 790.0,2925.0 775.0,2910.0"/><polygon class="node system-node decision" points="790.0,2968.0 880.0,3020.0 790.0,3072.0 700.0,3020.0"/><text class="small" x="790.0" y="3015.0" text-anchor="middle"><tspan x="790.0" y="3015.0">Evidência inválida ou</tspan><tspan x="790.0" y="3035.0">maliciosa?</tspan></text><rect class="node exception-node" x="595.0" y="3174.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="3203.0" text-anchor="middle"><tspan x="790.0" y="3203.0">O arquivo é bloqueado e a sinalização textual</tspan><tspan x="790.0" y="3223.0">pode continuar se contiver dados suficientes</tspan></text><polygon class="merge" points="790.0,3345.0 805.0,3360.0 790.0,3375.0 775.0,3360.0"/><polygon class="node system-node decision" points="790.0,3418.0 880.0,3470.0 790.0,3522.0 700.0,3470.0"/><text class="small" x="790.0" y="3445.0" text-anchor="middle"><tspan x="790.0" y="3445.0">Campo crítico não</tspan><tspan x="790.0" y="3465.0">pode ser verificado e</tspan><tspan x="790.0" y="3485.0">pode causar risco</tspan><tspan x="790.0" y="3505.0">imediato?</tspan></text><rect class="node exception-node" x="595.0" y="3624.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="3661.0" text-anchor="middle"><tspan x="790.0" y="3661.0">O sistema o oculta preventivamente</tspan></text><circle cx="790.0" cy="3744.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="3744.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,3827.0 805.0,3842.0 790.0,3857.0 775.0,3842.0"/><polygon class="node system-node decision" points="790.0,3900.0 880.0,3952.0 790.0,4004.0 700.0,3952.0"/><text class="small" x="790.0" y="3947.0" text-anchor="middle"><tspan x="790.0" y="3947.0">Falha ao registrar o</tspan><tspan x="790.0" y="3967.0">protocolo?</tspan></text><rect class="node exception-node" x="108.4" y="4106.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.4" y="4135.0" text-anchor="middle"><tspan x="303.4" y="4135.0">Nenhum cadastro é alterado e o sistema</tspan><tspan x="303.4" y="4155.0">orienta nova tentativa</tspan></text><polygon class="merge" points="790.0,4277.0 805.0,4292.0 790.0,4307.0 775.0,4292.0"/><rect class="node system-node" x="595.0" y="4350.0" width="390.0" height="128.0" rx="18"/><text class="text" x="790.0" y="4379.0" text-anchor="middle"><tspan x="790.0" y="4379.0">Resultado: Sinalização possui protocolo e</tspan><tspan x="790.0" y="4399.0">estado rastreável; após análise, o dado é</tspan><tspan x="790.0" y="4419.0">corrigido, mantido com justificativa ou</tspan><tspan x="790.0" y="4439.0">marcado como não verificável; o autor recebe</tspan><tspan x="790.0" y="4459.0">o resultado.</tspan></text><circle cx="790.0" cy="4533.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="4533.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="2028.8" y="1531.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1316.0" text-anchor="start"><tspan x="110.0" y="1316.0">A1 — Já existe sinalização equivalente pendente</tspan></text><text class="guard" x="92" y="1190.0">[fluxo principal]</text><text class="result-label" x="2028.8" y="1981.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1766.0" text-anchor="start"><tspan x="110.0" y="1766.0">A2 — A apuração ainda não terminou</tspan></text><text class="guard" x="92" y="1640.0">[fluxo principal]</text><text class="result-label" x="2028.8" y="2431.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="2216.0" text-anchor="start"><tspan x="110.0" y="2216.0">A3 — A sinalização não procede</tspan></text><text class="guard" x="92" y="2090.0">[fluxo principal]</text><text class="result-label" x="2028.8" y="2901.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="2666.0" text-anchor="start"><tspan x="110.0" y="2666.0">A4 — O usuário inicia a sinalização sem estar autenticado</tspan></text><text class="guard" x="92" y="2540.0">[fluxo principal]</text><text class="result-label" x="2028.8" y="3351.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="3136.0" text-anchor="start"><tspan x="110.0" y="3136.0">E1 — Evidência inválida ou maliciosa</tspan></text><text class="guard" x="92" y="3010.0">[fluxo principal]</text><text class="result-label" x="818.0" y="3749.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="3586.0" text-anchor="start"><tspan x="110.0" y="3586.0">E2 — Campo crítico não pode ser verificado e pode causar risco imediato</tspan></text><text class="guard" x="92" y="3460.0">[fluxo principal]</text><text class="result-label" x="2028.8" y="4283.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="4068.0" text-anchor="start"><tspan x="110.0" y="4068.0">E3 — Falha ao registrar o protocolo</tspan></text><text class="guard" x="92" y="3942.0">[fluxo principal]</text>

  <g transform="translate(673.4 4628.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
