<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2815.0" viewBox="0 0 1400 2815.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-051 — Cadastrar estabelecimento gastronômico</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2815.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-051</text>
  <text class="subtitle" x="70" y="75">Cadastrar estabelecimento gastronômico · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2545.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DA PLATAFORMA</text><rect x="700.0" y="100" width="640.0" height="2545.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1111.0" width="1224.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1573.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="2035.0" width="1224.0" height="264.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V413.0"/><path class="flow" d="M380.0 541.0 V568.5 H1020.0 V596.0"/><path class="flow" d="M1020.0 664.0 V719.0"/><path class="flow" d="M1020.0 787.0 V842.0"/><path class="flow" d="M1020.0 930.0 V985.0"/><path class="main-flow" d="M948.0 1027.0 H80.0 V1389.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1027.0 H1350.0 V1161.0"/><path class="flow" d="M1350.0 1161.0 H1020.0 V1181.0"/><path class="return-flow no-arrow" d="M1020.0 1249.0 H1382.0 V1389.0"/><path class="return-flow" d="M1382.0 1389.0 H1035.0"/><path class="flow" d="M1020.0 1404.0 V1447.0"/><path class="main-flow" d="M948.0 1489.0 H80.0 V1851.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1489.0 H1350.0 V1623.0"/><path class="flow" d="M1350.0 1623.0 H1020.0 V1643.0"/><path class="return-flow no-arrow" d="M1020.0 1711.0 H1382.0 V1851.0"/><path class="return-flow" d="M1382.0 1851.0 H1035.0"/><path class="flow" d="M1020.0 1866.0 V1909.0"/><path class="main-flow" d="M948.0 1951.0 H80.0 V2369.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1951.0 H1350.0 V2085.0"/><path class="error-flow" d="M1350.0 2085.0 H1020.0 V2105.0"/><path class="error-flow" d="M1020.0 2173.0 V2211.0"/><path class="flow" d="M1020.0 2384.0 V2427.0"/><path class="flow" d="M1020.0 2515.0 V2552.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador da plataforma inicia o cadastro de</tspan><tspan x="380.0" y="319.0">um estabelecimento gastronômico; o sistema inclui</tspan><tspan x="380.0" y="339.0">UC-046 para confirmar a sessão administrativa.</tspan></text><rect class="node" x="185.0" y="413.0" width="390.0" height="128.0" rx="18"/><text class="text" x="380.0" y="442.0" text-anchor="middle"><tspan x="380.0" y="442.0">O administrador informa cardápio ou descrição de</tspan><tspan x="380.0" y="462.0">produtos, faixa de preços, couvert artístico</tspan><tspan x="380.0" y="482.0">quando aplicável, horários, formato de</tspan><tspan x="380.0" y="502.0">atendimento, regras do local, canal de contato e o</tspan><tspan x="380.0" y="522.0">responsável administrativo (RN-011).</tspan></text><rect class="node system-node" x="825.0" y="596.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="625.0" text-anchor="middle"><tspan x="1020.0" y="625.0">O sistema valida os dados mínimos do cadastro</tspan><tspan x="1020.0" y="645.0">(RN-068).</tspan></text><rect class="node system-node" x="825.0" y="719.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="748.0" text-anchor="middle"><tspan x="1020.0" y="748.0">O sistema registra o estabelecimento e a operação</tspan><tspan x="1020.0" y="768.0">de auditoria (RN-076).</tspan></text><rect class="node system-node" x="825.0" y="842.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="871.0" text-anchor="middle"><tspan x="1020.0" y="871.0">O sistema disponibiliza o estabelecimento ou o</tspan><tspan x="1020.0" y="891.0">mantém pendente até que atenda às condições de</tspan><tspan x="1020.0" y="911.0">publicação.</tspan></text><polygon class="node system-node decision" points="1020.0,985.0 1092.0,1027.0 1020.0,1069.0 948.0,1027.0"/><text class="small" x="1020.0" y="1032.0" text-anchor="middle"><tspan x="1020.0" y="1032.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1181.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1210.0" text-anchor="middle"><tspan x="1020.0" y="1210.0">O sistema mantém o cadastro fora da exibição</tspan><tspan x="1020.0" y="1230.0">pública e informa os campos necessários.</tspan></text><polygon class="merge" points="1020.0,1374.0 1035.0,1389.0 1020.0,1404.0 1005.0,1389.0"/><polygon class="node system-node decision" points="1020.0,1447.0 1092.0,1489.0 1020.0,1531.0 948.0,1489.0"/><text class="small" x="1020.0" y="1494.0" text-anchor="middle"><tspan x="1020.0" y="1494.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1643.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1672.0" text-anchor="middle"><tspan x="1020.0" y="1672.0">A alteração só é aplicada após confirmação do</tspan><tspan x="1020.0" y="1692.0">administrador (RN-038).</tspan></text><polygon class="merge" points="1020.0,1836.0 1035.0,1851.0 1020.0,1866.0 1005.0,1851.0"/><polygon class="node system-node decision" points="1020.0,1909.0 1092.0,1951.0 1020.0,1993.0 948.0,1951.0"/><text class="small" x="1020.0" y="1956.0" text-anchor="middle"><tspan x="1020.0" y="1956.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="2105.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2134.0" text-anchor="middle"><tspan x="1020.0" y="2134.0">O sistema nega o cadastro e não cria registro</tspan><tspan x="1020.0" y="2154.0">público.</tspan></text><circle cx="1020.0" cy="2229.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2229.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2354.0 1035.0,2369.0 1020.0,2384.0 1005.0,2369.0"/><rect class="node system-node" x="825.0" y="2427.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2456.0" text-anchor="middle"><tspan x="1020.0" y="2456.0">Resultado: Estabelecimento é registrado, com</tspan><tspan x="1020.0" y="2476.0">estado de publicação compatível com os dados</tspan><tspan x="1020.0" y="2496.0">mínimos e trilha de auditoria.</tspan></text><circle cx="1020.0" cy="2570.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2570.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1138.0"><tspan x="110" y="1138.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="1017.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1380.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1600.0"><tspan x="110" y="1600.0">A2 — O cadastro decorre de uma sinalização comunitária validada</tspan></text><text class="guard" x="92" y="1479.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1842.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2062.0"><tspan x="110" y="2062.0">E1 — A sessão administrativa não é confirmada pelo UC-046</tspan></text><text class="guard" x="92" y="1941.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2234.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2665.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
