<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2149.0" viewBox="0 0 1400.0 2149.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-051 — Marcar avaliação como útil</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2149.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-051</text>
  <text class="subtitle" x="70" y="75">Marcar avaliação como útil · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1899.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="1899.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1021.0" width="1224.0" height="182.0" rx="18"/><rect class="exception-band" x="88" y="1467.0" width="1224.0" height="186.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V393.0"/><path class="flow" d="M380.0 461.0 V488.5 H1020.0 V516.0"/><path class="flow" d="M1020.0 584.0 V639.0"/><path class="flow" d="M1020.0 707.0 V762.0"/><path class="flow" d="M1020.0 830.0 V885.0"/><path class="branch-bus no-arrow" d="M1110.0 937.0 H1350.0 V1071.0"/><path class="flow" d="M1350.0 1071.0 H1020.0 V1091.0"/><path class="main-flow" d="M930.0 937.0 H80.0 V1273.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1155.0 H1382.0 V1273.0"/><path class="return-flow" d="M1382.0 1273.0 H1035.0"/><path class="flow" d="M1020.0 1288.0 V1331.0"/><path class="branch-bus no-arrow" d="M1110.0 1383.0 H1350.0 V1517.0"/><path class="error-flow" d="M1350.0 1517.0 H1020.0 V1537.0"/><path class="main-flow" d="M930.0 1383.0 H80.0 V1723.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1605.0 H1382.0 V1723.0"/><path class="return-flow" d="M1382.0 1723.0 H1035.0"/><path class="flow" d="M1020.0 1738.0 V1781.0"/><path class="flow" d="M1020.0 1869.0 V1906.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O usuário autenticado consulta avaliações de</tspan><tspan x="380.0" y="319.0">um local (UC-012).</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="422.0" text-anchor="middle"><tspan x="380.0" y="422.0">Aciona &quot;marcar como útil&quot; em uma avaliação</tspan><tspan x="380.0" y="442.0">publicada.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema verifica se o usuário já marcou</tspan><tspan x="1020.0" y="565.0">essa avaliação anteriormente.</tspan></text><rect class="node system-node" x="825.0" y="639.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="668.0" text-anchor="middle"><tspan x="1020.0" y="668.0">O sistema registra a marcação vinculada ao</tspan><tspan x="1020.0" y="688.0">usuário e à avaliação.</tspan></text><rect class="node system-node" x="825.0" y="762.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="791.0" text-anchor="middle"><tspan x="1020.0" y="791.0">O sistema atualiza e exibe a contagem pública</tspan><tspan x="1020.0" y="811.0">de marcações da avaliação.</tspan></text><polygon class="node system-node decision" points="1020.0,885.0 1110.0,937.0 1020.0,989.0 930.0,937.0"/><text class="small" x="1020.0" y="912.0" text-anchor="middle"><tspan x="1020.0" y="912.0">O usuário desmarca</tspan><tspan x="1020.0" y="932.0">uma avaliação</tspan><tspan x="1020.0" y="952.0">previamente marcada</tspan><tspan x="1020.0" y="972.0">como útil?</tspan></text><rect class="node system-node" x="825.0" y="1091.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1128.0" text-anchor="middle"><tspan x="1020.0" y="1128.0">O sistema decrementa a contagem</tspan></text><polygon class="merge" points="1020.0,1258.0 1035.0,1273.0 1020.0,1288.0 1005.0,1273.0"/><polygon class="node system-node decision" points="1020.0,1331.0 1110.0,1383.0 1020.0,1435.0 930.0,1383.0"/><text class="small" x="1020.0" y="1358.0" text-anchor="middle"><tspan x="1020.0" y="1358.0">O usuário tenta</tspan><tspan x="1020.0" y="1378.0">marcar novamente uma</tspan><tspan x="1020.0" y="1398.0">avaliação já marcada</tspan><tspan x="1020.0" y="1418.0">por ele?</tspan></text><rect class="node exception-node" x="825.0" y="1537.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1566.0" text-anchor="middle"><tspan x="1020.0" y="1566.0">O sistema mantém a marcação única e não</tspan><tspan x="1020.0" y="1586.0">duplica a contagem</tspan></text><polygon class="merge" points="1020.0,1708.0 1035.0,1723.0 1020.0,1738.0 1005.0,1723.0"/><rect class="node system-node" x="825.0" y="1781.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1810.0" text-anchor="middle"><tspan x="1020.0" y="1810.0">Resultado: A marcação de &quot;útil&quot; é registrada</tspan><tspan x="1020.0" y="1830.0">vinculada ao usuário e à avaliação, e a</tspan><tspan x="1020.0" y="1850.0">contagem pública é atualizada.</tspan></text><circle cx="1020.0" cy="1924.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1924.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1264.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1053.0" text-anchor="start"><tspan x="110.0" y="1053.0">A1 — O usuário desmarca uma avaliação previamente marcada como útil</tspan></text><text class="guard" x="92" y="927.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1714.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1499.0" text-anchor="start"><tspan x="110.0" y="1499.0">E1 — O usuário tenta marcar novamente uma avaliação já marcada por ele</tspan></text><text class="guard" x="92" y="1373.0">[fluxo principal]</text>

  <g transform="translate(340.0 2019.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
