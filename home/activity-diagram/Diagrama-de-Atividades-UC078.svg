  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O proprietário acessa a lista já</tspan><tspan x="380.0" y="319.0">compartilhada (UC-032).</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="430.0" text-anchor="middle"><tspan x="380.0" y="430.0">Aciona a opção de revogar o link público.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="549.0" text-anchor="middle"><tspan x="1020.0" y="549.0">O sistema confirma a ação com o proprietário.</tspan></text><rect class="node system-node" x="825.0" y="631.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="668.0" text-anchor="middle"><tspan x="1020.0" y="668.0">O sistema invalida o link vigente.</tspan></text><rect class="node system-node" x="825.0" y="750.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="779.0" text-anchor="middle"><tspan x="1020.0" y="779.0">O sistema informa que o compartilhamento foi</tspan><tspan x="1020.0" y="799.0">interrompido.</tspan></text><polygon class="node system-node decision" points="1020.0,873.0 1110.0,925.0 1020.0,977.0 930.0,925.0"/><text class="small" x="1020.0" y="910.0" text-anchor="middle"><tspan x="1020.0" y="910.0">A lista não pertence</tspan><tspan x="1020.0" y="930.0">ao usuário que</tspan><tspan x="1020.0" y="950.0">solicita a revogação?</tspan></text><rect class="node exception-node" x="825.0" y="1079.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1116.0" text-anchor="middle"><tspan x="1020.0" y="1116.0">O sistema nega a operação</tspan></text><circle cx="1020.0" cy="1199.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1199.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1282.0 1035.0,1297.0 1020.0,1312.0 1005.0,1297.0"/><polygon class="node system-node decision" points="1020.0,1355.0 1110.0,1407.0 1020.0,1459.0 930.0,1407.0"/><text class="small" x="1020.0" y="1392.0" text-anchor="middle"><tspan x="1020.0" y="1392.0">Alguém tenta acessar</tspan><tspan x="1020.0" y="1412.0">o link após a</tspan><tspan x="1020.0" y="1432.0">revogação?</tspan></text><rect class="node exception-node" x="825.0" y="1561.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1598.0" text-anchor="middle"><tspan x="1020.0" y="1598.0">O sistema nega o acesso sem exibir a lista</tspan></text><circle cx="1020.0" cy="1681.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1681.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1764.0 1035.0,1779.0 1020.0,1794.0 1005.0,1779.0"/><rect class="node system-node" x="825.0" y="1837.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1866.0" text-anchor="middle"><tspan x="1020.0" y="1866.0">Resultado: Link revogado; qualquer acesso</tspan><tspan x="1020.0" y="1886.0">posterior é negado sem exibir a lista.</tspan></text><circle cx="1020.0" cy="1960.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1960.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1048.0" y="1204.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1041.0" text-anchor="start"><tspan x="110.0" y="1041.0">E1 — A lista não pertence ao usuário que solicita a revogação</tspan></text><text class="guard" x="92" y="915.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1686.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1523.0" text-anchor="start"><tspan x="110.0" y="1523.0">E2 — Alguém tenta acessar o link após a revogação</tspan></text><text class="guard" x="92" y="1397.0">[fluxo principal]</text>

