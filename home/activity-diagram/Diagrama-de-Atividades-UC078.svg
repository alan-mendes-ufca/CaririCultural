<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="2871.0" viewBox="0 0 1580 2871.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-078 — Buscar por proximidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="2871.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-078</text>
  <text class="subtitle" x="70" y="75">Buscar por proximidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="2601.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">VISITANTE</text><rect x="546.7" y="100" width="486.7" height="2601.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="2601.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">GEOLOCALIZAÇÃO</text>
  <rect class="alternative-band" x="88" y="1031.0" width="1404.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="1513.0" width="1404.0" height="264.0" rx="18"/><rect class="exception-band" x="88" y="2031.0" width="1404.0" height="284.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 338.0 V365.5 H790.0 V393.0"/><path class="flow" d="M790.0 461.0 V488.5 H1276.7 V516.0"/><path class="flow" d="M1276.7 604.0 V631.5 H790.0 V659.0"/><path class="flow" d="M790.0 727.0 V782.0"/><path class="flow" d="M790.0 850.0 V905.0"/><path class="main-flow" d="M718.0 947.0 H80.0 V1329.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 947.0 H1530.0 V1081.0"/><path class="flow" d="M1530.0 1081.0 H303.3 V1101.0"/><path class="return-flow no-arrow" d="M303.3 1189.0 H1562.0 V1329.0"/><path class="return-flow" d="M1562.0 1329.0 H805.0"/><path class="flow" d="M790.0 1344.0 V1387.0"/><path class="main-flow" d="M718.0 1429.0 H80.0 V1847.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1429.0 H1530.0 V1563.0"/><path class="error-flow" d="M1530.0 1563.0 H790.0 V1583.0"/><path class="error-flow" d="M790.0 1651.0 V1689.0"/><path class="flow" d="M790.0 1862.0 V1905.0"/><path class="main-flow" d="M718.0 1947.0 H80.0 V2385.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1947.0 H1530.0 V2081.0"/><path class="error-flow" d="M1530.0 2081.0 H790.0 V2101.0"/><path class="error-flow" d="M790.0 2189.0 V2227.0"/><path class="flow" d="M790.0 2400.0 V2443.0"/><path class="flow" d="M790.0 2571.0 V2608.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">Durante a pesquisa (UC-004) ou a filtragem</tspan><tspan x="303.3" y="319.0">(UC-005), o visitante escolhe “Mais próximos”.</tspan></text><rect class="node system-node" x="595.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="422.0" text-anchor="middle"><tspan x="790.0" y="422.0">O sistema solicita consentimento para uso da</tspan><tspan x="790.0" y="442.0">localização atual.</tspan></text><rect class="node" x="1081.7" y="516.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1276.7" y="545.0" text-anchor="middle"><tspan x="1276.7" y="545.0">O Serviço de Geolocalização retorna a posição</tspan><tspan x="1276.7" y="565.0">atual, ou o visitante informa bairro, cidade ou</tspan><tspan x="1276.7" y="585.0">ponto de referência como origem manual.</tspan></text><rect class="node system-node" x="595.0" y="659.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="688.0" text-anchor="middle"><tspan x="790.0" y="688.0">O sistema calcula a distância dos registros</tspan><tspan x="790.0" y="708.0">públicos e elegíveis com localização válida.</tspan></text><rect class="node system-node" x="595.0" y="782.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="811.0" text-anchor="middle"><tspan x="790.0" y="811.0">O sistema ordena os resultados por distância</tspan><tspan x="790.0" y="831.0">crescente e retorna o controle ao caso estendido.</tspan></text><polygon class="node system-node decision" points="790.0,905.0 862.0,947.0 790.0,989.0 718.0,947.0"/><text class="small" x="790.0" y="952.0" text-anchor="middle"><tspan x="790.0" y="952.0">Condição A1?</tspan></text><rect class="node" x="108.3" y="1101.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.3" y="1130.0" text-anchor="middle"><tspan x="303.3" y="1130.0">O visitante prefere não usar a localização atual e</tspan><tspan x="303.3" y="1150.0">informa diretamente um bairro, cidade ou ponto de</tspan><tspan x="303.3" y="1170.0">referência como origem.</tspan></text><polygon class="merge" points="790.0,1314.0 805.0,1329.0 790.0,1344.0 775.0,1329.0"/><polygon class="node system-node decision" points="790.0,1387.0 862.0,1429.0 790.0,1471.0 718.0,1429.0"/><text class="small" x="790.0" y="1434.0" text-anchor="middle"><tspan x="790.0" y="1434.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="1583.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1612.0" text-anchor="middle"><tspan x="790.0" y="1612.0">A busca continua por cidade e o sistema oferece a</tspan><tspan x="790.0" y="1632.0">origem manual, sem bloquear o catálogo.</tspan></text><circle cx="790.0" cy="1707.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1707.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1832.0 805.0,1847.0 790.0,1862.0 775.0,1847.0"/><polygon class="node system-node decision" points="790.0,1905.0 862.0,1947.0 790.0,1989.0 718.0,1947.0"/><text class="small" x="790.0" y="1952.0" text-anchor="middle"><tspan x="790.0" y="1952.0">Condição E2?</tspan></text><rect class="node exception-node" x="595.0" y="2101.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="2130.0" text-anchor="middle"><tspan x="790.0" y="2130.0">O item pode permanecer no resultado, mas sem</tspan><tspan x="790.0" y="2150.0">distância estimada e sem ser indevidamente</tspan><tspan x="790.0" y="2170.0">priorizado como próximo.</tspan></text><circle cx="790.0" cy="2245.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="2245.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,2370.0 805.0,2385.0 790.0,2400.0 775.0,2385.0"/><rect class="node system-node" x="595.0" y="2443.0" width="390.0" height="128.0" rx="18"/><text class="text" x="790.0" y="2472.0" text-anchor="middle"><tspan x="790.0" y="2472.0">Resultado: Resultados públicos e elegíveis com</tspan><tspan x="790.0" y="2492.0">localização válida são ordenados por distância</tspan><tspan x="790.0" y="2512.0">crescente, com origem e distância explícitas; ou a</tspan><tspan x="790.0" y="2532.0">busca prossegue por cidade quando a proximidade</tspan><tspan x="790.0" y="2552.0">não é viável.</tspan></text><circle cx="790.0" cy="2626.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2626.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1058.0"><tspan x="110" y="1058.0">A1 — O visitante prefere não usar a localização atual e informa diretamente um bairro, cidade ou ponto de referência como origem.</tspan></text><text class="guard" x="92" y="937.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1320.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1540.0"><tspan x="110" y="1540.0">E1 — Permissão de localização negada ou posição indisponível</tspan></text><text class="guard" x="92" y="1419.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1712.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="2058.0"><tspan x="110" y="2058.0">E2 — Distância não calculável para um registro</tspan></text><text class="guard" x="92" y="1937.0">[fluxo principal]</text><text class="result-label" x="818.0" y="2250.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 2721.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
