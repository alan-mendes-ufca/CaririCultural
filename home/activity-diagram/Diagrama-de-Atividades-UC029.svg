  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 334.0 V389.0"/><path class="flow" d="M380.0 457.0 V484.5 H1020.0 V512.0"/><path class="flow" d="M1020.0 576.0 V631.0"/><path class="flow" d="M1020.0 699.0 V726.5 H380.0 V754.0"/><path class="flow" d="M380.0 818.0 V845.5 H1020.0 V873.0"/><path class="branch-bus no-arrow" d="M1110.0 925.0 H1350.0 V1059.0"/><path class="flow" d="M1350.0 1059.0 H380.0 V1079.0"/><path class="main-flow" d="M930.0 925.0 H80.0 V1265.0 H1005.0"/><path class="return-flow no-arrow" d="M380.0 1147.0 H1382.0 V1265.0"/><path class="return-flow" d="M1382.0 1265.0 H1035.0"/><path class="flow" d="M1020.0 1280.0 V1323.0"/><path class="branch-bus no-arrow" d="M1110.0 1375.0 H1350.0 V1509.0"/><path class="error-flow" d="M1350.0 1509.0 H1020.0 V1529.0"/><path class="main-flow" d="M930.0 1375.0 H80.0 V1751.0 H1005.0"/><path class="error-flow" d="M1020.0 1597.0 V1635.0"/><path class="flow" d="M1020.0 1766.0 V1809.0"/><path class="flow" d="M1020.0 1877.0 V1914.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O usuário inicia a criação de uma enquete.</tspan></text><rect class="node" x="185.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="418.0" text-anchor="middle"><tspan x="380.0" y="418.0">Informa título e opções de locais/eventos</tspan><tspan x="380.0" y="438.0">válidos.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="549.0" text-anchor="middle"><tspan x="1020.0" y="549.0">O sistema valida as opções e cria a enquete.</tspan></text><rect class="node system-node" x="825.0" y="631.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="660.0" text-anchor="middle"><tspan x="1020.0" y="660.0">O sistema gera o link público de votação, sob</tspan><tspan x="1020.0" y="680.0">as regras incluídas do UC-077.</tspan></text><rect class="node" x="185.0" y="754.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="791.0" text-anchor="middle"><tspan x="380.0" y="791.0">O usuário compartilha o link externamente.</tspan></text><polygon class="node system-node decision" points="1020.0,873.0 1110.0,925.0 1020.0,977.0 930.0,925.0"/><text class="small" x="1020.0" y="930.0" text-anchor="middle"><tspan x="1020.0" y="930.0">A1 aplicável?</tspan></text><rect class="node" x="185.0" y="1079.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="1108.0" text-anchor="middle"><tspan x="380.0" y="1108.0">O usuário altera as opções antes da primeira</tspan><tspan x="380.0" y="1128.0">votação registrada</tspan></text><polygon class="merge" points="1020.0,1250.0 1035.0,1265.0 1020.0,1280.0 1005.0,1265.0"/><polygon class="node system-node decision" points="1020.0,1323.0 1110.0,1375.0 1020.0,1427.0 930.0,1375.0"/><text class="small" x="1020.0" y="1370.0" text-anchor="middle"><tspan x="1020.0" y="1370.0">Opção de local/evento</tspan><tspan x="1020.0" y="1390.0">inválida ou inativa?</tspan></text><rect class="node exception-node" x="825.0" y="1529.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1558.0" text-anchor="middle"><tspan x="1020.0" y="1558.0">O sistema solicita substituição antes de</tspan><tspan x="1020.0" y="1578.0">concluir a criação</tspan></text><circle cx="1020.0" cy="1653.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1653.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1736.0 1035.0,1751.0 1020.0,1766.0 1005.0,1751.0"/><rect class="node system-node" x="825.0" y="1809.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1838.0" text-anchor="middle"><tspan x="1020.0" y="1838.0">Resultado: Enquete e link público de votação</tspan><tspan x="1020.0" y="1858.0">são criados.</tspan></text><circle cx="1020.0" cy="1932.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1932.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1256.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1041.0" text-anchor="start"><tspan x="110.0" y="1041.0">A1 — A1 aplicável</tspan></text><text class="guard" x="92" y="915.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1658.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1491.0" text-anchor="start"><tspan x="110.0" y="1491.0">E1 — Opção de local/evento inválida ou inativa</tspan></text><text class="guard" x="92" y="1365.0">[fluxo principal]</text>

  <g transform="translate(340.0 2027.0)">
