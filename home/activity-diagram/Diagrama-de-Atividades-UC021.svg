<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2564.0" viewBox="0 0 1400 2564.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-021 — Consultar avaliações da comunidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2564.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-021</text>
  <text class="subtitle" x="70" y="75">Consultar avaliações da comunidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2294.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">VISITANTE</text><rect x="700.0" y="100" width="640.0" height="2294.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="884.0" width="1224.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1346.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1808.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 334.0 V361.5 H1020.0 V389.0"/><path class="flow" d="M1020.0 457.0 V484.5 H380.0 V512.0"/><path class="flow" d="M380.0 580.0 V607.5 H1020.0 V635.0"/><path class="flow" d="M1020.0 703.0 V758.0"/><path class="main-flow" d="M948.0 800.0 H80.0 V1162.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 800.0 H1350.0 V934.0"/><path class="flow" d="M1350.0 934.0 H1020.0 V954.0"/><path class="return-flow no-arrow" d="M1020.0 1022.0 H1382.0 V1162.0"/><path class="return-flow" d="M1382.0 1162.0 H1035.0"/><path class="flow" d="M1020.0 1177.0 V1220.0"/><path class="main-flow" d="M948.0 1262.0 H80.0 V1624.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1262.0 H1350.0 V1396.0"/><path class="flow" d="M1350.0 1396.0 H1020.0 V1416.0"/><path class="return-flow no-arrow" d="M1020.0 1484.0 H1382.0 V1624.0"/><path class="return-flow" d="M1382.0 1624.0 H1035.0"/><path class="flow" d="M1020.0 1639.0 V1682.0"/><path class="main-flow" d="M948.0 1724.0 H80.0 V2138.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1724.0 H1350.0 V1858.0"/><path class="error-flow" d="M1350.0 1858.0 H1020.0 V1878.0"/><path class="error-flow" d="M1020.0 1942.0 V1980.0"/><path class="flow" d="M1020.0 2153.0 V2196.0"/><path class="flow" d="M1020.0 2264.0 V2301.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O visitante abre a área de avaliações de um local.</tspan></text><rect class="node system-node" x="825.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="418.0" text-anchor="middle"><tspan x="1020.0" y="418.0">O sistema mostra avaliações aprovadas com autoria,</tspan><tspan x="1020.0" y="438.0">nota e data.</tspan></text><rect class="node" x="185.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="541.0" text-anchor="middle"><tspan x="380.0" y="541.0">O visitante ordena as avaliações por recência ou</tspan><tspan x="380.0" y="561.0">relevância.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema exibe o conteúdo ordenado e permite</tspan><tspan x="1020.0" y="684.0">abrir cada avaliação individualmente.</tspan></text><polygon class="node system-node decision" points="1020.0,758.0 1092.0,800.0 1020.0,842.0 948.0,800.0"/><text class="small" x="1020.0" y="805.0" text-anchor="middle"><tspan x="1020.0" y="805.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="954.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="983.0" text-anchor="middle"><tspan x="1020.0" y="983.0">O sistema informa a ausência de conteúdo sem</tspan><tspan x="1020.0" y="1003.0">fabricar nota.</tspan></text><polygon class="merge" points="1020.0,1147.0 1035.0,1162.0 1020.0,1177.0 1005.0,1162.0"/><polygon class="node system-node decision" points="1020.0,1220.0 1092.0,1262.0 1020.0,1304.0 948.0,1262.0"/><text class="small" x="1020.0" y="1267.0" text-anchor="middle"><tspan x="1020.0" y="1267.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1416.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1445.0" text-anchor="middle"><tspan x="1020.0" y="1445.0">Ela permanece visível ou é preventivamente</tspan><tspan x="1020.0" y="1465.0">ocultada conforme a gravidade da denúncia.</tspan></text><polygon class="merge" points="1020.0,1609.0 1035.0,1624.0 1020.0,1639.0 1005.0,1624.0"/><polygon class="node system-node decision" points="1020.0,1682.0 1092.0,1724.0 1020.0,1766.0 948.0,1724.0"/><text class="small" x="1020.0" y="1729.0" text-anchor="middle"><tspan x="1020.0" y="1729.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1878.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1915.0" text-anchor="middle"><tspan x="1020.0" y="1915.0">O texto da avaliação continua disponível.</tspan></text><circle cx="1020.0" cy="1998.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1998.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2123.0 1035.0,2138.0 1020.0,2153.0 1005.0,2138.0"/><rect class="node system-node" x="825.0" y="2196.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2225.0" text-anchor="middle"><tspan x="1020.0" y="2225.0">Resultado: Avaliações são exibidas na ordenação</tspan><tspan x="1020.0" y="2245.0">escolhida pelo visitante.</tspan></text><circle cx="1020.0" cy="2319.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2319.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="911.0"><tspan x="110" y="911.0">A1 — Não há avaliações publicadas</tspan></text><text class="guard" x="92" y="790.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1153.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1373.0"><tspan x="110" y="1373.0">A2 — Uma avaliação foi denunciada</tspan></text><text class="guard" x="92" y="1252.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1615.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1835.0"><tspan x="110" y="1835.0">E1 — Mídia anexada a uma avaliação não pode ser carregada</tspan></text><text class="guard" x="92" y="1714.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2003.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2414.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
