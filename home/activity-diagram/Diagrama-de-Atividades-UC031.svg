<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580.1" height="2946.0" viewBox="0 0 1580.1 2946.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-031 — Consultar mídias publicadas pela comunidade</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="2946.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-031</text>
  <text class="subtitle" x="70" y="75">Consultar mídias publicadas pela comunidade · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="2696.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">VISITANTE</tspan></text><rect x="546.7" y="100" width="486.7" height="2696.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="2696.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#FEF08A"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">USUÁRIO AUTENTICADO</tspan></text>
  <rect class="alternative-band" x="88" y="775.0" width="1404.1" height="289.0" rx="18"/><rect class="alternative-band" x="88" y="1328.0" width="1404.1" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1778.0" width="1404.1" height="186.0" rx="18"/><rect class="exception-band" x="88" y="2228.0" width="1404.1" height="222.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 338.0 V365.5 H790.0 V393.0"/><path class="flow" d="M790.0 461.0 V488.5 H303.4 V516.0"/><path class="flow" d="M303.4 584.0 V611.5 H790.0 V639.0"/><path class="flow" d="M1276.8 913.0 V930.5 H790.0 V948.0"/><path class="branch-bus no-arrow" d="M880.0 691.0 H1530.1 V825.0"/><path class="flow" d="M1530.1 825.0 H1276.8 V845.0"/><path class="main-flow" d="M700.0 691.0 H80.0 V1134.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1016.0 H1562.1 V1134.0"/><path class="return-flow" d="M1562.1 1134.0 H805.0"/><path class="flow" d="M790.0 1149.0 V1192.0"/><path class="branch-bus no-arrow" d="M880.0 1244.0 H1530.1 V1378.0"/><path class="flow" d="M1530.1 1378.0 H790.0 V1398.0"/><path class="main-flow" d="M700.0 1244.0 H80.0 V1584.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1466.0 H1562.1 V1584.0"/><path class="return-flow" d="M1562.1 1584.0 H805.0"/><path class="flow" d="M790.0 1599.0 V1642.0"/><path class="branch-bus no-arrow" d="M880.0 1694.0 H1530.1 V1828.0"/><path class="error-flow" d="M1530.1 1828.0 H790.0 V1848.0"/><path class="main-flow" d="M700.0 1694.0 H80.0 V2034.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1916.0 H1562.1 V2034.0"/><path class="return-flow" d="M1562.1 2034.0 H805.0"/><path class="flow" d="M790.0 2049.0 V2092.0"/><path class="branch-bus no-arrow" d="M880.0 2144.0 H1530.1 V2278.0"/><path class="error-flow" d="M1530.1 2278.0 H790.0 V2298.0"/><path class="main-flow" d="M700.0 2144.0 H80.0 V2520.0 H775.0"/><path class="error-flow" d="M790.0 2366.0 V2404.0"/><path class="flow" d="M790.0 2535.0 V2578.0"/><path class="flow" d="M790.0 2666.0 V2703.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.4" y="299.0" text-anchor="middle"><tspan x="303.4" y="299.0">O visitante abre a seção de mídias da</tspan><tspan x="303.4" y="319.0">comunidade de um local/evento.</tspan></text><rect class="node system-node" x="595.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="422.0" text-anchor="middle"><tspan x="790.0" y="422.0">O sistema exibe fotos e vídeos curtos</tspan><tspan x="790.0" y="442.0">aprovados, vinculados a experiências reais.</tspan></text><rect class="node" x="108.4" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.4" y="545.0" text-anchor="middle"><tspan x="303.4" y="545.0">O visitante abre uma mídia para ampliar ou</tspan><tspan x="303.4" y="565.0">navegar entre as publicações.</tspan></text><polygon class="node system-node decision" points="790.0,639.0 880.0,691.0 790.0,743.0 700.0,691.0"/><text class="small" x="790.0" y="676.0" text-anchor="middle"><tspan x="790.0" y="676.0">Um usuário</tspan><tspan x="790.0" y="696.0">autenticado publica</tspan><tspan x="790.0" y="716.0">uma nova mídia?</tspan></text><rect class="node" x="1081.8" y="845.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.8" y="874.0" text-anchor="middle"><tspan x="1276.8" y="874.0">Seleciona o local/evento, envia a mídia e um</tspan><tspan x="1276.8" y="894.0">contexto mínimo da experiência</tspan></text><rect class="node system-node" x="595.0" y="948.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="977.0" text-anchor="middle"><tspan x="790.0" y="977.0">O sistema valida tipo, tamanho e vínculo e</tspan><tspan x="790.0" y="997.0">publica ou envia à moderação</tspan></text><polygon class="merge" points="790.0,1119.0 805.0,1134.0 790.0,1149.0 775.0,1134.0"/><polygon class="node system-node decision" points="790.0,1192.0 880.0,1244.0 790.0,1296.0 700.0,1244.0"/><text class="small" x="790.0" y="1229.0" text-anchor="middle"><tspan x="790.0" y="1229.0">Não há conteúdo</tspan><tspan x="790.0" y="1249.0">comunitário para o</tspan><tspan x="790.0" y="1269.0">local?</tspan></text><rect class="node system-node" x="595.0" y="1398.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1427.0" text-anchor="middle"><tspan x="790.0" y="1427.0">O sistema informa a ausência sem fabricar</tspan><tspan x="790.0" y="1447.0">conteúdo</tspan></text><polygon class="merge" points="790.0,1569.0 805.0,1584.0 790.0,1599.0 775.0,1584.0"/><polygon class="node system-node decision" points="790.0,1642.0 880.0,1694.0 790.0,1746.0 700.0,1694.0"/><text class="small" x="790.0" y="1689.0" text-anchor="middle"><tspan x="790.0" y="1689.0">Mídia não pode ser</tspan><tspan x="790.0" y="1709.0">carregada?</tspan></text><rect class="node exception-node" x="595.0" y="1848.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1877.0" text-anchor="middle"><tspan x="790.0" y="1877.0">As demais mídias e o texto das avaliações</tspan><tspan x="790.0" y="1897.0">relacionadas continuam disponíveis</tspan></text><polygon class="merge" points="790.0,2019.0 805.0,2034.0 790.0,2049.0 775.0,2034.0"/><polygon class="node system-node decision" points="790.0,2092.0 880.0,2144.0 790.0,2196.0 700.0,2144.0"/><text class="small" x="790.0" y="2119.0" text-anchor="middle"><tspan x="790.0" y="2119.0">Arquivo malicioso ou</tspan><tspan x="790.0" y="2139.0">conteúdo grave</tspan><tspan x="790.0" y="2159.0">enviado na</tspan><tspan x="790.0" y="2179.0">publicação?</tspan></text><rect class="node exception-node" x="595.0" y="2298.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="2327.0" text-anchor="middle"><tspan x="790.0" y="2327.0">O sistema bloqueia ou oculta a mídia</tspan><tspan x="790.0" y="2347.0">preventivamente</tspan></text><circle cx="790.0" cy="2422.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="2422.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,2505.0 805.0,2520.0 790.0,2535.0 775.0,2520.0"/><rect class="node system-node" x="595.0" y="2578.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="2607.0" text-anchor="middle"><tspan x="790.0" y="2607.0">Resultado: Mídias comunitárias são exibidas</tspan><tspan x="790.0" y="2627.0">na galeria; quando publicadas, ficam</tspan><tspan x="790.0" y="2647.0">vinculadas ao autor e sujeitas à moderação.</tspan></text><circle cx="790.0" cy="2721.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2721.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1125.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="807.0" text-anchor="start"><tspan x="110.0" y="807.0">A1 — Um usuário autenticado publica uma nova mídia</tspan></text><text class="guard" x="92" y="681.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="1575.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1360.0" text-anchor="start"><tspan x="110.0" y="1360.0">A2 — Não há conteúdo comunitário para o local</tspan></text><text class="guard" x="92" y="1234.0">[fluxo principal]</text><text class="result-label" x="1542.1" y="2025.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1810.0" text-anchor="start"><tspan x="110.0" y="1810.0">E1 — Mídia não pode ser carregada</tspan></text><text class="guard" x="92" y="1684.0">[fluxo principal]</text><text class="result-label" x="818.0" y="2427.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2260.0" text-anchor="start"><tspan x="110.0" y="2260.0">E2 — Arquivo malicioso ou conteúdo grave enviado na publicação</tspan></text><text class="guard" x="92" y="2134.0">[fluxo principal]</text>

  <g transform="translate(430.0 2816.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
