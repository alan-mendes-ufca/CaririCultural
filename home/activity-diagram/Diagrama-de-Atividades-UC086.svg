  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O proprietário acessa a lista já compartilhada</tspan><tspan x="380.0" y="319.0">(UC-041).</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="430.0" text-anchor="middle"><tspan x="380.0" y="430.0">Aciona a opção de revogar o link público.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="549.0" text-anchor="middle"><tspan x="1020.0" y="549.0">O sistema confirma a ação com o proprietário.</tspan></text><rect class="node system-node" x="825.0" y="631.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="668.0" text-anchor="middle"><tspan x="1020.0" y="668.0">O sistema invalida o link vigente.</tspan></text><rect class="node system-node" x="825.0" y="750.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="779.0" text-anchor="middle"><tspan x="1020.0" y="779.0">O sistema informa que o compartilhamento foi</tspan><tspan x="1020.0" y="799.0">interrompido.</tspan></text><polygon class="node system-node decision" points="1020.0,873.0 1092.0,915.0 1020.0,957.0 948.0,915.0"/><text class="small" x="1020.0" y="920.0" text-anchor="middle"><tspan x="1020.0" y="920.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1069.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1106.0" text-anchor="middle"><tspan x="1020.0" y="1106.0">O sistema nega a operação.</tspan></text><circle cx="1020.0" cy="1189.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1189.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1314.0 1035.0,1329.0 1020.0,1344.0 1005.0,1329.0"/><polygon class="node system-node decision" points="1020.0,1387.0 1092.0,1429.0 1020.0,1471.0 948.0,1429.0"/><text class="small" x="1020.0" y="1434.0" text-anchor="middle"><tspan x="1020.0" y="1434.0">Condição E2?</tspan></text><rect class="node exception-node" x="825.0" y="1583.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1620.0" text-anchor="middle"><tspan x="1020.0" y="1620.0">O sistema nega o acesso sem exibir a lista.</tspan></text><circle cx="1020.0" cy="1703.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1703.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1828.0 1035.0,1843.0 1020.0,1858.0 1005.0,1843.0"/><rect class="node system-node" x="825.0" y="1901.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1930.0" text-anchor="middle"><tspan x="1020.0" y="1930.0">Resultado: Link revogado; qualquer acesso</tspan><tspan x="1020.0" y="1950.0">posterior é negado sem exibir a lista.</tspan></text><circle cx="1020.0" cy="2024.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2024.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1026.0"><tspan x="110" y="1026.0">E1 — A lista não pertence ao usuário que solicita a revogação</tspan></text><text class="guard" x="92" y="905.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1194.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="1540.0"><tspan x="110" y="1540.0">E2 — Alguém tenta acessar o link após a revogação</tspan></text><text class="guard" x="92" y="1419.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1708.0">Fluxo excepcional encerrado</text>
  
