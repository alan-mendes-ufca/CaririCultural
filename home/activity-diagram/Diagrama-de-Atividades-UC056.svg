<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2309.0" viewBox="0 0 1400 2309.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-056 — Criar publicação vinculada a local</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2309.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-056</text>
  <text class="subtitle" x="70" y="75">Criar publicação vinculada a local · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2039.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DO LOCAL</text><rect x="700.0" y="100" width="640.0" height="2039.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1071.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1533.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 378.0 V405.5 H1020.0 V433.0"/><path class="flow" d="M1020.0 501.0 V528.5 H380.0 V556.0"/><path class="flow" d="M380.0 644.0 V671.5 H1020.0 V699.0"/><path class="flow" d="M1020.0 767.0 V822.0"/><path class="flow" d="M1020.0 890.0 V945.0"/><path class="main-flow" d="M948.0 987.0 H80.0 V1349.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 987.0 H1350.0 V1121.0"/><path class="flow" d="M1350.0 1121.0 H1020.0 V1141.0"/><path class="return-flow no-arrow" d="M1020.0 1209.0 H1382.0 V1349.0"/><path class="return-flow" d="M1382.0 1349.0 H1035.0"/><path class="flow" d="M1020.0 1364.0 V1407.0"/><path class="main-flow" d="M948.0 1449.0 H80.0 V1863.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1449.0 H1350.0 V1583.0"/><path class="error-flow" d="M1350.0 1583.0 H1020.0 V1603.0"/><path class="error-flow" d="M1020.0 1667.0 V1705.0"/><path class="flow" d="M1020.0 1878.0 V1921.0"/><path class="flow" d="M1020.0 2009.0 V2046.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="108.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador de equipamento cultural ou de</tspan><tspan x="380.0" y="319.0">estabelecimento gastronômico acessa as publicações</tspan><tspan x="380.0" y="339.0">do local ao qual está vinculado; o sistema inclui</tspan><tspan x="380.0" y="359.0">UC-046 para confirmar a sessão administrativa.</tspan></text><rect class="node system-node" x="825.0" y="433.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="462.0" text-anchor="middle"><tspan x="1020.0" y="462.0">O sistema verifica o escopo do administrador sobre</tspan><tspan x="1020.0" y="482.0">o local (RN-066).</tspan></text><rect class="node" x="185.0" y="556.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="585.0" text-anchor="middle"><tspan x="380.0" y="585.0">O administrador informa título, conteúdo,</tspan><tspan x="380.0" y="605.0">responsável e o local ao qual a publicação se</tspan><tspan x="380.0" y="625.0">vincula (RN-070).</tspan></text><rect class="node system-node" x="825.0" y="699.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="728.0" text-anchor="middle"><tspan x="1020.0" y="728.0">O sistema valida o vínculo com o local ativo</tspan><tspan x="1020.0" y="748.0">(RN-071).</tspan></text><rect class="node system-node" x="825.0" y="822.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="851.0" text-anchor="middle"><tspan x="1020.0" y="851.0">O sistema cria a publicação e registra a operação</tspan><tspan x="1020.0" y="871.0">de auditoria (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,945.0 1092.0,987.0 1020.0,1029.0 948.0,987.0"/><text class="small" x="1020.0" y="992.0" text-anchor="middle"><tspan x="1020.0" y="992.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1141.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1170.0" text-anchor="middle"><tspan x="1020.0" y="1170.0">O sistema a disponibiliza somente enquanto o</tspan><tspan x="1020.0" y="1190.0">vínculo permanecer válido (RN-071).</tspan></text><polygon class="merge" points="1020.0,1334.0 1035.0,1349.0 1020.0,1364.0 1005.0,1349.0"/><polygon class="node system-node decision" points="1020.0,1407.0 1092.0,1449.0 1020.0,1491.0 948.0,1449.0"/><text class="small" x="1020.0" y="1454.0" text-anchor="middle"><tspan x="1020.0" y="1454.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1603.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1640.0" text-anchor="middle"><tspan x="1020.0" y="1640.0">O sistema nega a operação (RN-066).</tspan></text><circle cx="1020.0" cy="1723.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1723.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1848.0 1035.0,1863.0 1020.0,1878.0 1005.0,1863.0"/><rect class="node system-node" x="825.0" y="1921.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1950.0" text-anchor="middle"><tspan x="1020.0" y="1950.0">Resultado: Publicação vinculada é criada e</tspan><tspan x="1020.0" y="1970.0">permanece disponível somente enquanto o vínculo</tspan><tspan x="1020.0" y="1990.0">com o local for válido.</tspan></text><circle cx="1020.0" cy="2064.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2064.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1098.0"><tspan x="110" y="1098.0">A1 — A publicação é vinculada a um local</tspan></text><text class="guard" x="92" y="977.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1340.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1560.0"><tspan x="110" y="1560.0">E1 — Administrador tenta criar publicação fora do local vinculado</tspan></text><text class="guard" x="92" y="1439.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1728.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2159.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
