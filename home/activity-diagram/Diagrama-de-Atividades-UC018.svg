  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O usuário cria uma lista e informa o nome.</tspan></text><rect class="node" x="185.0" y="389.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="426.0" text-anchor="middle"><tspan x="380.0" y="426.0">Adiciona, remove ou reordena locais na lista.</tspan></text><rect class="node system-node" x="825.0" y="508.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema valida a propriedade da lista.</tspan></text><rect class="node system-node" x="825.0" y="627.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema salva a lista atualizada.</tspan></text><polygon class="node system-node decision" points="1020.0,746.0 1110.0,798.0 1020.0,850.0 930.0,798.0"/><text class="small" x="1020.0" y="803.0" text-anchor="middle"><tspan x="1020.0" y="803.0">A1 aplicável?</tspan></text><rect class="node" x="185.0" y="952.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="981.0" text-anchor="middle"><tspan x="380.0" y="981.0">O usuário edita ou exclui uma lista própria</tspan><tspan x="380.0" y="1001.0">já existente</tspan></text><polygon class="merge" points="1020.0,1123.0 1035.0,1138.0 1020.0,1153.0 1005.0,1138.0"/><polygon class="node system-node decision" points="1020.0,1196.0 1110.0,1248.0 1020.0,1300.0 930.0,1248.0"/><text class="small" x="1020.0" y="1243.0" text-anchor="middle"><tspan x="1020.0" y="1243.0">Tentativa de alterar</tspan><tspan x="1020.0" y="1263.0">lista de terceiro?</tspan></text><rect class="node exception-node" x="825.0" y="1402.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1439.0" text-anchor="middle"><tspan x="1020.0" y="1439.0">O sistema nega a operação</tspan></text><circle cx="1020.0" cy="1522.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1522.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1605.0 1035.0,1620.0 1020.0,1635.0 1005.0,1620.0"/><rect class="node system-node" x="825.0" y="1678.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1707.0" text-anchor="middle"><tspan x="1020.0" y="1707.0">Resultado: Lista do proprietário é criada,</tspan><tspan x="1020.0" y="1727.0">atualizada ou excluída conforme a operação.</tspan></text><circle cx="1020.0" cy="1801.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1801.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1129.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="914.0" text-anchor="start"><tspan x="110.0" y="914.0">A1 — A1 aplicável</tspan></text><text class="guard" x="92" y="788.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1527.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1364.0" text-anchor="start"><tspan x="110.0" y="1364.0">E1 — Tentativa de alterar lista de terceiro</tspan></text><text class="guard" x="92" y="1238.0">[fluxo principal]</text>

