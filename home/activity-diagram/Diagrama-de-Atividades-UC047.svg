<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2827.0" viewBox="0 0 1400 2827.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-047 — Cadastrar atração</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2827.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-047</text>
  <text class="subtitle" x="70" y="75">Cadastrar atração · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2557.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DO EQUIPAMENTO</text><rect x="700.0" y="100" width="640.0" height="2557.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1111.0" width="1224.0" height="204.0" rx="18"/><rect class="alternative-band" x="88" y="1569.0" width="1224.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="2051.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 378.0 V405.5 H1020.0 V433.0"/><path class="flow" d="M1020.0 501.0 V528.5 H380.0 V556.0"/><path class="flow" d="M380.0 684.0 V711.5 H1020.0 V739.0"/><path class="flow" d="M1020.0 807.0 V862.0"/><path class="flow" d="M1020.0 930.0 V985.0"/><path class="main-flow" d="M948.0 1027.0 H80.0 V1385.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1027.0 H1350.0 V1161.0"/><path class="flow" d="M1350.0 1161.0 H1020.0 V1181.0"/><path class="return-flow no-arrow" d="M1020.0 1245.0 H1382.0 V1385.0"/><path class="return-flow" d="M1382.0 1385.0 H1035.0"/><path class="flow" d="M1020.0 1400.0 V1443.0"/><path class="main-flow" d="M948.0 1485.0 H80.0 V1867.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1485.0 H1350.0 V1619.0"/><path class="flow" d="M1350.0 1619.0 H1020.0 V1639.0"/><path class="return-flow no-arrow" d="M1020.0 1727.0 H1382.0 V1867.0"/><path class="return-flow" d="M1382.0 1867.0 H1035.0"/><path class="flow" d="M1020.0 1882.0 V1925.0"/><path class="main-flow" d="M948.0 1967.0 H80.0 V2381.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1967.0 H1350.0 V2101.0"/><path class="error-flow" d="M1350.0 2101.0 H1020.0 V2121.0"/><path class="error-flow" d="M1020.0 2185.0 V2223.0"/><path class="flow" d="M1020.0 2396.0 V2439.0"/><path class="flow" d="M1020.0 2527.0 V2564.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="108.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador de equipamento cultural acessa o</tspan><tspan x="380.0" y="319.0">cadastro de atrações do equipamento ao qual está</tspan><tspan x="380.0" y="339.0">vinculado; o sistema inclui UC-046 para confirmar</tspan><tspan x="380.0" y="359.0">a sessão administrativa.</tspan></text><rect class="node system-node" x="825.0" y="433.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="462.0" text-anchor="middle"><tspan x="1020.0" y="462.0">O sistema verifica o escopo do administrador sobre</tspan><tspan x="1020.0" y="482.0">o equipamento (RN-066).</tspan></text><rect class="node" x="185.0" y="556.0" width="390.0" height="128.0" rx="18"/><text class="text" x="380.0" y="585.0" text-anchor="middle"><tspan x="380.0" y="585.0">O administrador informa descrição da experiência,</tspan><tspan x="380.0" y="605.0">horários de visitação, localização, valor de</tspan><tspan x="380.0" y="625.0">ingresso quando aplicável, acessibilidade,</tspan><tspan x="380.0" y="645.0">adequação infantil, segurança do entorno,</tspan><tspan x="380.0" y="665.0">programação associada e contato (RN-012).</tspan></text><rect class="node system-node" x="825.0" y="739.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="768.0" text-anchor="middle"><tspan x="1020.0" y="768.0">O sistema valida os dados mínimos e o vínculo com</tspan><tspan x="1020.0" y="788.0">o equipamento ativo (RN-068).</tspan></text><rect class="node system-node" x="825.0" y="862.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="891.0" text-anchor="middle"><tspan x="1020.0" y="891.0">O sistema registra a atração e a operação de</tspan><tspan x="1020.0" y="911.0">auditoria (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,985.0 1092.0,1027.0 1020.0,1069.0 948.0,1027.0"/><text class="small" x="1020.0" y="1032.0" text-anchor="middle"><tspan x="1020.0" y="1032.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1181.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1218.0" text-anchor="middle"><tspan x="1020.0" y="1218.0">O sistema mantém a atração como não publicada.</tspan></text><polygon class="merge" points="1020.0,1370.0 1035.0,1385.0 1020.0,1400.0 1005.0,1385.0"/><polygon class="node system-node decision" points="1020.0,1443.0 1092.0,1485.0 1020.0,1527.0 948.0,1485.0"/><text class="small" x="1020.0" y="1490.0" text-anchor="middle"><tspan x="1020.0" y="1490.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1639.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1668.0" text-anchor="middle"><tspan x="1020.0" y="1668.0">A alteração só é aplicada após confirmação do</tspan><tspan x="1020.0" y="1688.0">administrador, sem que a sinalização altere o dado</tspan><tspan x="1020.0" y="1708.0">oficial por conta própria (RN-038).</tspan></text><polygon class="merge" points="1020.0,1852.0 1035.0,1867.0 1020.0,1882.0 1005.0,1867.0"/><polygon class="node system-node decision" points="1020.0,1925.0 1092.0,1967.0 1020.0,2009.0 948.0,1967.0"/><text class="small" x="1020.0" y="1972.0" text-anchor="middle"><tspan x="1020.0" y="1972.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="2121.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="2158.0" text-anchor="middle"><tspan x="1020.0" y="2158.0">O sistema nega a operação (RN-066).</tspan></text><circle cx="1020.0" cy="2241.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2241.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2366.0 1035.0,2381.0 1020.0,2396.0 1005.0,2381.0"/><rect class="node system-node" x="825.0" y="2439.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2468.0" text-anchor="middle"><tspan x="1020.0" y="2468.0">Resultado: Atração é criada, com estado de</tspan><tspan x="1020.0" y="2488.0">publicação compatível com os dados mínimos e</tspan><tspan x="1020.0" y="2508.0">trilha de auditoria.</tspan></text><circle cx="1020.0" cy="2582.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2582.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1138.0"><tspan x="110" y="1138.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="1017.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1376.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1596.0"><tspan x="110" y="1596.0">A2 — O cadastro decorre de uma sinalização comunitária validada</tspan></text><text class="guard" x="92" y="1475.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1858.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2078.0"><tspan x="110" y="2078.0">E1 — Administrador tenta cadastrar atração fora do equipamento vinculado</tspan></text><text class="guard" x="92" y="1957.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2246.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2677.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
