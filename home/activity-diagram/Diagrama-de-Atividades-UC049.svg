<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2324.0" viewBox="0 0 1400.0 2324.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-049 — Editar publicação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2324.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-049</text>
  <text class="subtitle" x="70" y="75">Editar publicação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2074.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FFEDD5"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">ADMIN. DO LOCAL</tspan></text><rect x="700.0" y="100" width="640.0" height="2074.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1160.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1610.0" width="1224.0" height="218.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V516.0"/><path class="flow" d="M1020.0 604.0 V631.5 H380.0 V659.0"/><path class="flow" d="M380.0 727.0 V754.5 H1020.0 V782.0"/><path class="flow" d="M1020.0 846.0 V901.0"/><path class="flow" d="M1020.0 969.0 V1024.0"/><path class="branch-bus no-arrow" d="M1110.0 1076.0 H1350.0 V1210.0"/><path class="flow" d="M1350.0 1210.0 H1020.0 V1230.0"/><path class="main-flow" d="M930.0 1076.0 H80.0 V1416.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1298.0 H1382.0 V1416.0"/><path class="return-flow" d="M1382.0 1416.0 H1035.0"/><path class="flow" d="M1020.0 1431.0 V1474.0"/><path class="branch-bus no-arrow" d="M1110.0 1526.0 H1350.0 V1660.0"/><path class="error-flow" d="M1350.0 1660.0 H1020.0 V1680.0"/><path class="main-flow" d="M930.0 1526.0 H80.0 V1898.0 H1005.0"/><path class="error-flow" d="M1020.0 1744.0 V1782.0"/><path class="flow" d="M1020.0 1913.0 V1956.0"/><path class="flow" d="M1020.0 2044.0 V2081.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador seleciona uma publicação</tspan><tspan x="380.0" y="319.0">existente</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">o sistema inclui UC-038 para confirmar a</tspan><tspan x="1020.0" y="442.0">sessão administrativa.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema verifica o escopo do administrador</tspan><tspan x="1020.0" y="565.0">e o vínculo da publicação com o local ativo</tspan><tspan x="1020.0" y="585.0">(RN-066, RN-071).</tspan></text><rect class="node" x="185.0" y="659.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="688.0" text-anchor="middle"><tspan x="380.0" y="688.0">O administrador altera título, conteúdo ou</tspan><tspan x="380.0" y="708.0">demais dados.</tspan></text><rect class="node system-node" x="825.0" y="782.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="819.0" text-anchor="middle"><tspan x="1020.0" y="819.0">O sistema valida os dados e o vínculo.</tspan></text><rect class="node system-node" x="825.0" y="901.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="930.0" text-anchor="middle"><tspan x="1020.0" y="930.0">O sistema salva a alteração e registra o</tspan><tspan x="1020.0" y="950.0">histórico da operação (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,1024.0 1110.0,1076.0 1020.0,1128.0 930.0,1076.0"/><text class="small" x="1020.0" y="1061.0" text-anchor="middle"><tspan x="1020.0" y="1061.0">A edição invalida o</tspan><tspan x="1020.0" y="1081.0">vínculo com o local</tspan><tspan x="1020.0" y="1101.0">ativo?</tspan></text><rect class="node system-node" x="825.0" y="1230.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1259.0" text-anchor="middle"><tspan x="1020.0" y="1259.0">A publicação deixa de ficar visível ao</tspan><tspan x="1020.0" y="1279.0">público (RN-072)</tspan></text><polygon class="merge" points="1020.0,1401.0 1035.0,1416.0 1020.0,1431.0 1005.0,1416.0"/><polygon class="node system-node decision" points="1020.0,1474.0 1110.0,1526.0 1020.0,1578.0 930.0,1526.0"/><text class="small" x="1020.0" y="1511.0" text-anchor="middle"><tspan x="1020.0" y="1511.0">A publicação não</tspan><tspan x="1020.0" y="1531.0">pertence ao escopo do</tspan><tspan x="1020.0" y="1551.0">administrador?</tspan></text><rect class="node exception-node" x="825.0" y="1680.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1717.0" text-anchor="middle"><tspan x="1020.0" y="1717.0">O sistema nega a alteração (RN-066)</tspan></text><circle cx="1020.0" cy="1800.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1800.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1883.0 1035.0,1898.0 1020.0,1913.0 1005.0,1898.0"/><rect class="node system-node" x="825.0" y="1956.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1985.0" text-anchor="middle"><tspan x="1020.0" y="1985.0">Resultado: Conteúdo da publicação é</tspan><tspan x="1020.0" y="2005.0">atualizado; publicação sem vínculo válido</tspan><tspan x="1020.0" y="2025.0">deixa de ficar visível ao público.</tspan></text><circle cx="1020.0" cy="2099.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2099.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1407.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1192.0" text-anchor="start"><tspan x="110.0" y="1192.0">A1 — A edição invalida o vínculo com o local ativo</tspan></text><text class="guard" x="92" y="1066.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1805.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1642.0" text-anchor="start"><tspan x="110.0" y="1642.0">E1 — A publicação não pertence ao escopo do administrador</tspan></text><text class="guard" x="92" y="1516.0">[fluxo principal]</text>

  <g transform="translate(340.0 2194.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
