<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2703.0" viewBox="0 0 1400.0 2703.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-071 — Consultar procedência do dado e abrir canal externo</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2703.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-071</text>
  <text class="subtitle" x="70" y="75">Consultar procedência do dado e abrir canal externo · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2453.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">VISITANTE</tspan></text><rect x="700.0" y="100" width="640.0" height="2453.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1061.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1511.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1961.0" width="1224.0" height="206.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V233.5 H1020.0 V270.0"/><path class="flow" d="M1020.0 338.0 V393.0"/><path class="flow" d="M1020.0 461.0 V516.0"/><path class="flow" d="M1020.0 584.0 V611.5 H380.0 V639.0"/><path class="flow" d="M380.0 747.0 V774.5 H1020.0 V802.0"/><path class="flow" d="M1020.0 870.0 V925.0"/><path class="branch-bus no-arrow" d="M1110.0 977.0 H1350.0 V1111.0"/><path class="flow" d="M1350.0 1111.0 H1020.0 V1131.0"/><path class="main-flow" d="M930.0 977.0 H80.0 V1317.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1199.0 H1382.0 V1317.0"/><path class="return-flow" d="M1382.0 1317.0 H1035.0"/><path class="flow" d="M1020.0 1332.0 V1375.0"/><path class="branch-bus no-arrow" d="M1110.0 1427.0 H1350.0 V1561.0"/><path class="error-flow" d="M1350.0 1561.0 H1020.0 V1581.0"/><path class="main-flow" d="M930.0 1427.0 H80.0 V1767.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1649.0 H1382.0 V1767.0"/><path class="return-flow" d="M1382.0 1767.0 H1035.0"/><path class="flow" d="M1020.0 1782.0 V1825.0"/><path class="branch-bus no-arrow" d="M1110.0 1877.0 H1350.0 V2011.0"/><path class="error-flow" d="M1350.0 2011.0 H380.0 V2031.0"/><path class="main-flow" d="M930.0 1877.0 H80.0 V2237.0 H1005.0"/><path class="return-flow no-arrow" d="M380.0 2119.0 H1382.0 V2237.0"/><path class="return-flow" d="M1382.0 2237.0 H1035.0"/><path class="flow" d="M1020.0 2252.0 V2295.0"/><path class="flow" d="M1020.0 2423.0 V2460.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node system-node" x="825.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="299.0" text-anchor="middle"><tspan x="1020.0" y="299.0">O caso base inclui esta consulta ao</tspan><tspan x="1020.0" y="319.0">apresentar um dado sensível à atualização.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema identifica a fonte e a data da</tspan><tspan x="1020.0" y="442.0">última verificação do dado.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema sinaliza o estado “em revisão”</tspan><tspan x="1020.0" y="565.0">quando há apuração em curso.</tspan></text><rect class="node" x="185.0" y="639.0" width="390.0" height="108.0" rx="18"/><text class="text" x="380.0" y="668.0" text-anchor="middle"><tspan x="380.0" y="668.0">O visitante aciona um link de mapa/trajeto,</tspan><tspan x="380.0" y="688.0">telefone, WhatsApp, e-mail, site oficial,</tspan><tspan x="380.0" y="708.0">rede social oficial ou reserva/ingresso</tspan><tspan x="380.0" y="728.0">oficial.</tspan></text><rect class="node system-node" x="825.0" y="802.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="831.0" text-anchor="middle"><tspan x="1020.0" y="831.0">O sistema abre o canal externo somente após a</tspan><tspan x="1020.0" y="851.0">ação do visitante.</tspan></text><polygon class="node system-node decision" points="1020.0,925.0 1110.0,977.0 1020.0,1029.0 930.0,977.0"/><text class="small" x="1020.0" y="972.0" text-anchor="middle"><tspan x="1020.0" y="972.0">Link oficial</tspan><tspan x="1020.0" y="992.0">disponível?</tspan></text><rect class="node system-node" x="825.0" y="1131.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1160.0" text-anchor="middle"><tspan x="1020.0" y="1160.0">O sistema abre o serviço externo diretamente</tspan><tspan x="1020.0" y="1180.0">após a confirmação do visitante</tspan></text><polygon class="merge" points="1020.0,1302.0 1035.0,1317.0 1020.0,1332.0 1005.0,1317.0"/><polygon class="node system-node decision" points="1020.0,1375.0 1110.0,1427.0 1020.0,1479.0 930.0,1427.0"/><text class="small" x="1020.0" y="1422.0" text-anchor="middle"><tspan x="1020.0" y="1422.0">Dado desatualizado ou</tspan><tspan x="1020.0" y="1442.0">ainda não verificado?</tspan></text><rect class="node exception-node" x="825.0" y="1581.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1610.0" text-anchor="middle"><tspan x="1020.0" y="1610.0">O sistema sinaliza a limitação sem ocultar a</tspan><tspan x="1020.0" y="1630.0">informação</tspan></text><polygon class="merge" points="1020.0,1752.0 1035.0,1767.0 1020.0,1782.0 1005.0,1767.0"/><polygon class="node system-node decision" points="1020.0,1825.0 1110.0,1877.0 1020.0,1929.0 930.0,1877.0"/><text class="small" x="1020.0" y="1872.0" text-anchor="middle"><tspan x="1020.0" y="1872.0">Serviço externo</tspan><tspan x="1020.0" y="1892.0">indisponível?</tspan></text><rect class="node exception-node" x="185.0" y="2031.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="2060.0" text-anchor="middle"><tspan x="380.0" y="2060.0">Os dados locais permanecem visíveis e o</tspan><tspan x="380.0" y="2080.0">sistema informa que o trajeto ou link não</tspan><tspan x="380.0" y="2100.0">pôde ser aberto, sem expor detalhes técnicos</tspan></text><polygon class="merge" points="1020.0,2222.0 1035.0,2237.0 1020.0,2252.0 1005.0,2237.0"/><rect class="node system-node" x="825.0" y="2295.0" width="390.0" height="128.0" rx="18"/><text class="text" x="1020.0" y="2324.0" text-anchor="middle"><tspan x="1020.0" y="2324.0">Resultado: Fonte, data de verificação e</tspan><tspan x="1020.0" y="2344.0">eventual estado “em revisão” ficam visíveis;</tspan><tspan x="1020.0" y="2364.0">canal externo é aberto após ação do</tspan><tspan x="1020.0" y="2384.0">visitante, ou o dado local permanece visível</tspan><tspan x="1020.0" y="2404.0">caso o canal falhe.</tspan></text><circle cx="1020.0" cy="2478.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2478.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1308.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1093.0" text-anchor="start"><tspan x="110.0" y="1093.0">A1 — Link oficial disponível</tspan></text><text class="guard" x="92" y="967.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1758.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1543.0" text-anchor="start"><tspan x="110.0" y="1543.0">E1 — Dado desatualizado ou ainda não verificado</tspan></text><text class="guard" x="92" y="1417.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="2228.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1993.0" text-anchor="start"><tspan x="110.0" y="1993.0">E2 — Serviço externo indisponível</tspan></text><text class="guard" x="92" y="1867.0">[fluxo principal]</text>

  <g transform="translate(340.0 2573.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
