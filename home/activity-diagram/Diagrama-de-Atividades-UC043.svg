<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="3332.0" viewBox="0 0 1400.0 3332.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-043 — Cadastrar estabelecimento gastronômico</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="3332.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-043</text>
  <text class="subtitle" x="70" y="75">Cadastrar estabelecimento gastronômico · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="3082.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FBCFE8"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">ADMIN. DA PLATAFORMA</tspan></text><rect x="700.0" y="100" width="640.0" height="3082.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1264.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1714.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="2164.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="2614.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V488.5 H380.0 V516.0"/><path class="flow" d="M380.0 664.0 V691.5 H1020.0 V719.0"/><path class="flow" d="M1020.0 807.0 V862.0"/><path class="flow" d="M1020.0 930.0 V985.0"/><path class="flow" d="M1020.0 1073.0 V1128.0"/><path class="branch-bus no-arrow" d="M1110.0 1180.0 H1350.0 V1314.0"/><path class="flow" d="M1350.0 1314.0 H1020.0 V1334.0"/><path class="main-flow" d="M930.0 1180.0 H80.0 V1520.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1402.0 H1382.0 V1520.0"/><path class="return-flow" d="M1382.0 1520.0 H1035.0"/><path class="flow" d="M1020.0 1535.0 V1578.0"/><path class="branch-bus no-arrow" d="M1110.0 1630.0 H1350.0 V1764.0"/><path class="flow" d="M1350.0 1764.0 H1020.0 V1784.0"/><path class="main-flow" d="M930.0 1630.0 H80.0 V1970.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1852.0 H1382.0 V1970.0"/><path class="return-flow" d="M1382.0 1970.0 H1035.0"/><path class="flow" d="M1020.0 1985.0 V2028.0"/><path class="branch-bus no-arrow" d="M1110.0 2080.0 H1350.0 V2214.0"/><path class="flow" d="M1350.0 2214.0 H1020.0 V2234.0"/><path class="main-flow" d="M930.0 2080.0 H80.0 V2420.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 2302.0 H1382.0 V2420.0"/><path class="return-flow" d="M1382.0 2420.0 H1035.0"/><path class="flow" d="M1020.0 2435.0 V2478.0"/><path class="branch-bus no-arrow" d="M1110.0 2530.0 H1350.0 V2664.0"/><path class="error-flow" d="M1350.0 2664.0 H1020.0 V2684.0"/><path class="main-flow" d="M930.0 2530.0 H80.0 V2906.0 H1005.0"/><path class="error-flow" d="M1020.0 2752.0 V2790.0"/><path class="flow" d="M1020.0 2921.0 V2964.0"/><path class="flow" d="M1020.0 3052.0 V3089.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador da plataforma inicia o</tspan><tspan x="380.0" y="319.0">cadastro de um estabelecimento gastronômico</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">o sistema inclui UC-038 para confirmar a</tspan><tspan x="1020.0" y="442.0">sessão administrativa.</tspan></text><rect class="node" x="185.0" y="516.0" width="390.0" height="148.0" rx="18"/><text class="text" x="380.0" y="545.0" text-anchor="middle"><tspan x="380.0" y="545.0">O administrador informa CNPJ quando</tspan><tspan x="380.0" y="565.0">aplicável, cardápio ou descrição de produtos,</tspan><tspan x="380.0" y="585.0">faixa de preços, couvert artístico quando</tspan><tspan x="380.0" y="605.0">aplicável, horários, formato de atendimento,</tspan><tspan x="380.0" y="625.0">regras do local, canal de contato e o</tspan><tspan x="380.0" y="645.0">responsável administrativo (RN-011).</tspan></text><rect class="node system-node" x="825.0" y="719.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="748.0" text-anchor="middle"><tspan x="1020.0" y="748.0">O sistema valida os dados mínimos do cadastro</tspan><tspan x="1020.0" y="768.0">(RN-068) e verifica duplicidade conforme o</tspan><tspan x="1020.0" y="788.0">critério aplicável (RN-095).</tspan></text><rect class="node system-node" x="825.0" y="862.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="891.0" text-anchor="middle"><tspan x="1020.0" y="891.0">O sistema registra o estabelecimento e a</tspan><tspan x="1020.0" y="911.0">operação de auditoria (RN-076).</tspan></text><rect class="node system-node" x="825.0" y="985.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1014.0" text-anchor="middle"><tspan x="1020.0" y="1014.0">O sistema disponibiliza o estabelecimento ou</tspan><tspan x="1020.0" y="1034.0">o mantém pendente até que atenda às condições</tspan><tspan x="1020.0" y="1054.0">de publicação.</tspan></text><polygon class="node system-node decision" points="1020.0,1128.0 1110.0,1180.0 1020.0,1232.0 930.0,1180.0"/><text class="small" x="1020.0" y="1175.0" text-anchor="middle"><tspan x="1020.0" y="1175.0">Há dados mínimos</tspan><tspan x="1020.0" y="1195.0">pendentes?</tspan></text><rect class="node system-node" x="825.0" y="1334.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1363.0" text-anchor="middle"><tspan x="1020.0" y="1363.0">O sistema mantém o cadastro fora da exibição</tspan><tspan x="1020.0" y="1383.0">pública e informa os campos necessários</tspan></text><polygon class="merge" points="1020.0,1505.0 1035.0,1520.0 1020.0,1535.0 1005.0,1520.0"/><polygon class="node system-node decision" points="1020.0,1578.0 1110.0,1630.0 1020.0,1682.0 930.0,1630.0"/><text class="small" x="1020.0" y="1605.0" text-anchor="middle"><tspan x="1020.0" y="1605.0">O estabelecimento já</tspan><tspan x="1020.0" y="1625.0">possui cadastro</tspan><tspan x="1020.0" y="1645.0">(mesmo CNPJ ou</tspan><tspan x="1020.0" y="1665.0">correspondência de</tspan></text><rect class="node system-node" x="825.0" y="1784.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1813.0" text-anchor="middle"><tspan x="1020.0" y="1813.0">O sistema direciona o administrador para a</tspan><tspan x="1020.0" y="1833.0">edição do cadastro existente</tspan></text><polygon class="merge" points="1020.0,1955.0 1035.0,1970.0 1020.0,1985.0 1005.0,1970.0"/><polygon class="node system-node decision" points="1020.0,2028.0 1110.0,2080.0 1020.0,2132.0 930.0,2080.0"/><text class="small" x="1020.0" y="2065.0" text-anchor="middle"><tspan x="1020.0" y="2065.0">O cadastro decorre de</tspan><tspan x="1020.0" y="2085.0">uma sinalização</tspan><tspan x="1020.0" y="2105.0">comunitária validada?</tspan></text><rect class="node system-node" x="825.0" y="2234.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2263.0" text-anchor="middle"><tspan x="1020.0" y="2263.0">A alteração só é aplicada após confirmação do</tspan><tspan x="1020.0" y="2283.0">administrador (RN-038)</tspan></text><polygon class="merge" points="1020.0,2405.0 1035.0,2420.0 1020.0,2435.0 1005.0,2420.0"/><polygon class="node system-node decision" points="1020.0,2478.0 1110.0,2530.0 1020.0,2582.0 930.0,2530.0"/><text class="small" x="1020.0" y="2505.0" text-anchor="middle"><tspan x="1020.0" y="2505.0">A sessão</tspan><tspan x="1020.0" y="2525.0">administrativa não é</tspan><tspan x="1020.0" y="2545.0">confirmada pelo</tspan><tspan x="1020.0" y="2565.0">UC-038?</tspan></text><rect class="node exception-node" x="825.0" y="2684.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2713.0" text-anchor="middle"><tspan x="1020.0" y="2713.0">O sistema nega o cadastro e não cria registro</tspan><tspan x="1020.0" y="2733.0">público</tspan></text><circle cx="1020.0" cy="2808.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2808.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2891.0 1035.0,2906.0 1020.0,2921.0 1005.0,2906.0"/><rect class="node system-node" x="825.0" y="2964.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2993.0" text-anchor="middle"><tspan x="1020.0" y="2993.0">Resultado: Estabelecimento é registrado, com</tspan><tspan x="1020.0" y="3013.0">estado de publicação compatível com os dados</tspan><tspan x="1020.0" y="3033.0">mínimos e trilha de auditoria.</tspan></text><circle cx="1020.0" cy="3107.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="3107.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1511.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1296.0" text-anchor="start"><tspan x="110.0" y="1296.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="1170.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1961.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1736.0" text-anchor="start"><tspan x="110.0" y="1736.0">A2 — O estabelecimento já possui cadastro (mesmo CNPJ ou correspondência de nome,</tspan><tspan x="110.0" y="1756.0">endereço e categoria, conforme RN-095)</tspan></text><text class="guard" x="92" y="1620.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="2411.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="2196.0" text-anchor="start"><tspan x="110.0" y="2196.0">A3 — O cadastro decorre de uma sinalização comunitária validada</tspan></text><text class="guard" x="92" y="2070.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2813.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2646.0" text-anchor="start"><tspan x="110.0" y="2646.0">E1 — A sessão administrativa não é confirmada pelo UC-038</tspan></text><text class="guard" x="92" y="2520.0">[fluxo principal]</text>

  <g transform="translate(340.0 3202.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
