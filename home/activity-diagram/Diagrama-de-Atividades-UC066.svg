<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="1529.0" viewBox="0 0 1400.0 1529.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-066 — Navegar pela barra inferior do Explorador</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="1529.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-066</text>
  <text class="subtitle" x="70" y="75">Navegar pela barra inferior do Explorador · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1279.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">VISITANTE</tspan></text><rect x="700.0" y="100" width="640.0" height="1279.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="exception-band" x="88" y="811.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V413.0"/><path class="flow" d="M380.0 477.0 V504.5 H1020.0 V532.0"/><path class="flow" d="M1020.0 620.0 V675.0"/><path class="branch-bus no-arrow" d="M1110.0 727.0 H1350.0 V861.0"/><path class="error-flow" d="M1350.0 861.0 H1020.0 V881.0"/><path class="main-flow" d="M930.0 727.0 H80.0 V1103.0 H1005.0"/><path class="error-flow" d="M1020.0 949.0 V987.0"/><path class="flow" d="M1020.0 1118.0 V1161.0"/><path class="flow" d="M1020.0 1249.0 V1286.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O visitante visualiza a barra de navegação</tspan><tspan x="380.0" y="319.0">inferior fixa com as seções Início, Explorar,</tspan><tspan x="380.0" y="339.0">Assistente, Comunidade e Perfil.</tspan></text><rect class="node" x="185.0" y="413.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="450.0" text-anchor="middle"><tspan x="380.0" y="450.0">Seleciona uma das seções.</tspan></text><rect class="node system-node" x="825.0" y="532.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="561.0" text-anchor="middle"><tspan x="1020.0" y="561.0">O sistema exibe o conteúdo da seção</tspan><tspan x="1020.0" y="581.0">escolhida, mantendo a barra fixa e destacando</tspan><tspan x="1020.0" y="601.0">o item ativo.</tspan></text><polygon class="node system-node decision" points="1020.0,675.0 1110.0,727.0 1020.0,779.0 930.0,727.0"/><text class="small" x="1020.0" y="712.0" text-anchor="middle"><tspan x="1020.0" y="712.0">O visitante não</tspan><tspan x="1020.0" y="732.0">autenticado seleciona</tspan><tspan x="1020.0" y="752.0">&quot;Perfil&quot;?</tspan></text><rect class="node exception-node" x="825.0" y="881.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="910.0" text-anchor="middle"><tspan x="1020.0" y="910.0">O sistema solicita login antes de exibir a</tspan><tspan x="1020.0" y="930.0">seção</tspan></text><circle cx="1020.0" cy="1005.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1005.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1088.0 1035.0,1103.0 1020.0,1118.0 1005.0,1103.0"/><rect class="node system-node" x="825.0" y="1161.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1190.0" text-anchor="middle"><tspan x="1020.0" y="1190.0">Resultado: Seção selecionada (Início,</tspan><tspan x="1020.0" y="1210.0">Explorar, Assistente, Comunidade ou Perfil) é</tspan><tspan x="1020.0" y="1230.0">exibida.</tspan></text><circle cx="1020.0" cy="1304.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1304.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1048.0" y="1010.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="843.0" text-anchor="start"><tspan x="110.0" y="843.0">E1 — O visitante não autenticado seleciona &quot;Perfil&quot;</tspan></text><text class="guard" x="92" y="717.0">[fluxo principal]</text>

  <g transform="translate(340.0 1399.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
