<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3245.0" viewBox="0 0 1400 3245.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-022 — Publicar avaliação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="3245.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-022</text>
  <text class="subtitle" x="70" y="75">Publicar avaliação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2975.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">USUÁRIO AUTENTICADO</text><rect x="700.0" y="100" width="640.0" height="2975.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1003.0" width="1224.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1465.0" width="1224.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="1947.0" width="1224.0" height="264.0" rx="18"/><rect class="exception-band" x="88" y="2465.0" width="1224.0" height="284.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 334.0 V389.0"/><path class="flow" d="M380.0 457.0 V484.5 H1020.0 V512.0"/><path class="flow" d="M1020.0 580.0 V607.5 H380.0 V635.0"/><path class="flow" d="M380.0 699.0 V726.5 H1020.0 V754.0"/><path class="flow" d="M1020.0 822.0 V877.0"/><path class="main-flow" d="M948.0 919.0 H80.0 V1281.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 919.0 H1350.0 V1053.0"/><path class="flow" d="M1350.0 1053.0 H1020.0 V1073.0"/><path class="return-flow no-arrow" d="M1020.0 1141.0 H1382.0 V1281.0"/><path class="return-flow" d="M1382.0 1281.0 H1035.0"/><path class="flow" d="M1020.0 1296.0 V1339.0"/><path class="main-flow" d="M948.0 1381.0 H80.0 V1763.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1381.0 H1350.0 V1515.0"/><path class="flow" d="M1350.0 1515.0 H1020.0 V1535.0"/><path class="return-flow no-arrow" d="M1020.0 1623.0 H1382.0 V1763.0"/><path class="return-flow" d="M1382.0 1763.0 H1035.0"/><path class="flow" d="M1020.0 1778.0 V1821.0"/><path class="main-flow" d="M948.0 1863.0 H80.0 V2281.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1863.0 H1350.0 V1997.0"/><path class="error-flow" d="M1350.0 1997.0 H1020.0 V2017.0"/><path class="error-flow" d="M1020.0 2085.0 V2123.0"/><path class="flow" d="M1020.0 2296.0 V2339.0"/><path class="main-flow" d="M948.0 2381.0 H80.0 V2819.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 2381.0 H1350.0 V2515.0"/><path class="error-flow" d="M1350.0 2515.0 H1020.0 V2535.0"/><path class="error-flow" d="M1020.0 2623.0 V2661.0"/><path class="flow" d="M1020.0 2834.0 V2877.0"/><path class="flow" d="M1020.0 2945.0 V2982.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O usuário abre o formulário de avaliação do local.</tspan></text><rect class="node" x="185.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="418.0" text-anchor="middle"><tspan x="380.0" y="418.0">Informa nota, comentário e, opcionalmente,</tspan><tspan x="380.0" y="438.0">contexto e mídias.</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="541.0" text-anchor="middle"><tspan x="1020.0" y="541.0">O sistema valida formato e vínculo do conteúdo</tspan><tspan x="1020.0" y="561.0">enviado.</tspan></text><rect class="node" x="185.0" y="635.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="672.0" text-anchor="middle"><tspan x="380.0" y="672.0">O usuário confirma o envio.</tspan></text><rect class="node system-node" x="825.0" y="754.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="783.0" text-anchor="middle"><tspan x="1020.0" y="783.0">O sistema associa a avaliação ao perfil do autor e</tspan><tspan x="1020.0" y="803.0">a publica ou encaminha à moderação.</tspan></text><polygon class="node system-node decision" points="1020.0,877.0 1092.0,919.0 1020.0,961.0 948.0,919.0"/><text class="small" x="1020.0" y="924.0" text-anchor="middle"><tspan x="1020.0" y="924.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1073.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1102.0" text-anchor="middle"><tspan x="1020.0" y="1102.0">O envio de arquivo segue as validações descritas</tspan><tspan x="1020.0" y="1122.0">em UC-040.</tspan></text><polygon class="merge" points="1020.0,1266.0 1035.0,1281.0 1020.0,1296.0 1005.0,1281.0"/><polygon class="node system-node decision" points="1020.0,1339.0 1092.0,1381.0 1020.0,1423.0 948.0,1381.0"/><text class="small" x="1020.0" y="1386.0" text-anchor="middle"><tspan x="1020.0" y="1386.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1535.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1564.0" text-anchor="middle"><tspan x="1020.0" y="1564.0">Essa ação é tratada separadamente pelo caso de</tspan><tspan x="1020.0" y="1584.0">sinalização de dado incorreto (UC-088, fora deste</tspan><tspan x="1020.0" y="1604.0">escopo), preservando a avaliação já preenchida.</tspan></text><polygon class="merge" points="1020.0,1748.0 1035.0,1763.0 1020.0,1778.0 1005.0,1763.0"/><polygon class="node system-node decision" points="1020.0,1821.0 1092.0,1863.0 1020.0,1905.0 948.0,1863.0"/><text class="small" x="1020.0" y="1868.0" text-anchor="middle"><tspan x="1020.0" y="1868.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="2017.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2046.0" text-anchor="middle"><tspan x="1020.0" y="2046.0">O sistema rejeita ou oculta a avaliação e informa</tspan><tspan x="1020.0" y="2066.0">o motivo aplicável.</tspan></text><circle cx="1020.0" cy="2141.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2141.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2266.0 1035.0,2281.0 1020.0,2296.0 1005.0,2281.0"/><polygon class="node system-node decision" points="1020.0,2339.0 1092.0,2381.0 1020.0,2423.0 948.0,2381.0"/><text class="small" x="1020.0" y="2386.0" text-anchor="middle"><tspan x="1020.0" y="2386.0">Condição E2?</tspan></text><rect class="node exception-node" x="825.0" y="2535.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2564.0" text-anchor="middle"><tspan x="1020.0" y="2564.0">O caso aciona a extensão UC-081, que preserva o</tspan><tspan x="1020.0" y="2584.0">conteúdo já preenchido e solicita nova</tspan><tspan x="1020.0" y="2604.0">autenticação antes de restaurá-lo.</tspan></text><circle cx="1020.0" cy="2679.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2679.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2804.0 1035.0,2819.0 1020.0,2834.0 1005.0,2819.0"/><rect class="node system-node" x="825.0" y="2877.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2906.0" text-anchor="middle"><tspan x="1020.0" y="2906.0">Resultado: Avaliação é enviada para publicação ou</tspan><tspan x="1020.0" y="2926.0">moderação e vinculada ao autor.</tspan></text><circle cx="1020.0" cy="3000.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="3000.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1030.0"><tspan x="110" y="1030.0">A1 — A avaliação contém mídia</tspan></text><text class="guard" x="92" y="909.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1272.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1492.0"><tspan x="110" y="1492.0">A2 — O usuário também percebe um dado cadastral incorreto no mesmo local</tspan></text><text class="guard" x="92" y="1371.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1754.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1974.0"><tspan x="110" y="1974.0">E1 — Conteúdo viola regra grave</tspan></text><text class="guard" x="92" y="1853.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2146.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="2492.0"><tspan x="110" y="2492.0">E2 — Sessão expira durante o preenchimento</tspan></text><text class="guard" x="92" y="2371.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2684.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 3095.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
