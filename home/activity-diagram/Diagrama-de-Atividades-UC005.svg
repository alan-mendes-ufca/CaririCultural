<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2106.0" viewBox="0 0 1400 2106.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-005 — Filtrar locais e eventos por categoria e público</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2106.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-005</text>
  <text class="subtitle" x="70" y="75">Filtrar locais e eventos por categoria e público · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1836.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">VISITANTE</text><rect x="700.0" y="100" width="640.0" height="1836.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="884.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1346.0" width="1224.0" height="264.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V516.0"/><path class="flow" d="M1020.0 580.0 V635.0"/><path class="flow" d="M1020.0 703.0 V758.0"/><path class="main-flow" d="M948.0 800.0 H80.0 V1162.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 800.0 H1350.0 V934.0"/><path class="flow" d="M1350.0 934.0 H380.0 V954.0"/><path class="return-flow no-arrow" d="M380.0 1022.0 H1382.0 V1162.0"/><path class="return-flow" d="M1382.0 1162.0 H1035.0"/><path class="flow" d="M1020.0 1177.0 V1220.0"/><path class="main-flow" d="M948.0 1262.0 H80.0 V1680.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1262.0 H1350.0 V1396.0"/><path class="error-flow" d="M1350.0 1396.0 H1020.0 V1416.0"/><path class="error-flow" d="M1020.0 1484.0 V1522.0"/><path class="flow" d="M1020.0 1695.0 V1738.0"/><path class="flow" d="M1020.0 1806.0 V1843.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O visitante escolhe categoria e/ou perfil de</tspan><tspan x="380.0" y="319.0">público desejado.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema executa UC-077 para validar os valores</tspan><tspan x="1020.0" y="442.0">informados.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="553.0" text-anchor="middle"><tspan x="1020.0" y="553.0">O sistema aplica os filtros sobre o catálogo.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema exibe os resultados e os filtros</tspan><tspan x="1020.0" y="684.0">aplicados.</tspan></text><polygon class="node system-node decision" points="1020.0,758.0 1092.0,800.0 1020.0,842.0 948.0,800.0"/><text class="small" x="1020.0" y="805.0" text-anchor="middle"><tspan x="1020.0" y="805.0">Condição A1?</tspan></text><rect class="node" x="185.0" y="954.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="983.0" text-anchor="middle"><tspan x="380.0" y="983.0">O visitante altera ou remove filtros e a pesquisa</tspan><tspan x="380.0" y="1003.0">é refeita.</tspan></text><polygon class="merge" points="1020.0,1147.0 1035.0,1162.0 1020.0,1177.0 1005.0,1162.0"/><polygon class="node system-node decision" points="1020.0,1220.0 1092.0,1262.0 1020.0,1304.0 948.0,1262.0"/><text class="small" x="1020.0" y="1267.0" text-anchor="middle"><tspan x="1020.0" y="1267.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1416.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1445.0" text-anchor="middle"><tspan x="1020.0" y="1445.0">O sistema oferece apenas valores aprovados</tspan><tspan x="1020.0" y="1465.0">(tratamento detalhado em UC-077).</tspan></text><circle cx="1020.0" cy="1540.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1540.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1665.0 1035.0,1680.0 1020.0,1695.0 1005.0,1680.0"/><rect class="node system-node" x="825.0" y="1738.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1767.0" text-anchor="middle"><tspan x="1020.0" y="1767.0">Resultado: Resultados filtrados são apresentados,</tspan><tspan x="1020.0" y="1787.0">com os filtros aplicados explícitos.</tspan></text><circle cx="1020.0" cy="1861.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1861.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="911.0"><tspan x="110" y="911.0">A1 — O visitante altera ou remove filtros e a pesquisa é refeita.</tspan></text><text class="guard" x="92" y="790.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1153.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1373.0"><tspan x="110" y="1373.0">E1 — Valor de filtro inválido</tspan></text><text class="guard" x="92" y="1252.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1545.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 1956.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
