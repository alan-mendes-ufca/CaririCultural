<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1640.0" viewBox="0 0 1580 1640.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-037 — Enviar pergunta por áudio ao assistente</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="1640.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-037</text>
  <text class="subtitle" x="70" y="75">Enviar pergunta por áudio ao assistente · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1370.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">VISITANTE</text><rect x="546.7" y="100" width="486.7" height="1370.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="1370.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">TRANSCRIÇÃO DE ÁUDIO</text>
  <rect class="exception-band" x="88" y="880.0" width="1404.0" height="264.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 334.0 V361.5 H1276.7 V389.0"/><path class="flow" d="M1276.7 457.0 V484.5 H790.0 V512.0"/><path class="flow" d="M790.0 580.0 V635.0"/><path class="flow" d="M790.0 699.0 V754.0"/><path class="main-flow" d="M718.0 796.0 H80.0 V1214.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 796.0 H1530.0 V930.0"/><path class="error-flow" d="M1530.0 930.0 H790.0 V950.0"/><path class="error-flow" d="M790.0 1018.0 V1056.0"/><path class="flow" d="M790.0 1229.0 V1272.0"/><path class="flow" d="M790.0 1340.0 V1377.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="303.3" y="307.0" text-anchor="middle"><tspan x="303.3" y="307.0">O visitante grava e envia uma pergunta por áudio.</tspan></text><rect class="node" x="1081.7" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.7" y="418.0" text-anchor="middle"><tspan x="1276.7" y="418.0">O serviço de transcrição de áudio converte o áudio</tspan><tspan x="1276.7" y="438.0">em texto.</tspan></text><rect class="node system-node" x="595.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="541.0" text-anchor="middle"><tspan x="790.0" y="541.0">O sistema processa a pergunta transcrita como uma</tspan><tspan x="790.0" y="561.0">consulta normal ao assistente.</tspan></text><rect class="node system-node" x="595.0" y="635.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="672.0" text-anchor="middle"><tspan x="790.0" y="672.0">O sistema responde em texto.</tspan></text><polygon class="node system-node decision" points="790.0,754.0 862.0,796.0 790.0,838.0 718.0,796.0"/><text class="small" x="790.0" y="801.0" text-anchor="middle"><tspan x="790.0" y="801.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="950.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="979.0" text-anchor="middle"><tspan x="790.0" y="979.0">O sistema solicita nova gravação ou entrada</tspan><tspan x="790.0" y="999.0">textual.</tspan></text><circle cx="790.0" cy="1074.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1074.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1199.0 805.0,1214.0 790.0,1229.0 775.0,1214.0"/><rect class="node system-node" x="595.0" y="1272.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1301.0" text-anchor="middle"><tspan x="790.0" y="1301.0">Resultado: Pergunta enviada por áudio é processada</tspan><tspan x="790.0" y="1321.0">e respondida em texto.</tspan></text><circle cx="790.0" cy="1395.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="1395.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="907.0"><tspan x="110" y="907.0">E1 — Áudio incompreensível</tspan></text><text class="guard" x="92" y="786.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1079.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 1490.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
