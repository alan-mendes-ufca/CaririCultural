<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580.1" height="2122.0" viewBox="0 0 1580.1 2122.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-079 — Acionar contato de transporte parceiro</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="2122.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-079</text>
  <text class="subtitle" x="70" y="75">Acionar contato de transporte parceiro · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1872.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#BBF7D0"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">VISITANTE</tspan></text><rect x="546.7" y="100" width="486.7" height="1872.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="1872.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#99F6E4"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">TRANSPORTE PARCEIRO</tspan></text>
  <rect class="alternative-band" x="88" y="914.0" width="1404.1" height="206.0" rx="18"/><rect class="exception-band" x="88" y="1384.0" width="1404.1" height="242.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 338.0 V393.0"/><path class="flow" d="M303.4 457.0 V484.5 H790.0 V512.0"/><path class="flow" d="M790.0 580.0 V635.0"/><path class="flow" d="M790.0 723.0 V778.0"/><path class="branch-bus no-arrow" d="M880.0 830.0 H1530.1 V964.0"/><path class="flow" d="M1530.1 964.0 H790.0 V984.0"/><path class="main-flow" d="M700.0 830.0 H80.0 V1190.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1072.0 H1562.1 V1190.0"/><path class="return-flow" d="M1562.1 1190.0 H805.0"/><path class="flow" d="M790.0 1205.0 V1248.0"/><path class="branch-bus no-arrow" d="M880.0 1300.0 H1530.1 V1434.0"/><path class="error-flow" d="M1530.1 1434.0 H790.0 V1454.0"/><path class="main-flow" d="M700.0 1300.0 H80.0 V1696.0 H775.0"/><path class="error-flow" d="M790.0 1542.0 V1580.0"/><path class="flow" d="M790.0 1711.0 V1754.0"/><path class="flow" d="M790.0 1842.0 V1879.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.4" y="299.0" text-anchor="middle"><tspan x="303.4" y="299.0">O visitante consulta as opções de transporte</tspan><tspan x="303.4" y="319.0">parceiro do local/evento (UC-030).</tspan></text><rect class="node" x="108.4" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="303.4" y="430.0" text-anchor="middle"><tspan x="303.4" y="430.0">O visitante escolhe uma opção elegível.</tspan></text><rect class="node system-node" x="595.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="541.0" text-anchor="middle"><tspan x="790.0" y="541.0">O sistema solicita confirmação antes de</tspan><tspan x="790.0" y="561.0">acionar o contato externo.</tspan></text><rect class="node system-node" x="595.0" y="635.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="664.0" text-anchor="middle"><tspan x="790.0" y="664.0">Confirmada a ação, o sistema abre o canal do</tspan><tspan x="790.0" y="684.0">Serviço/operador de transporte parceiro</tspan><tspan x="790.0" y="704.0">(telefone, WhatsApp ou canal equivalente).</tspan></text><polygon class="node system-node decision" points="790.0,778.0 880.0,830.0 790.0,882.0 700.0,830.0"/><text class="small" x="790.0" y="825.0" text-anchor="middle"><tspan x="790.0" y="825.0">Não há parceiro</tspan><tspan x="790.0" y="845.0">elegível?</tspan></text><rect class="node system-node" x="595.0" y="984.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1013.0" text-anchor="middle"><tspan x="790.0" y="1013.0">A extensão não é acionada e o visitante</tspan><tspan x="790.0" y="1033.0">permanece apenas com as informações gerais de</tspan><tspan x="790.0" y="1053.0">acesso e trajeto do caso base</tspan></text><polygon class="merge" points="790.0,1175.0 805.0,1190.0 790.0,1205.0 775.0,1190.0"/><polygon class="node system-node decision" points="790.0,1248.0 880.0,1300.0 790.0,1352.0 700.0,1300.0"/><text class="small" x="790.0" y="1295.0" text-anchor="middle"><tspan x="790.0" y="1295.0">Canal do parceiro</tspan><tspan x="790.0" y="1315.0">indisponível?</tspan></text><rect class="node exception-node" x="595.0" y="1454.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1483.0" text-anchor="middle"><tspan x="790.0" y="1483.0">O sistema informa a falha sem garantir</tspan><tspan x="790.0" y="1503.0">contratação ou disponibilidade e sem expor</tspan><tspan x="790.0" y="1523.0">detalhes técnicos</tspan></text><circle cx="790.0" cy="1598.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1598.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1681.0 805.0,1696.0 790.0,1711.0 775.0,1696.0"/><rect class="node system-node" x="595.0" y="1754.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1783.0" text-anchor="middle"><tspan x="790.0" y="1783.0">Resultado: Canal externo do parceiro é aberto</tspan><tspan x="790.0" y="1803.0">após confirmação do visitante, sem garantia</tspan><tspan x="790.0" y="1823.0">de contratação ou disponibilidade.</tspan></text><circle cx="790.0" cy="1897.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="1897.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1181.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="946.0" text-anchor="start"><tspan x="110.0" y="946.0">A1 — Não há parceiro elegível</tspan></text><text class="guard" x="92" y="820.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1603.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1416.0" text-anchor="start"><tspan x="110.0" y="1416.0">E1 — Canal do parceiro indisponível</tspan></text><text class="guard" x="92" y="1290.0">[fluxo principal]</text>

  <g transform="translate(430.0 1992.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
