<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2831.0" viewBox="0 0 1400 2831.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-079 — Consultar procedência do dado e abrir canal externo</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2831.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-079</text>
  <text class="subtitle" x="70" y="75">Consultar procedência do dado e abrir canal externo · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2561.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">VISITANTE</text><rect x="700.0" y="100" width="640.0" height="2561.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1031.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1493.0" width="1224.0" height="264.0" rx="18"/><rect class="exception-band" x="88" y="2011.0" width="1224.0" height="284.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V516.0"/><path class="flow" d="M1020.0 584.0 V611.5 H380.0 V639.0"/><path class="flow" d="M380.0 727.0 V754.5 H1020.0 V782.0"/><path class="flow" d="M1020.0 850.0 V905.0"/><path class="main-flow" d="M948.0 947.0 H80.0 V1309.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 947.0 H1350.0 V1081.0"/><path class="flow" d="M1350.0 1081.0 H1020.0 V1101.0"/><path class="return-flow no-arrow" d="M1020.0 1169.0 H1382.0 V1309.0"/><path class="return-flow" d="M1382.0 1309.0 H1035.0"/><path class="flow" d="M1020.0 1324.0 V1367.0"/><path class="main-flow" d="M948.0 1409.0 H80.0 V1827.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1409.0 H1350.0 V1543.0"/><path class="error-flow" d="M1350.0 1543.0 H1020.0 V1563.0"/><path class="error-flow" d="M1020.0 1631.0 V1669.0"/><path class="flow" d="M1020.0 1842.0 V1885.0"/><path class="main-flow" d="M948.0 1927.0 H80.0 V2365.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1927.0 H1350.0 V2061.0"/><path class="error-flow" d="M1350.0 2061.0 H1020.0 V2081.0"/><path class="error-flow" d="M1020.0 2169.0 V2207.0"/><path class="flow" d="M1020.0 2380.0 V2423.0"/><path class="flow" d="M1020.0 2531.0 V2568.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O caso base inclui esta consulta ao apresentar um</tspan><tspan x="380.0" y="319.0">dado sensível à atualização.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema identifica a fonte e a data da última</tspan><tspan x="1020.0" y="442.0">verificação do dado.</tspan></text><rect class="node system-node" x="825.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="545.0" text-anchor="middle"><tspan x="1020.0" y="545.0">O sistema sinaliza o estado “em revisão” quando há</tspan><tspan x="1020.0" y="565.0">apuração em curso.</tspan></text><rect class="node" x="185.0" y="639.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="668.0" text-anchor="middle"><tspan x="380.0" y="668.0">O visitante aciona um link de mapa/trajeto,</tspan><tspan x="380.0" y="688.0">telefone, WhatsApp, e-mail, site oficial, rede</tspan><tspan x="380.0" y="708.0">social oficial ou reserva/ingresso oficial.</tspan></text><rect class="node system-node" x="825.0" y="782.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="811.0" text-anchor="middle"><tspan x="1020.0" y="811.0">O sistema abre o canal externo somente após a ação</tspan><tspan x="1020.0" y="831.0">do visitante.</tspan></text><polygon class="node system-node decision" points="1020.0,905.0 1092.0,947.0 1020.0,989.0 948.0,947.0"/><text class="small" x="1020.0" y="952.0" text-anchor="middle"><tspan x="1020.0" y="952.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1101.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1130.0" text-anchor="middle"><tspan x="1020.0" y="1130.0">O sistema abre o serviço externo diretamente após</tspan><tspan x="1020.0" y="1150.0">a confirmação do visitante.</tspan></text><polygon class="merge" points="1020.0,1294.0 1035.0,1309.0 1020.0,1324.0 1005.0,1309.0"/><polygon class="node system-node decision" points="1020.0,1367.0 1092.0,1409.0 1020.0,1451.0 948.0,1409.0"/><text class="small" x="1020.0" y="1414.0" text-anchor="middle"><tspan x="1020.0" y="1414.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1563.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1592.0" text-anchor="middle"><tspan x="1020.0" y="1592.0">O sistema sinaliza a limitação sem ocultar a</tspan><tspan x="1020.0" y="1612.0">informação.</tspan></text><circle cx="1020.0" cy="1687.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1687.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1812.0 1035.0,1827.0 1020.0,1842.0 1005.0,1827.0"/><polygon class="node system-node decision" points="1020.0,1885.0 1092.0,1927.0 1020.0,1969.0 948.0,1927.0"/><text class="small" x="1020.0" y="1932.0" text-anchor="middle"><tspan x="1020.0" y="1932.0">Condição E2?</tspan></text><rect class="node exception-node" x="825.0" y="2081.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2110.0" text-anchor="middle"><tspan x="1020.0" y="2110.0">Os dados locais permanecem visíveis e o sistema</tspan><tspan x="1020.0" y="2130.0">informa que o trajeto ou link não pôde ser aberto,</tspan><tspan x="1020.0" y="2150.0">sem expor detalhes técnicos.</tspan></text><circle cx="1020.0" cy="2225.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2225.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2350.0 1035.0,2365.0 1020.0,2380.0 1005.0,2365.0"/><rect class="node system-node" x="825.0" y="2423.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1020.0" y="2452.0" text-anchor="middle"><tspan x="1020.0" y="2452.0">Resultado: Fonte, data de verificação e eventual</tspan><tspan x="1020.0" y="2472.0">estado “em revisão” ficam visíveis; canal externo</tspan><tspan x="1020.0" y="2492.0">é aberto após ação do visitante, ou o dado local</tspan><tspan x="1020.0" y="2512.0">permanece visível caso o canal falhe.</tspan></text><circle cx="1020.0" cy="2586.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2586.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1058.0"><tspan x="110" y="1058.0">A1 — Link oficial disponível</tspan></text><text class="guard" x="92" y="937.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1300.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1520.0"><tspan x="110" y="1520.0">E1 — Dado desatualizado ou ainda não verificado</tspan></text><text class="guard" x="92" y="1399.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1692.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="2038.0"><tspan x="110" y="2038.0">E2 — Serviço externo indisponível</tspan></text><text class="guard" x="92" y="1917.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2230.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2681.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
