<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="2329.0" viewBox="0 0 1580 2329.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-045 — Associar administrador a equipamento cultural</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="2329.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-045</text>
  <text class="subtitle" x="70" y="75">Associar administrador a equipamento cultural · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="2059.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">ADMIN. DA PLATAFORMA</text><rect x="546.7" y="100" width="486.7" height="2059.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="2059.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">ADMIN. DO EQUIPAMENTO</text>
  <rect class="alternative-band" x="88" y="1111.0" width="1404.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1573.0" width="1404.0" height="260.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 378.0 V405.5 H790.0 V433.0"/><path class="flow" d="M790.0 501.0 V528.5 H303.3 V556.0"/><path class="flow" d="M303.3 624.0 V651.5 H790.0 V679.0"/><path class="flow" d="M790.0 747.0 V774.5 H1276.7 V802.0"/><path class="flow" d="M1276.7 930.0 V957.5 H790.0 V985.0"/><path class="main-flow" d="M718.0 1027.0 H80.0 V1389.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1027.0 H1530.0 V1161.0"/><path class="flow" d="M1530.0 1161.0 H790.0 V1181.0"/><path class="return-flow no-arrow" d="M790.0 1249.0 H1562.0 V1389.0"/><path class="return-flow" d="M1562.0 1389.0 H805.0"/><path class="flow" d="M790.0 1404.0 V1447.0"/><path class="main-flow" d="M718.0 1489.0 H80.0 V1903.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1489.0 H1530.0 V1623.0"/><path class="error-flow" d="M1530.0 1623.0 H790.0 V1643.0"/><path class="error-flow" d="M790.0 1707.0 V1745.0"/><path class="flow" d="M790.0 1918.0 V1961.0"/><path class="flow" d="M790.0 2029.0 V2066.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="108.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">O administrador da plataforma seleciona um</tspan><tspan x="303.3" y="319.0">equipamento e uma conta administrativa; o sistema</tspan><tspan x="303.3" y="339.0">inclui UC-046 para confirmar a sessão</tspan><tspan x="303.3" y="359.0">administrativa.</tspan></text><rect class="node system-node" x="595.0" y="433.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="462.0" text-anchor="middle"><tspan x="790.0" y="462.0">O sistema verifica a existência dos dois</tspan><tspan x="790.0" y="482.0">registros.</tspan></text><rect class="node" x="108.3" y="556.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="585.0" text-anchor="middle"><tspan x="303.3" y="585.0">O administrador confirma o escopo de gestão</tspan><tspan x="303.3" y="605.0">concedido.</tspan></text><rect class="node system-node" x="595.0" y="679.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="708.0" text-anchor="middle"><tspan x="790.0" y="708.0">O sistema registra o vínculo e a operação de</tspan><tspan x="790.0" y="728.0">auditoria (RN-076).</tspan></text><rect class="node" x="1081.7" y="802.0" width="390.0" height="128.0" rx="18"/><text class="text" x="1276.7" y="831.0" text-anchor="middle"><tspan x="1276.7" y="831.0">O administrador associado passa a poder acessar</tspan><tspan x="1276.7" y="851.0">apenas as funcionalidades vinculadas ao</tspan><tspan x="1276.7" y="871.0">equipamento, desde que o vínculo já exista antes</tspan><tspan x="1276.7" y="891.0">da liberação de qualquer ação de gestão (RN-066,</tspan><tspan x="1276.7" y="911.0">RN-067).</tspan></text><polygon class="node system-node decision" points="790.0,985.0 862.0,1027.0 790.0,1069.0 718.0,1027.0"/><text class="small" x="790.0" y="1032.0" text-anchor="middle"><tspan x="790.0" y="1032.0">Condição A1?</tspan></text><rect class="node system-node" x="595.0" y="1181.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1210.0" text-anchor="middle"><tspan x="790.0" y="1210.0">O sistema apresenta o vínculo existente e evita</tspan><tspan x="790.0" y="1230.0">duplicidade.</tspan></text><polygon class="merge" points="790.0,1374.0 805.0,1389.0 790.0,1404.0 775.0,1389.0"/><polygon class="node system-node decision" points="790.0,1447.0 862.0,1489.0 790.0,1531.0 718.0,1489.0"/><text class="small" x="790.0" y="1494.0" text-anchor="middle"><tspan x="790.0" y="1494.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="1643.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="1680.0" text-anchor="middle"><tspan x="790.0" y="1680.0">O sistema não cria a associação.</tspan></text><circle cx="790.0" cy="1763.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1763.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1888.0 805.0,1903.0 790.0,1918.0 775.0,1903.0"/><rect class="node system-node" x="595.0" y="1961.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1990.0" text-anchor="middle"><tspan x="790.0" y="1990.0">Resultado: Vínculo de administração é registrado</tspan><tspan x="790.0" y="2010.0">com escopo definido e auditável.</tspan></text><circle cx="790.0" cy="2084.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2084.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1138.0"><tspan x="110" y="1138.0">A1 — A conta já está associada ao equipamento</tspan></text><text class="guard" x="92" y="1017.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1380.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1600.0"><tspan x="110" y="1600.0">E1 — Equipamento ou conta não é válido</tspan></text><text class="guard" x="92" y="1479.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1768.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 2179.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
