<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2281.0" viewBox="0 0 1400 2281.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-053 — Editar oferta</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2281.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-053</text>
  <text class="subtitle" x="70" y="75">Editar oferta · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2011.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DO ESTABELECIMENTO</text><rect x="700.0" y="100" width="640.0" height="2011.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1043.0" width="1224.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1505.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V385.5 H1020.0 V413.0"/><path class="flow" d="M1020.0 501.0 V528.5 H380.0 V556.0"/><path class="flow" d="M380.0 620.0 V647.5 H1020.0 V675.0"/><path class="flow" d="M1020.0 739.0 V794.0"/><path class="flow" d="M1020.0 862.0 V917.0"/><path class="main-flow" d="M948.0 959.0 H80.0 V1321.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 959.0 H1350.0 V1093.0"/><path class="flow" d="M1350.0 1093.0 H1020.0 V1113.0"/><path class="return-flow no-arrow" d="M1020.0 1181.0 H1382.0 V1321.0"/><path class="return-flow" d="M1382.0 1321.0 H1035.0"/><path class="flow" d="M1020.0 1336.0 V1379.0"/><path class="main-flow" d="M948.0 1421.0 H80.0 V1835.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1421.0 H1350.0 V1555.0"/><path class="error-flow" d="M1350.0 1555.0 H1020.0 V1575.0"/><path class="error-flow" d="M1020.0 1639.0 V1677.0"/><path class="flow" d="M1020.0 1850.0 V1893.0"/><path class="flow" d="M1020.0 1981.0 V2018.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador seleciona uma oferta cadastrada; o</tspan><tspan x="380.0" y="319.0">sistema inclui UC-046 para confirmar a sessão</tspan><tspan x="380.0" y="339.0">administrativa.</tspan></text><rect class="node system-node" x="825.0" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="442.0" text-anchor="middle"><tspan x="1020.0" y="442.0">O sistema verifica o escopo do administrador sobre</tspan><tspan x="1020.0" y="462.0">o estabelecimento e o vínculo da oferta com o</tspan><tspan x="1020.0" y="482.0">estabelecimento ativo (RN-066, RN-071).</tspan></text><rect class="node" x="185.0" y="556.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="593.0" text-anchor="middle"><tspan x="380.0" y="593.0">O administrador altera os dados necessários.</tspan></text><rect class="node system-node" x="825.0" y="675.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="712.0" text-anchor="middle"><tspan x="1020.0" y="712.0">O sistema valida os dados e o vínculo.</tspan></text><rect class="node system-node" x="825.0" y="794.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="823.0" text-anchor="middle"><tspan x="1020.0" y="823.0">O sistema salva a alteração e registra o histórico</tspan><tspan x="1020.0" y="843.0">da operação (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,917.0 1092.0,959.0 1020.0,1001.0 948.0,959.0"/><text class="small" x="1020.0" y="964.0" text-anchor="middle"><tspan x="1020.0" y="964.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1113.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1142.0" text-anchor="middle"><tspan x="1020.0" y="1142.0">A oferta deixa de ficar visível ao público</tspan><tspan x="1020.0" y="1162.0">(RN-072).</tspan></text><polygon class="merge" points="1020.0,1306.0 1035.0,1321.0 1020.0,1336.0 1005.0,1321.0"/><polygon class="node system-node decision" points="1020.0,1379.0 1092.0,1421.0 1020.0,1463.0 948.0,1421.0"/><text class="small" x="1020.0" y="1426.0" text-anchor="middle"><tspan x="1020.0" y="1426.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1575.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1612.0" text-anchor="middle"><tspan x="1020.0" y="1612.0">O sistema nega a alteração (RN-066).</tspan></text><circle cx="1020.0" cy="1695.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1695.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1820.0 1035.0,1835.0 1020.0,1850.0 1005.0,1835.0"/><rect class="node system-node" x="825.0" y="1893.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1922.0" text-anchor="middle"><tspan x="1020.0" y="1922.0">Resultado: Dados da oferta são atualizados; oferta</tspan><tspan x="1020.0" y="1942.0">sem vínculo válido deixa de ficar visível ao</tspan><tspan x="1020.0" y="1962.0">público.</tspan></text><circle cx="1020.0" cy="2036.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2036.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1070.0"><tspan x="110" y="1070.0">A1 — A edição invalida o vínculo com o estabelecimento ativo</tspan></text><text class="guard" x="92" y="949.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1312.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1532.0"><tspan x="110" y="1532.0">E1 — A oferta não pertence ao escopo do administrador</tspan></text><text class="guard" x="92" y="1411.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1700.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2131.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
