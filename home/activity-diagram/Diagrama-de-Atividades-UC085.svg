<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="3735.0" viewBox="0 0 1580 3735.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-085 — Votar em enquete sob as regras de ciclo de vida</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="3735.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-085</text>
  <text class="subtitle" x="70" y="75">Votar em enquete sob as regras de ciclo de vida · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="3465.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">VOTANTE ANÔNIMO</text><rect x="546.7" y="100" width="486.7" height="3465.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="3465.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">CRIADOR DA ENQUETE</text>
  <rect class="alternative-band" x="88" y="1031.0" width="1404.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1493.0" width="1404.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1955.0" width="1404.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="2417.0" width="1404.0" height="264.0" rx="18"/><rect class="exception-band" x="88" y="2935.0" width="1404.0" height="264.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 358.0 V413.0"/><path class="flow" d="M303.3 481.0 V536.0"/><path class="flow" d="M303.3 604.0 V631.5 H790.0 V659.0"/><path class="flow" d="M790.0 727.0 V782.0"/><path class="flow" d="M790.0 850.0 V905.0"/><path class="main-flow" d="M718.0 947.0 H80.0 V1309.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 947.0 H1530.0 V1081.0"/><path class="flow" d="M1530.0 1081.0 H1276.7 V1101.0"/><path class="return-flow no-arrow" d="M1276.7 1169.0 H1562.0 V1309.0"/><path class="return-flow" d="M1562.0 1309.0 H805.0"/><path class="flow" d="M790.0 1324.0 V1367.0"/><path class="main-flow" d="M718.0 1409.0 H80.0 V1771.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1409.0 H1530.0 V1543.0"/><path class="flow" d="M1530.0 1543.0 H1276.7 V1563.0"/><path class="return-flow no-arrow" d="M1276.7 1631.0 H1562.0 V1771.0"/><path class="return-flow" d="M1562.0 1771.0 H805.0"/><path class="flow" d="M790.0 1786.0 V1829.0"/><path class="main-flow" d="M718.0 1871.0 H80.0 V2233.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1871.0 H1530.0 V2005.0"/><path class="flow" d="M1530.0 2005.0 H1276.7 V2025.0"/><path class="return-flow no-arrow" d="M1276.7 2093.0 H1562.0 V2233.0"/><path class="return-flow" d="M1562.0 2233.0 H805.0"/><path class="flow" d="M790.0 2248.0 V2291.0"/><path class="main-flow" d="M718.0 2333.0 H80.0 V2751.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 2333.0 H1530.0 V2467.0"/><path class="error-flow" d="M1530.0 2467.0 H790.0 V2487.0"/><path class="error-flow" d="M790.0 2555.0 V2593.0"/><path class="flow" d="M790.0 2766.0 V2809.0"/><path class="main-flow" d="M718.0 2851.0 H80.0 V3269.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 2851.0 H1530.0 V2985.0"/><path class="error-flow" d="M1530.0 2985.0 H790.0 V3005.0"/><path class="error-flow" d="M790.0 3073.0 V3111.0"/><path class="flow" d="M790.0 3284.0 V3327.0"/><path class="flow" d="M790.0 3435.0 V3472.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">O caso UC-038 inclui este caso a partir da criação</tspan><tspan x="303.3" y="319.0">da enquete e mantém suas regras válidas durante</tspan><tspan x="303.3" y="339.0">toda a existência dela.</tspan></text><rect class="node" x="108.3" y="413.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="442.0" text-anchor="middle"><tspan x="303.3" y="442.0">O votante abre o link público e o sistema mostra</tspan><tspan x="303.3" y="462.0">as opções e a situação atual da enquete.</tspan></text><rect class="node" x="108.3" y="536.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="565.0" text-anchor="middle"><tspan x="303.3" y="565.0">O votante escolhe uma opção (ou, se permitido,</tspan><tspan x="303.3" y="585.0">múltiplas até o limite definido) e confirma.</tspan></text><rect class="node system-node" x="595.0" y="659.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="688.0" text-anchor="middle"><tspan x="790.0" y="688.0">O sistema aplica os controles antifraude sem expor</tspan><tspan x="790.0" y="708.0">a identidade do votante.</tspan></text><rect class="node system-node" x="595.0" y="782.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="811.0" text-anchor="middle"><tspan x="790.0" y="811.0">O sistema contabiliza o voto e atualiza o</tspan><tspan x="790.0" y="831.0">resultado.</tspan></text><polygon class="node system-node decision" points="790.0,905.0 862.0,947.0 790.0,989.0 718.0,947.0"/><text class="small" x="790.0" y="952.0" text-anchor="middle"><tspan x="790.0" y="952.0">Condição A1?</tspan></text><rect class="node" x="1081.7" y="1101.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.7" y="1130.0" text-anchor="middle"><tspan x="1276.7" y="1130.0">O votante seleciona até o limite entre 1 e o</tspan><tspan x="1276.7" y="1150.0">número de opções definido pelo criador.</tspan></text><polygon class="merge" points="790.0,1294.0 805.0,1309.0 790.0,1324.0 775.0,1309.0"/><polygon class="node system-node decision" points="790.0,1367.0 862.0,1409.0 790.0,1451.0 718.0,1409.0"/><text class="small" x="790.0" y="1414.0" text-anchor="middle"><tspan x="790.0" y="1414.0">Condição A2?</tspan></text><rect class="node" x="1081.7" y="1563.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.7" y="1592.0" text-anchor="middle"><tspan x="1276.7" y="1592.0">O criador altera as opções da enquete antes de</tspan><tspan x="1276.7" y="1612.0">registrado o primeiro voto.</tspan></text><polygon class="merge" points="790.0,1756.0 805.0,1771.0 790.0,1786.0 775.0,1771.0"/><polygon class="node system-node decision" points="790.0,1829.0 862.0,1871.0 790.0,1913.0 718.0,1871.0"/><text class="small" x="790.0" y="1876.0" text-anchor="middle"><tspan x="790.0" y="1876.0">Condição A3?</tspan></text><rect class="node" x="1081.7" y="2025.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.7" y="2054.0" text-anchor="middle"><tspan x="1276.7" y="2054.0">O criador encerra a enquete manualmente antes do</tspan><tspan x="1276.7" y="2074.0">prazo previsto.</tspan></text><polygon class="merge" points="790.0,2218.0 805.0,2233.0 790.0,2248.0 775.0,2233.0"/><polygon class="node system-node decision" points="790.0,2291.0 862.0,2333.0 790.0,2375.0 718.0,2333.0"/><text class="small" x="790.0" y="2338.0" text-anchor="middle"><tspan x="790.0" y="2338.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="2487.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="2516.0" text-anchor="middle"><tspan x="790.0" y="2516.0">O sistema não registra o voto e mostra apenas o</tspan><tspan x="790.0" y="2536.0">resultado disponível.</tspan></text><circle cx="790.0" cy="2611.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="2611.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,2736.0 805.0,2751.0 790.0,2766.0 775.0,2751.0"/><polygon class="node system-node decision" points="790.0,2809.0 862.0,2851.0 790.0,2893.0 718.0,2851.0"/><text class="small" x="790.0" y="2856.0" text-anchor="middle"><tspan x="790.0" y="2856.0">Condição E2?</tspan></text><rect class="node exception-node" x="595.0" y="3005.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="3034.0" text-anchor="middle"><tspan x="790.0" y="3034.0">O sistema informa ao votante que o voto não foi</tspan><tspan x="790.0" y="3054.0">aceito.</tspan></text><circle cx="790.0" cy="3129.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="3129.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,3254.0 805.0,3269.0 790.0,3284.0 775.0,3269.0"/><rect class="node system-node" x="595.0" y="3327.0" width="390.0" height="108.0" rx="18"/><text class="text" x="790.0" y="3356.0" text-anchor="middle"><tspan x="790.0" y="3356.0">Resultado: Voto é contabilizado sem exigir login</tspan><tspan x="790.0" y="3376.0">nem identificar o votante; resultado é atualizado;</tspan><tspan x="790.0" y="3396.0">a enquete respeita as regras de edição e</tspan><tspan x="790.0" y="3416.0">encerramento ao longo de todo o ciclo.</tspan></text><circle cx="790.0" cy="3490.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="3490.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1058.0"><tspan x="110" y="1058.0">A1 — Configuração permite múltipla escolha</tspan></text><text class="guard" x="92" y="937.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1300.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1520.0"><tspan x="110" y="1520.0">A2 — O criador altera as opções da enquete antes de registrado o primeiro voto.</tspan></text><text class="guard" x="92" y="1399.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1762.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1982.0"><tspan x="110" y="1982.0">A3 — O criador encerra a enquete manualmente antes do prazo previsto.</tspan></text><text class="guard" x="92" y="1861.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="2224.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2444.0"><tspan x="110" y="2444.0">E1 — Enquete encerrada</tspan></text><text class="guard" x="92" y="2323.0">[fluxo principal]</text><text class="result-label" x="818.0" y="2616.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="2962.0"><tspan x="110" y="2962.0">E2 — Controle antifraude rejeita duplicidade de voto</tspan></text><text class="guard" x="92" y="2841.0">[fluxo principal]</text><text class="result-label" x="818.0" y="3134.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 3585.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
