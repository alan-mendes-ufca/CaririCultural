<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2767.0" viewBox="0 0 1400 2767.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-042 — Cadastrar equipamento cultural</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2767.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-042</text>
  <text class="subtitle" x="70" y="75">Cadastrar equipamento cultural · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2497.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DA PLATAFORMA</text><rect x="700.0" y="100" width="640.0" height="2497.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="1067.0" width="1224.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1529.0" width="1224.0" height="204.0" rx="18"/><rect class="exception-band" x="88" y="1987.0" width="1224.0" height="264.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V413.0"/><path class="flow" d="M380.0 501.0 V528.5 H1020.0 V556.0"/><path class="flow" d="M1020.0 620.0 V675.0"/><path class="flow" d="M1020.0 743.0 V798.0"/><path class="flow" d="M1020.0 886.0 V941.0"/><path class="main-flow" d="M948.0 983.0 H80.0 V1345.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 983.0 H1350.0 V1117.0"/><path class="flow" d="M1350.0 1117.0 H1020.0 V1137.0"/><path class="return-flow no-arrow" d="M1020.0 1205.0 H1382.0 V1345.0"/><path class="return-flow" d="M1382.0 1345.0 H1035.0"/><path class="flow" d="M1020.0 1360.0 V1403.0"/><path class="main-flow" d="M948.0 1445.0 H80.0 V1803.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1445.0 H1350.0 V1579.0"/><path class="flow" d="M1350.0 1579.0 H1020.0 V1599.0"/><path class="return-flow no-arrow" d="M1020.0 1663.0 H1382.0 V1803.0"/><path class="return-flow" d="M1382.0 1803.0 H1035.0"/><path class="flow" d="M1020.0 1818.0 V1861.0"/><path class="main-flow" d="M948.0 1903.0 H80.0 V2321.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1903.0 H1350.0 V2037.0"/><path class="error-flow" d="M1350.0 2037.0 H1020.0 V2057.0"/><path class="error-flow" d="M1020.0 2125.0 V2163.0"/><path class="flow" d="M1020.0 2336.0 V2379.0"/><path class="flow" d="M1020.0 2467.0 V2504.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador da plataforma inicia o cadastro de</tspan><tspan x="380.0" y="319.0">um equipamento cultural; o sistema inclui UC-046</tspan><tspan x="380.0" y="339.0">para confirmar a sessão administrativa autorizada.</tspan></text><rect class="node" x="185.0" y="413.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="442.0" text-anchor="middle"><tspan x="380.0" y="442.0">O administrador informa identificação,</tspan><tspan x="380.0" y="462.0">localização, dados de funcionamento, responsável e</tspan><tspan x="380.0" y="482.0">demais informações exigidas para o tipo de local.</tspan></text><rect class="node system-node" x="825.0" y="556.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="593.0" text-anchor="middle"><tspan x="1020.0" y="593.0">O sistema valida os dados mínimos do cadastro.</tspan></text><rect class="node system-node" x="825.0" y="675.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="704.0" text-anchor="middle"><tspan x="1020.0" y="704.0">O sistema registra o equipamento e a operação de</tspan><tspan x="1020.0" y="724.0">auditoria (RN-076).</tspan></text><rect class="node system-node" x="825.0" y="798.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="827.0" text-anchor="middle"><tspan x="1020.0" y="827.0">O sistema disponibiliza o equipamento ou o mantém</tspan><tspan x="1020.0" y="847.0">pendente até que atenda às condições de publicação</tspan><tspan x="1020.0" y="867.0">(RN-068).</tspan></text><polygon class="node system-node decision" points="1020.0,941.0 1092.0,983.0 1020.0,1025.0 948.0,983.0"/><text class="small" x="1020.0" y="988.0" text-anchor="middle"><tspan x="1020.0" y="988.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1137.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1166.0" text-anchor="middle"><tspan x="1020.0" y="1166.0">O sistema mantém o cadastro como não publicado e</tspan><tspan x="1020.0" y="1186.0">informa os campos necessários.</tspan></text><polygon class="merge" points="1020.0,1330.0 1035.0,1345.0 1020.0,1360.0 1005.0,1345.0"/><polygon class="node system-node decision" points="1020.0,1403.0 1092.0,1445.0 1020.0,1487.0 948.0,1445.0"/><text class="small" x="1020.0" y="1450.0" text-anchor="middle"><tspan x="1020.0" y="1450.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1599.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1636.0" text-anchor="middle"><tspan x="1020.0" y="1636.0">O sistema direciona o administrador para UC-043.</tspan></text><polygon class="merge" points="1020.0,1788.0 1035.0,1803.0 1020.0,1818.0 1005.0,1803.0"/><polygon class="node system-node decision" points="1020.0,1861.0 1092.0,1903.0 1020.0,1945.0 948.0,1903.0"/><text class="small" x="1020.0" y="1908.0" text-anchor="middle"><tspan x="1020.0" y="1908.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="2057.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2086.0" text-anchor="middle"><tspan x="1020.0" y="2086.0">O sistema nega o cadastro e não cria registro</tspan><tspan x="1020.0" y="2106.0">público.</tspan></text><circle cx="1020.0" cy="2181.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2181.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2306.0 1035.0,2321.0 1020.0,2336.0 1005.0,2321.0"/><rect class="node system-node" x="825.0" y="2379.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="2408.0" text-anchor="middle"><tspan x="1020.0" y="2408.0">Resultado: Equipamento é registrado, com estado de</tspan><tspan x="1020.0" y="2428.0">publicação compatível com os dados informados e</tspan><tspan x="1020.0" y="2448.0">trilha de auditoria.</tspan></text><circle cx="1020.0" cy="2522.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2522.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1094.0"><tspan x="110" y="1094.0">A1 — Há dados mínimos pendentes</tspan></text><text class="guard" x="92" y="973.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1336.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1556.0"><tspan x="110" y="1556.0">A2 — O equipamento já possui cadastro</tspan></text><text class="guard" x="92" y="1435.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1794.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2014.0"><tspan x="110" y="2014.0">E1 — A sessão administrativa não é confirmada pelo UC-046</tspan></text><text class="guard" x="92" y="1893.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2186.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2617.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
