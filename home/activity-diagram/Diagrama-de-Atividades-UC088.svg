<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="4954.0" viewBox="0 0 1580 4954.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-088 — Sinalizar e acompanhar dado incorreto</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="4954.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-088</text>
  <text class="subtitle" x="70" y="75">Sinalizar e acompanhar dado incorreto · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="4684.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">USUÁRIO AUTENTICADO</text><rect x="546.7" y="100" width="486.7" height="4684.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="4684.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">ADMIN. DE CURADORIA</text>
  <rect class="alternative-band" x="88" y="1254.0" width="1404.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1716.0" width="1404.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="2178.0" width="1404.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="2640.0" width="1404.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="3122.0" width="1404.0" height="264.0" rx="18"/><rect class="exception-band" x="88" y="3640.0" width="1404.0" height="260.0" rx="18"/><rect class="exception-band" x="88" y="4154.0" width="1404.0" height="264.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 338.0 V393.0"/><path class="flow" d="M303.3 481.0 V508.5 H790.0 V536.0"/><path class="flow" d="M790.0 624.0 V651.5 H1276.7 V679.0"/><path class="flow" d="M1276.7 787.0 V842.0"/><path class="flow" d="M1276.7 930.0 V957.5 H790.0 V985.0"/><path class="flow" d="M790.0 1073.0 V1128.0"/><path class="main-flow" d="M718.0 1170.0 H80.0 V1532.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1170.0 H1530.0 V1304.0"/><path class="flow" d="M1530.0 1304.0 H790.0 V1324.0"/><path class="return-flow no-arrow" d="M790.0 1392.0 H1562.0 V1532.0"/><path class="return-flow" d="M1562.0 1532.0 H805.0"/><path class="flow" d="M790.0 1547.0 V1590.0"/><path class="main-flow" d="M718.0 1632.0 H80.0 V1994.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1632.0 H1530.0 V1766.0"/><path class="flow" d="M1530.0 1766.0 H790.0 V1786.0"/><path class="return-flow no-arrow" d="M790.0 1854.0 H1562.0 V1994.0"/><path class="return-flow" d="M1562.0 1994.0 H805.0"/><path class="flow" d="M790.0 2009.0 V2052.0"/><path class="main-flow" d="M718.0 2094.0 H80.0 V2456.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 2094.0 H1530.0 V2228.0"/><path class="flow" d="M1530.0 2228.0 H1276.7 V2248.0"/><path class="return-flow no-arrow" d="M1276.7 2316.0 H1562.0 V2456.0"/><path class="return-flow" d="M1562.0 2456.0 H805.0"/><path class="flow" d="M790.0 2471.0 V2514.0"/><path class="main-flow" d="M718.0 2556.0 H80.0 V2938.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 2556.0 H1530.0 V2690.0"/><path class="flow" d="M1530.0 2690.0 H790.0 V2710.0"/><path class="return-flow no-arrow" d="M790.0 2798.0 H1562.0 V2938.0"/><path class="return-flow" d="M1562.0 2938.0 H805.0"/><path class="flow" d="M790.0 2953.0 V2996.0"/><path class="main-flow" d="M718.0 3038.0 H80.0 V3456.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 3038.0 H1530.0 V3172.0"/><path class="error-flow" d="M1530.0 3172.0 H790.0 V3192.0"/><path class="error-flow" d="M790.0 3260.0 V3298.0"/><path class="flow" d="M790.0 3471.0 V3514.0"/><path class="main-flow" d="M718.0 3556.0 H80.0 V3970.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 3556.0 H1530.0 V3690.0"/><path class="error-flow" d="M1530.0 3690.0 H790.0 V3710.0"/><path class="error-flow" d="M790.0 3774.0 V3812.0"/><path class="flow" d="M790.0 3985.0 V4028.0"/><path class="main-flow" d="M718.0 4070.0 H80.0 V4488.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 4070.0 H1530.0 V4204.0"/><path class="error-flow" d="M1530.0 4204.0 H790.0 V4224.0"/><path class="error-flow" d="M790.0 4292.0 V4330.0"/><path class="flow" d="M790.0 4503.0 V4546.0"/><path class="flow" d="M790.0 4654.0 V4691.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">O usuário aciona “Sinalizar dado incorreto” no</tspan><tspan x="303.3" y="319.0">local, evento, equipamento cultural ou atração.</tspan></text><rect class="node" x="108.3" y="393.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.3" y="422.0" text-anchor="middle"><tspan x="303.3" y="422.0">Seleciona o campo afetado, informa o valor</tspan><tspan x="303.3" y="442.0">observado, data da constatação e, opcionalmente,</tspan><tspan x="303.3" y="462.0">anexa evidência.</tspan></text><rect class="node system-node" x="595.0" y="536.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="565.0" text-anchor="middle"><tspan x="790.0" y="565.0">O sistema valida o envio, preserva uma cópia do</tspan><tspan x="790.0" y="585.0">valor publicado e cria um protocolo com estado</tspan><tspan x="790.0" y="605.0">“pendente”.</tspan></text><rect class="node" x="1081.7" y="679.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1276.7" y="708.0" text-anchor="middle"><tspan x="1276.7" y="708.0">O administrador em função de curadoria compara a</tspan><tspan x="1276.7" y="728.0">sinalização com fonte verificável e, quando</tspan><tspan x="1276.7" y="748.0">necessário, solicita confirmação ao responsável</tspan><tspan x="1276.7" y="768.0">pelo local.</tspan></text><rect class="node" x="1081.7" y="842.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1276.7" y="871.0" text-anchor="middle"><tspan x="1276.7" y="871.0">Confirmada a inconsistência, o administrador</tspan><tspan x="1276.7" y="891.0">corrige ou invalida o campo e registra fonte,</tspan><tspan x="1276.7" y="911.0">data, responsável e justificativa da decisão.</tspan></text><rect class="node system-node" x="595.0" y="985.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1014.0" text-anchor="middle"><tspan x="790.0" y="1014.0">O sistema atualiza a data de verificação, encerra</tspan><tspan x="790.0" y="1034.0">o protocolo e comunica o resultado ao usuário que</tspan><tspan x="790.0" y="1054.0">sinalizou.</tspan></text><polygon class="node system-node decision" points="790.0,1128.0 862.0,1170.0 790.0,1212.0 718.0,1170.0"/><text class="small" x="790.0" y="1175.0" text-anchor="middle"><tspan x="790.0" y="1175.0">Condição A1?</tspan></text><rect class="node system-node" x="595.0" y="1324.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1353.0" text-anchor="middle"><tspan x="790.0" y="1353.0">O sistema associa o novo relato ao protocolo</tspan><tspan x="790.0" y="1373.0">existente, preservando autoria e evidências.</tspan></text><polygon class="merge" points="790.0,1517.0 805.0,1532.0 790.0,1547.0 775.0,1532.0"/><polygon class="node system-node decision" points="790.0,1590.0 862.0,1632.0 790.0,1674.0 718.0,1632.0"/><text class="small" x="790.0" y="1637.0" text-anchor="middle"><tspan x="790.0" y="1637.0">Condição A2?</tspan></text><rect class="node system-node" x="595.0" y="1786.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1815.0" text-anchor="middle"><tspan x="790.0" y="1815.0">O campo permanece “em revisão” sem substituir</tspan><tspan x="790.0" y="1835.0">automaticamente o dado oficial.</tspan></text><polygon class="merge" points="790.0,1979.0 805.0,1994.0 790.0,2009.0 775.0,1994.0"/><polygon class="node system-node decision" points="790.0,2052.0 862.0,2094.0 790.0,2136.0 718.0,2094.0"/><text class="small" x="790.0" y="2099.0" text-anchor="middle"><tspan x="790.0" y="2099.0">Condição A3?</tspan></text><rect class="node" x="1081.7" y="2248.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1276.7" y="2277.0" text-anchor="middle"><tspan x="1276.7" y="2277.0">O administrador mantém o valor, registra a</tspan><tspan x="1276.7" y="2297.0">justificativa e comunica o encerramento.</tspan></text><polygon class="merge" points="790.0,2441.0 805.0,2456.0 790.0,2471.0 775.0,2456.0"/><polygon class="node system-node decision" points="790.0,2514.0 862.0,2556.0 790.0,2598.0 718.0,2556.0"/><text class="small" x="790.0" y="2561.0" text-anchor="middle"><tspan x="790.0" y="2561.0">Condição A4?</tspan></text><rect class="node system-node" x="595.0" y="2710.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="2739.0" text-anchor="middle"><tspan x="790.0" y="2739.0">Aciona-se a extensão UC-081, que preserva o</tspan><tspan x="790.0" y="2759.0">conteúdo preenchido e retoma o envio após a</tspan><tspan x="790.0" y="2779.0">autenticação.</tspan></text><polygon class="merge" points="790.0,2923.0 805.0,2938.0 790.0,2953.0 775.0,2938.0"/><polygon class="node system-node decision" points="790.0,2996.0 862.0,3038.0 790.0,3080.0 718.0,3038.0"/><text class="small" x="790.0" y="3043.0" text-anchor="middle"><tspan x="790.0" y="3043.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="3192.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="3221.0" text-anchor="middle"><tspan x="790.0" y="3221.0">O arquivo é bloqueado e a sinalização textual pode</tspan><tspan x="790.0" y="3241.0">continuar se contiver dados suficientes.</tspan></text><circle cx="790.0" cy="3316.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="3316.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,3441.0 805.0,3456.0 790.0,3471.0 775.0,3456.0"/><polygon class="node system-node decision" points="790.0,3514.0 862.0,3556.0 790.0,3598.0 718.0,3556.0"/><text class="small" x="790.0" y="3561.0" text-anchor="middle"><tspan x="790.0" y="3561.0">Condição E2?</tspan></text><rect class="node exception-node" x="595.0" y="3710.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="3747.0" text-anchor="middle"><tspan x="790.0" y="3747.0">O sistema o oculta preventivamente.</tspan></text><circle cx="790.0" cy="3830.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="3830.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,3955.0 805.0,3970.0 790.0,3985.0 775.0,3970.0"/><polygon class="node system-node decision" points="790.0,4028.0 862.0,4070.0 790.0,4112.0 718.0,4070.0"/><text class="small" x="790.0" y="4075.0" text-anchor="middle"><tspan x="790.0" y="4075.0">Condição E3?</tspan></text><rect class="node exception-node" x="595.0" y="4224.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="4253.0" text-anchor="middle"><tspan x="790.0" y="4253.0">Nenhum cadastro é alterado e o sistema orienta</tspan><tspan x="790.0" y="4273.0">nova tentativa.</tspan></text><circle cx="790.0" cy="4348.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="4348.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,4473.0 805.0,4488.0 790.0,4503.0 775.0,4488.0"/><rect class="node system-node" x="595.0" y="4546.0" width="390.0" height="108.0" rx="18"/><text class="text" x="790.0" y="4575.0" text-anchor="middle"><tspan x="790.0" y="4575.0">Resultado: Sinalização possui protocolo e estado</tspan><tspan x="790.0" y="4595.0">rastreável; após análise, o dado é corrigido,</tspan><tspan x="790.0" y="4615.0">mantido com justificativa ou marcado como não</tspan><tspan x="790.0" y="4635.0">verificável; o autor recebe o resultado.</tspan></text><circle cx="790.0" cy="4709.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="4709.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1281.0"><tspan x="110" y="1281.0">A1 — Já existe sinalização equivalente pendente</tspan></text><text class="guard" x="92" y="1160.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1523.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1743.0"><tspan x="110" y="1743.0">A2 — A apuração ainda não terminou</tspan></text><text class="guard" x="92" y="1622.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1985.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2205.0"><tspan x="110" y="2205.0">A3 — A sinalização não procede</tspan></text><text class="guard" x="92" y="2084.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="2447.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="2667.0"><tspan x="110" y="2667.0">A4 — O usuário inicia a sinalização sem estar autenticado</tspan></text><text class="guard" x="92" y="2546.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="2929.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="3149.0"><tspan x="110" y="3149.0">E1 — Evidência inválida ou maliciosa</tspan></text><text class="guard" x="92" y="3028.0">[fluxo principal]</text><text class="result-label" x="818.0" y="3321.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="3667.0"><tspan x="110" y="3667.0">E2 — Campo crítico não pode ser verificado e pode causar risco imediato</tspan></text><text class="guard" x="92" y="3546.0">[fluxo principal]</text><text class="result-label" x="818.0" y="3835.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110" y="4181.0"><tspan x="110" y="4181.0">E3 — Falha ao registrar o protocolo</tspan></text><text class="guard" x="92" y="4060.0">[fluxo principal]</text><text class="result-label" x="818.0" y="4353.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 4804.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
