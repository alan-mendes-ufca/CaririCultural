<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="2249.0" viewBox="0 0 1580 2249.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-026 — Gerar roteiro personalizado</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="2249.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-026</text>
  <text class="subtitle" x="70" y="75">Gerar roteiro personalizado · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1979.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">USUÁRIO AUTENTICADO</text><rect x="546.7" y="100" width="486.7" height="1979.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="1979.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">MAPAS / TRANSPORTES</text>
  <rect class="alternative-band" x="88" y="1007.0" width="1404.0" height="208.0" rx="18"/><rect class="exception-band" x="88" y="1469.0" width="1404.0" height="264.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 338.0 V365.5 H790.0 V393.0"/><path class="flow" d="M790.0 461.0 V516.0"/><path class="flow" d="M790.0 584.0 V639.0"/><path class="flow" d="M790.0 703.0 V758.0"/><path class="flow" d="M790.0 826.0 V881.0"/><path class="main-flow" d="M718.0 923.0 H80.0 V1285.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 923.0 H1530.0 V1057.0"/><path class="flow" d="M1530.0 1057.0 H790.0 V1077.0"/><path class="return-flow no-arrow" d="M790.0 1145.0 H1562.0 V1285.0"/><path class="return-flow" d="M1562.0 1285.0 H805.0"/><path class="flow" d="M790.0 1300.0 V1343.0"/><path class="main-flow" d="M718.0 1385.0 H80.0 V1803.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1385.0 H1530.0 V1519.0"/><path class="error-flow" d="M1530.0 1519.0 H790.0 V1539.0"/><path class="error-flow" d="M790.0 1607.0 V1645.0"/><path class="flow" d="M790.0 1818.0 V1861.0"/><path class="flow" d="M790.0 1949.0 V1986.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">O usuário informa interesses, período, origem e</tspan><tspan x="303.3" y="319.0">perfil do público.</tspan></text><rect class="node system-node" x="595.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="422.0" text-anchor="middle"><tspan x="790.0" y="422.0">O sistema seleciona locais públicos com dados</tspan><tspan x="790.0" y="442.0">mínimos completos.</tspan></text><rect class="node system-node" x="595.0" y="516.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="545.0" text-anchor="middle"><tspan x="790.0" y="545.0">O sistema considera distância, horários e status,</tspan><tspan x="790.0" y="565.0">apoiado pelo serviço de mapas e transportes.</tspan></text><rect class="node system-node" x="595.0" y="639.0" width="390.0" height="64.0" rx="18"/><text class="text" x="790.0" y="676.0" text-anchor="middle"><tspan x="790.0" y="676.0">O sistema gera uma sequência de passeio ordenada.</tspan></text><rect class="node system-node" x="595.0" y="758.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="787.0" text-anchor="middle"><tspan x="790.0" y="787.0">O sistema inclui o UC-083 para persistir o roteiro</tspan><tspan x="790.0" y="807.0">e permitir seu ajuste posterior pelo usuário.</tspan></text><polygon class="node system-node decision" points="790.0,881.0 862.0,923.0 790.0,965.0 718.0,923.0"/><text class="small" x="790.0" y="928.0" text-anchor="middle"><tspan x="790.0" y="928.0">Condição A1?</tspan></text><rect class="node system-node" x="595.0" y="1077.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1106.0" text-anchor="middle"><tspan x="790.0" y="1106.0">O sistema mantém o roteiro com distâncias</tspan><tspan x="790.0" y="1126.0">estimadas e sinaliza a limitação.</tspan></text><polygon class="merge" points="790.0,1270.0 805.0,1285.0 790.0,1300.0 775.0,1285.0"/><polygon class="node system-node decision" points="790.0,1343.0 862.0,1385.0 790.0,1427.0 718.0,1385.0"/><text class="small" x="790.0" y="1390.0" text-anchor="middle"><tspan x="790.0" y="1390.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="1539.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1568.0" text-anchor="middle"><tspan x="790.0" y="1568.0">O sistema explica as restrições identificadas e</tspan><tspan x="790.0" y="1588.0">sugere flexibilizações antes de acionar o UC-083.</tspan></text><circle cx="790.0" cy="1663.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1663.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1788.0 805.0,1803.0 790.0,1818.0 775.0,1803.0"/><rect class="node system-node" x="595.0" y="1861.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1890.0" text-anchor="middle"><tspan x="790.0" y="1890.0">Resultado: Roteiro é exibido e, por inclusão do</tspan><tspan x="790.0" y="1910.0">UC-083, persistido para permitir ajustes</tspan><tspan x="790.0" y="1930.0">posteriores.</tspan></text><circle cx="790.0" cy="2004.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2004.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="1034.0"><tspan x="110" y="1034.0">A1 — O serviço de mapas e transportes não retorna dados de deslocamento para um trecho</tspan></text><text class="guard" x="92" y="913.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1276.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1496.0"><tspan x="110" y="1496.0">E1 — Não há combinação viável de locais para os critérios informados</tspan></text><text class="guard" x="92" y="1375.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1668.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 2099.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
