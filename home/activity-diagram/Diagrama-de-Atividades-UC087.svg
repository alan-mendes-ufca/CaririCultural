<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="2166.0" viewBox="0 0 1580 2166.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-087 — Acionar contato de transporte parceiro</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580" height="2166.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-087</text>
  <text class="subtitle" x="70" y="75">Acionar contato de transporte parceiro · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1896.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="303.3" y="132">VISITANTE</text><rect x="546.7" y="100" width="486.7" height="1896.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.3 Q1033.3 100 1033.3 110 V150 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#2563eb"/><text class="lane-title" x="790.0" y="132">SISTEMA</text><rect x="1033.3" y="100" width="486.7" height="1896.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.3 100 H1510.0 Q1520.0 100 1520.0 110 V150 H1033.3 V110 Q1033.3 100 1043.3 100 Z" fill="#475569"/><text class="lane-title" x="1276.7" y="132">PARCEIRO DE TRANSPORTE</text>
  <rect class="alternative-band" x="88" y="904.0" width="1404.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="1386.0" width="1404.0" height="264.0" rx="18"/>
  <path class="flow" d="M303.3 197.0 V270.0"/><path class="flow" d="M303.3 338.0 V393.0"/><path class="flow" d="M303.3 457.0 V484.5 H790.0 V512.0"/><path class="flow" d="M790.0 580.0 V607.5 H303.3 V635.0"/><path class="flow" d="M303.3 723.0 V750.5 H790.0 V778.0"/><path class="main-flow" d="M718.0 820.0 H80.0 V1202.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 820.0 H1530.0 V954.0"/><path class="flow" d="M1530.0 954.0 H790.0 V974.0"/><path class="return-flow no-arrow" d="M790.0 1062.0 H1562.0 V1202.0"/><path class="return-flow" d="M1562.0 1202.0 H805.0"/><path class="flow" d="M790.0 1217.0 V1260.0"/><path class="main-flow" d="M718.0 1302.0 H80.0 V1720.0 H775.0"/><path class="branch-bus no-arrow" d="M862.0 1302.0 H1530.0 V1436.0"/><path class="error-flow" d="M1530.0 1436.0 H790.0 V1456.0"/><path class="error-flow" d="M790.0 1524.0 V1562.0"/><path class="flow" d="M790.0 1735.0 V1778.0"/><path class="flow" d="M790.0 1866.0 V1903.0"/>
  <circle cx="303.3" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.3" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.3" y="299.0" text-anchor="middle"><tspan x="303.3" y="299.0">O visitante consulta as opções de transporte</tspan><tspan x="303.3" y="319.0">parceiro do local/evento (UC-039).</tspan></text><rect class="node" x="108.3" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="303.3" y="430.0" text-anchor="middle"><tspan x="303.3" y="430.0">O visitante escolhe uma opção elegível.</tspan></text><rect class="node system-node" x="595.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="541.0" text-anchor="middle"><tspan x="790.0" y="541.0">O sistema solicita confirmação antes de acionar o</tspan><tspan x="790.0" y="561.0">contato externo.</tspan></text><rect class="node" x="108.3" y="635.0" width="390.0" height="88.0" rx="18"/><text class="text" x="303.3" y="664.0" text-anchor="middle"><tspan x="303.3" y="664.0">Confirmada a ação, o sistema abre o canal do</tspan><tspan x="303.3" y="684.0">Serviço/operador de transporte parceiro (telefone,</tspan><tspan x="303.3" y="704.0">WhatsApp ou canal equivalente).</tspan></text><polygon class="node system-node decision" points="790.0,778.0 862.0,820.0 790.0,862.0 718.0,820.0"/><text class="small" x="790.0" y="825.0" text-anchor="middle"><tspan x="790.0" y="825.0">Condição A1?</tspan></text><rect class="node system-node" x="595.0" y="974.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1003.0" text-anchor="middle"><tspan x="790.0" y="1003.0">A extensão não é acionada e o visitante permanece</tspan><tspan x="790.0" y="1023.0">apenas com as informações gerais de acesso e</tspan><tspan x="790.0" y="1043.0">trajeto do caso base.</tspan></text><polygon class="merge" points="790.0,1187.0 805.0,1202.0 790.0,1217.0 775.0,1202.0"/><polygon class="node system-node decision" points="790.0,1260.0 862.0,1302.0 790.0,1344.0 718.0,1302.0"/><text class="small" x="790.0" y="1307.0" text-anchor="middle"><tspan x="790.0" y="1307.0">Condição E1?</tspan></text><rect class="node exception-node" x="595.0" y="1456.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1485.0" text-anchor="middle"><tspan x="790.0" y="1485.0">O sistema informa a falha sem garantir contratação</tspan><tspan x="790.0" y="1505.0">ou disponibilidade e sem expor detalhes técnicos.</tspan></text><circle cx="790.0" cy="1580.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1580.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1705.0 805.0,1720.0 790.0,1735.0 775.0,1720.0"/><rect class="node system-node" x="595.0" y="1778.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1807.0" text-anchor="middle"><tspan x="790.0" y="1807.0">Resultado: Canal externo do parceiro é aberto após</tspan><tspan x="790.0" y="1827.0">confirmação do visitante, sem garantia de</tspan><tspan x="790.0" y="1847.0">contratação ou disponibilidade.</tspan></text><circle cx="790.0" cy="1921.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="1921.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="931.0"><tspan x="110" y="931.0">A1 — Não há parceiro elegível</tspan></text><text class="guard" x="92" y="810.0">[fluxo principal]</text><text class="result-label" x="1542.0" y="1193.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1413.0"><tspan x="110" y="1413.0">E1 — Canal do parceiro indisponível</tspan></text><text class="guard" x="92" y="1292.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1585.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(430.0 2016.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
