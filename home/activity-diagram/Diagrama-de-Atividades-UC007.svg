<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2118.0" viewBox="0 0 1400 2118.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-007 — Consultar horários e status de funcionamento</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2118.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-007</text>
  <text class="subtitle" x="70" y="75">Consultar horários e status de funcionamento · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1848.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">VISITANTE</text><rect x="700.0" y="100" width="640.0" height="1848.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="884.0" width="1224.0" height="204.0" rx="18"/><rect class="exception-band" x="88" y="1342.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 334.0 V361.5 H1020.0 V389.0"/><path class="flow" d="M1020.0 457.0 V512.0"/><path class="flow" d="M1020.0 580.0 V607.5 H380.0 V635.0"/><path class="flow" d="M380.0 703.0 V730.5 H1020.0 V758.0"/><path class="main-flow" d="M948.0 800.0 H80.0 V1158.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 800.0 H1350.0 V934.0"/><path class="flow" d="M1350.0 934.0 H1020.0 V954.0"/><path class="return-flow no-arrow" d="M1020.0 1018.0 H1382.0 V1158.0"/><path class="return-flow" d="M1382.0 1158.0 H1035.0"/><path class="flow" d="M1020.0 1173.0 V1216.0"/><path class="main-flow" d="M948.0 1258.0 H80.0 V1672.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1258.0 H1350.0 V1392.0"/><path class="error-flow" d="M1350.0 1392.0 H1020.0 V1412.0"/><path class="error-flow" d="M1020.0 1476.0 V1514.0"/><path class="flow" d="M1020.0 1687.0 V1730.0"/><path class="flow" d="M1020.0 1818.0 V1855.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="307.0" text-anchor="middle"><tspan x="380.0" y="307.0">O visitante abre a página de um local.</tspan></text><rect class="node system-node" x="825.0" y="389.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="418.0" text-anchor="middle"><tspan x="1020.0" y="418.0">O sistema apresenta os horários de funcionamento e</tspan><tspan x="1020.0" y="438.0">o status atual (aberto/fechado).</tspan></text><rect class="node system-node" x="825.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="541.0" text-anchor="middle"><tspan x="1020.0" y="541.0">O sistema executa UC-079 para identificar a fonte</tspan><tspan x="1020.0" y="561.0">e a data da última verificação.</tspan></text><rect class="node" x="185.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="664.0" text-anchor="middle"><tspan x="380.0" y="664.0">O visitante consulta as informações antes de</tspan><tspan x="380.0" y="684.0">decidir a visita.</tspan></text><polygon class="node system-node decision" points="1020.0,758.0 1092.0,800.0 1020.0,842.0 948.0,800.0"/><text class="small" x="1020.0" y="805.0" text-anchor="middle"><tspan x="1020.0" y="805.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="954.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="991.0" text-anchor="middle"><tspan x="1020.0" y="991.0">O status usa a programação excepcional cadastrada.</tspan></text><polygon class="merge" points="1020.0,1143.0 1035.0,1158.0 1020.0,1173.0 1005.0,1158.0"/><polygon class="node system-node decision" points="1020.0,1216.0 1092.0,1258.0 1020.0,1300.0 948.0,1258.0"/><text class="small" x="1020.0" y="1263.0" text-anchor="middle"><tspan x="1020.0" y="1263.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1412.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1449.0" text-anchor="middle"><tspan x="1020.0" y="1449.0">O sistema sinaliza a limitação.</tspan></text><circle cx="1020.0" cy="1532.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1532.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1657.0 1035.0,1672.0 1020.0,1687.0 1005.0,1672.0"/><rect class="node system-node" x="825.0" y="1730.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1759.0" text-anchor="middle"><tspan x="1020.0" y="1759.0">Resultado: Horário e status de funcionamento são</tspan><tspan x="1020.0" y="1779.0">exibidos, com fonte e data de verificação quando</tspan><tspan x="1020.0" y="1799.0">aplicável.</tspan></text><circle cx="1020.0" cy="1873.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1873.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="911.0"><tspan x="110" y="911.0">A1 — Feriado ou horário especial</tspan></text><text class="guard" x="92" y="790.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1149.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1369.0"><tspan x="110" y="1369.0">E1 — Dado desatualizado ou não verificado</tspan></text><text class="guard" x="92" y="1248.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1537.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 1968.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
