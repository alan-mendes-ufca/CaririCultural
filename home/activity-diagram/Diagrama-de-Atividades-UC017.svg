<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580.1" height="2249.0" viewBox="0 0 1580.1 2249.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-017 — Gerar roteiro personalizado</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1580.1" height="2249.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-017</text>
  <text class="subtitle" x="70" y="75">Gerar roteiro personalizado · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="486.7" height="1999.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H536.7 Q546.7 100 546.7 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="303.4" y="133.0" text-anchor="middle"><tspan x="303.4" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="546.7" y="100" width="486.7" height="1999.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M556.7 100 H1023.4 Q1033.4 100 1033.4 110 V155 H546.7 V110 Q546.7 100 556.7 100 Z" fill="#BFDBFE"/><text class="lane-title" x="790.0" y="133.0" text-anchor="middle"><tspan x="790.0" y="133.0">SISTEMA</tspan></text><rect x="1033.4" y="100" width="486.7" height="1999.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M1043.4 100 H1510.1 Q1520.1 100 1520.1 110 V155 H1033.4 V110 Q1033.4 100 1043.4 100 Z" fill="#E5E7EB"/><text class="lane-title" x="1276.8" y="133.0" text-anchor="middle"><tspan x="1276.8" y="133.0">SERVIÇO DE MAPAS E TRANSPORTES</tspan></text>
  <rect class="alternative-band" x="88" y="1061.0" width="1404.1" height="186.0" rx="18"/><rect class="exception-band" x="88" y="1511.0" width="1404.1" height="242.0" rx="18"/>
  <path class="flow" d="M303.4 197.0 V270.0"/><path class="flow" d="M303.4 338.0 V365.5 H790.0 V393.0"/><path class="flow" d="M790.0 461.0 V516.0"/><path class="flow" d="M790.0 604.0 V659.0"/><path class="flow" d="M790.0 727.0 V782.0"/><path class="flow" d="M790.0 870.0 V925.0"/><path class="branch-bus no-arrow" d="M880.0 977.0 H1530.1 V1111.0"/><path class="flow" d="M1530.1 1111.0 H790.0 V1131.0"/><path class="main-flow" d="M700.0 977.0 H80.0 V1317.0 H775.0"/><path class="return-flow no-arrow" d="M790.0 1199.0 H1562.1 V1317.0"/><path class="return-flow" d="M1562.1 1317.0 H805.0"/><path class="flow" d="M790.0 1332.0 V1375.0"/><path class="branch-bus no-arrow" d="M880.0 1427.0 H1530.1 V1561.0"/><path class="error-flow" d="M1530.1 1561.0 H790.0 V1581.0"/><path class="main-flow" d="M700.0 1427.0 H80.0 V1823.0 H775.0"/><path class="error-flow" d="M790.0 1669.0 V1707.0"/><path class="flow" d="M790.0 1838.0 V1881.0"/><path class="flow" d="M790.0 1969.0 V2006.0"/>
  <circle cx="303.4" cy="185" r="12" fill="#0f172a"/><rect class="node" x="108.4" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="303.4" y="299.0" text-anchor="middle"><tspan x="303.4" y="299.0">O usuário informa interesses, período, origem</tspan><tspan x="303.4" y="319.0">e perfil do público.</tspan></text><rect class="node system-node" x="595.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="422.0" text-anchor="middle"><tspan x="790.0" y="422.0">O sistema seleciona locais públicos com dados</tspan><tspan x="790.0" y="442.0">mínimos completos.</tspan></text><rect class="node system-node" x="595.0" y="516.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="545.0" text-anchor="middle"><tspan x="790.0" y="545.0">O sistema considera distância, horários e</tspan><tspan x="790.0" y="565.0">status, apoiado pelo serviço de mapas e</tspan><tspan x="790.0" y="585.0">transportes.</tspan></text><rect class="node system-node" x="595.0" y="659.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="688.0" text-anchor="middle"><tspan x="790.0" y="688.0">O sistema gera uma sequência de passeio</tspan><tspan x="790.0" y="708.0">ordenada.</tspan></text><rect class="node system-node" x="595.0" y="782.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="811.0" text-anchor="middle"><tspan x="790.0" y="811.0">O sistema inclui o UC-075 para persistir o</tspan><tspan x="790.0" y="831.0">roteiro e permitir seu ajuste posterior pelo</tspan><tspan x="790.0" y="851.0">usuário.</tspan></text><polygon class="node system-node decision" points="790.0,925.0 880.0,977.0 790.0,1029.0 700.0,977.0"/><text class="small" x="790.0" y="952.0" text-anchor="middle"><tspan x="790.0" y="952.0">O serviço de mapas e</tspan><tspan x="790.0" y="972.0">transportes não</tspan><tspan x="790.0" y="992.0">retorna dados de</tspan><tspan x="790.0" y="1012.0">deslocamento para um</tspan></text><rect class="node system-node" x="595.0" y="1131.0" width="390.0" height="68.0" rx="18"/><text class="text" x="790.0" y="1160.0" text-anchor="middle"><tspan x="790.0" y="1160.0">O sistema mantém o roteiro com distâncias</tspan><tspan x="790.0" y="1180.0">estimadas e sinaliza a limitação</tspan></text><polygon class="merge" points="790.0,1302.0 805.0,1317.0 790.0,1332.0 775.0,1317.0"/><polygon class="node system-node decision" points="790.0,1375.0 880.0,1427.0 790.0,1479.0 700.0,1427.0"/><text class="small" x="790.0" y="1402.0" text-anchor="middle"><tspan x="790.0" y="1402.0">Não há combinação</tspan><tspan x="790.0" y="1422.0">viável de locais para</tspan><tspan x="790.0" y="1442.0">os critérios</tspan><tspan x="790.0" y="1462.0">informados?</tspan></text><rect class="node exception-node" x="595.0" y="1581.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1610.0" text-anchor="middle"><tspan x="790.0" y="1610.0">O sistema explica as restrições identificadas</tspan><tspan x="790.0" y="1630.0">e sugere flexibilizações antes de acionar o</tspan><tspan x="790.0" y="1650.0">UC-075</tspan></text><circle cx="790.0" cy="1725.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="790.0" cy="1725.0" r="10" fill="#c2410c"/><polygon class="merge" points="790.0,1808.0 805.0,1823.0 790.0,1838.0 775.0,1823.0"/><rect class="node system-node" x="595.0" y="1881.0" width="390.0" height="88.0" rx="18"/><text class="text" x="790.0" y="1910.0" text-anchor="middle"><tspan x="790.0" y="1910.0">Resultado: Roteiro é exibido e, por inclusão</tspan><tspan x="790.0" y="1930.0">do UC-075, persistido para permitir ajustes</tspan><tspan x="790.0" y="1950.0">posteriores.</tspan></text><circle cx="790.0" cy="2024.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="790.0" cy="2024.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1542.1" y="1308.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1093.0" text-anchor="start"><tspan x="110.0" y="1093.0">A1 — O serviço de mapas e transportes não retorna dados de deslocamento para um trecho</tspan></text><text class="guard" x="92" y="967.0">[fluxo principal]</text><text class="result-label" x="818.0" y="1730.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="1543.0" text-anchor="start"><tspan x="110.0" y="1543.0">E1 — Não há combinação viável de locais para os critérios informados</tspan></text><text class="guard" x="92" y="1417.0">[fluxo principal]</text>

  <g transform="translate(430.0 2119.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
