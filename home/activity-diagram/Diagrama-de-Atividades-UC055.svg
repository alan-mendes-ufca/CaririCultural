<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2186.0" viewBox="0 0 1400 2186.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-055 — Cadastrar publicação</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2186.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-055</text>
  <text class="subtitle" x="70" y="75">Cadastrar publicação · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="1916.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">ADMIN. DA PLATAFORMA</text><rect x="700.0" y="100" width="640.0" height="1916.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="928.0" width="1224.0" height="228.0" rx="18"/><rect class="exception-band" x="88" y="1410.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 358.0 V413.0"/><path class="flow" d="M380.0 481.0 V508.5 H1020.0 V536.0"/><path class="flow" d="M1020.0 604.0 V659.0"/><path class="flow" d="M1020.0 747.0 V802.0"/><path class="main-flow" d="M948.0 844.0 H80.0 V1226.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 844.0 H1350.0 V978.0"/><path class="flow" d="M1350.0 978.0 H380.0 V998.0"/><path class="return-flow no-arrow" d="M380.0 1086.0 H1382.0 V1226.0"/><path class="return-flow" d="M1382.0 1226.0 H1035.0"/><path class="flow" d="M1020.0 1241.0 V1284.0"/><path class="main-flow" d="M948.0 1326.0 H80.0 V1740.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1326.0 H1350.0 V1460.0"/><path class="error-flow" d="M1350.0 1460.0 H1020.0 V1480.0"/><path class="error-flow" d="M1020.0 1544.0 V1582.0"/><path class="flow" d="M1020.0 1755.0 V1798.0"/><path class="flow" d="M1020.0 1886.0 V1923.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O administrador da plataforma inicia a criação de</tspan><tspan x="380.0" y="319.0">uma publicação; o sistema inclui UC-046 para</tspan><tspan x="380.0" y="339.0">confirmar a sessão administrativa.</tspan></text><rect class="node" x="185.0" y="413.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="442.0" text-anchor="middle"><tspan x="380.0" y="442.0">O administrador informa título, conteúdo e</tspan><tspan x="380.0" y="462.0">responsável pela publicação (RN-070).</tspan></text><rect class="node system-node" x="825.0" y="536.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="565.0" text-anchor="middle"><tspan x="1020.0" y="565.0">O sistema valida os dados mínimos da publicação</tspan><tspan x="1020.0" y="585.0">(RN-068).</tspan></text><rect class="node system-node" x="825.0" y="659.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="688.0" text-anchor="middle"><tspan x="1020.0" y="688.0">O sistema cria a publicação geral, sem vínculo com</tspan><tspan x="1020.0" y="708.0">local específico, e registra a operação de</tspan><tspan x="1020.0" y="728.0">auditoria (RN-076).</tspan></text><polygon class="node system-node decision" points="1020.0,802.0 1092.0,844.0 1020.0,886.0 948.0,844.0"/><text class="small" x="1020.0" y="849.0" text-anchor="middle"><tspan x="1020.0" y="849.0">Condição A1?</tspan></text><rect class="node" x="185.0" y="998.0" width="390.0" height="88.0" rx="18"/><text class="text" x="380.0" y="1027.0" text-anchor="middle"><tspan x="380.0" y="1027.0">O administrador da plataforma a publica sem</tspan><tspan x="380.0" y="1047.0">associá-la a um equipamento cultural ou</tspan><tspan x="380.0" y="1067.0">estabelecimento gastronômico específico.</tspan></text><polygon class="merge" points="1020.0,1211.0 1035.0,1226.0 1020.0,1241.0 1005.0,1226.0"/><polygon class="node system-node decision" points="1020.0,1284.0 1092.0,1326.0 1020.0,1368.0 948.0,1326.0"/><text class="small" x="1020.0" y="1331.0" text-anchor="middle"><tspan x="1020.0" y="1331.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1480.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1517.0" text-anchor="middle"><tspan x="1020.0" y="1517.0">O sistema impede sua exibição pública (RN-068).</tspan></text><circle cx="1020.0" cy="1600.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="1600.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,1725.0 1035.0,1740.0 1020.0,1755.0 1005.0,1740.0"/><rect class="node system-node" x="825.0" y="1798.0" width="390.0" height="88.0" rx="18"/><text class="text" x="1020.0" y="1827.0" text-anchor="middle"><tspan x="1020.0" y="1827.0">Resultado: Publicação geral é criada, sem vínculo</tspan><tspan x="1020.0" y="1847.0">obrigatório a local específico, com trilha de</tspan><tspan x="1020.0" y="1867.0">auditoria.</tspan></text><circle cx="1020.0" cy="1941.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="1941.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="955.0"><tspan x="110" y="955.0">A1 — A publicação é de caráter geral</tspan></text><text class="guard" x="92" y="834.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1217.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1437.0"><tspan x="110" y="1437.0">E1 — Publicação sem os dados mínimos exigidos</tspan></text><text class="guard" x="92" y="1316.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="1605.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2036.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
