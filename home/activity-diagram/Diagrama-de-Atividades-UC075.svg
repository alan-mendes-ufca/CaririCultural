<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400.0" height="2774.0" viewBox="0 0 1400.0 2774.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-075 — Salvar e ajustar roteiro pessoal</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções derivadas do caso de uso descritivo.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400.0" height="2774.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-075</text>
  <text class="subtitle" x="70" y="75">Salvar e ajustar roteiro pessoal · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2524.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V155 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#FEF08A"/><text class="lane-title" x="380.0" y="133.0" text-anchor="middle"><tspan x="380.0" y="133.0">USUÁRIO AUTENTICADO</tspan></text><rect x="700.0" y="100" width="640.0" height="2524.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V155 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#BFDBFE"/><text class="lane-title" x="1020.0" y="133.0" text-anchor="middle"><tspan x="1020.0" y="133.0">SISTEMA</tspan></text>
  <rect class="alternative-band" x="88" y="1136.0" width="1224.0" height="186.0" rx="18"/><rect class="alternative-band" x="88" y="1586.0" width="1224.0" height="186.0" rx="18"/><rect class="exception-band" x="88" y="2036.0" width="1224.0" height="222.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V233.5 H1020.0 V270.0"/><path class="flow" d="M1020.0 338.0 V365.5 H380.0 V393.0"/><path class="flow" d="M380.0 457.0 V512.0"/><path class="flow" d="M380.0 580.0 V635.0"/><path class="flow" d="M380.0 703.0 V730.5 H1020.0 V758.0"/><path class="flow" d="M1020.0 826.0 V881.0"/><path class="flow" d="M1020.0 945.0 V1000.0"/><path class="branch-bus no-arrow" d="M1110.0 1052.0 H1350.0 V1186.0"/><path class="flow" d="M1350.0 1186.0 H1020.0 V1206.0"/><path class="main-flow" d="M930.0 1052.0 H80.0 V1392.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1274.0 H1382.0 V1392.0"/><path class="return-flow" d="M1382.0 1392.0 H1035.0"/><path class="flow" d="M1020.0 1407.0 V1450.0"/><path class="branch-bus no-arrow" d="M1110.0 1502.0 H1350.0 V1636.0"/><path class="flow" d="M1350.0 1636.0 H1020.0 V1656.0"/><path class="main-flow" d="M930.0 1502.0 H80.0 V1842.0 H1005.0"/><path class="return-flow no-arrow" d="M1020.0 1724.0 H1382.0 V1842.0"/><path class="return-flow" d="M1382.0 1842.0 H1035.0"/><path class="flow" d="M1020.0 1857.0 V1900.0"/><path class="branch-bus no-arrow" d="M1110.0 1952.0 H1350.0 V2086.0"/><path class="error-flow" d="M1350.0 2086.0 H1020.0 V2106.0"/><path class="main-flow" d="M930.0 1952.0 H80.0 V2328.0 H1005.0"/><path class="error-flow" d="M1020.0 2174.0 V2212.0"/><path class="flow" d="M1020.0 2343.0 V2386.0"/><path class="flow" d="M1020.0 2494.0 V2531.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node system-node" x="825.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="299.0" text-anchor="middle"><tspan x="1020.0" y="299.0">O caso UC-017 inclui este caso após gerar a</tspan><tspan x="1020.0" y="319.0">sequência de passeio.</tspan></text><rect class="node" x="185.0" y="393.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="430.0" text-anchor="middle"><tspan x="380.0" y="430.0">O usuário revisa o roteiro proposto.</tspan></text><rect class="node" x="185.0" y="512.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="541.0" text-anchor="middle"><tspan x="380.0" y="541.0">O usuário salva o roteiro, que passa a</tspan><tspan x="380.0" y="561.0">pertencer ao seu perfil.</tspan></text><rect class="node" x="185.0" y="635.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="664.0" text-anchor="middle"><tspan x="380.0" y="664.0">O usuário reorganiza manualmente a ordem dos</tspan><tspan x="380.0" y="684.0">locais, ou remove/substitui um local.</tspan></text><rect class="node system-node" x="825.0" y="758.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="787.0" text-anchor="middle"><tspan x="1020.0" y="787.0">O sistema recalcula os trechos afetados pela</tspan><tspan x="1020.0" y="807.0">alteração.</tspan></text><rect class="node system-node" x="825.0" y="881.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="918.0" text-anchor="middle"><tspan x="1020.0" y="918.0">O sistema salva a nova versão do roteiro.</tspan></text><polygon class="node system-node decision" points="1020.0,1000.0 1110.0,1052.0 1020.0,1104.0 930.0,1052.0"/><text class="small" x="1020.0" y="1047.0" text-anchor="middle"><tspan x="1020.0" y="1047.0">Usuário reorganiza</tspan><tspan x="1020.0" y="1067.0">manualmente?</tspan></text><rect class="node system-node" x="825.0" y="1206.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1235.0" text-anchor="middle"><tspan x="1020.0" y="1235.0">O sistema preserva a ordem definida sem</tspan><tspan x="1020.0" y="1255.0">reordenar automaticamente</tspan></text><polygon class="merge" points="1020.0,1377.0 1035.0,1392.0 1020.0,1407.0 1005.0,1392.0"/><polygon class="node system-node decision" points="1020.0,1450.0 1110.0,1502.0 1020.0,1554.0 930.0,1502.0"/><text class="small" x="1020.0" y="1497.0" text-anchor="middle"><tspan x="1020.0" y="1497.0">Usuário remove ou</tspan><tspan x="1020.0" y="1517.0">substitui um local?</tspan></text><rect class="node system-node" x="825.0" y="1656.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1685.0" text-anchor="middle"><tspan x="1020.0" y="1685.0">O sistema recalcula somente os trechos</tspan><tspan x="1020.0" y="1705.0">afetados</tspan></text><polygon class="merge" points="1020.0,1827.0 1035.0,1842.0 1020.0,1857.0 1005.0,1842.0"/><polygon class="node system-node decision" points="1020.0,1900.0 1110.0,1952.0 1020.0,2004.0 930.0,1952.0"/><text class="small" x="1020.0" y="1937.0" text-anchor="middle"><tspan x="1020.0" y="1937.0">Não há combinação</tspan><tspan x="1020.0" y="1957.0">viável após a</tspan><tspan x="1020.0" y="1977.0">alteração?</tspan></text><rect class="node exception-node" x="825.0" y="2106.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2135.0" text-anchor="middle"><tspan x="1020.0" y="2135.0">O sistema explica as restrições identificadas</tspan><tspan x="1020.0" y="2155.0">e sugere flexibilizações</tspan></text><circle cx="1020.0" cy="2230.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2230.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2313.0 1035.0,2328.0 1020.0,2343.0 1005.0,2328.0"/><rect class="node system-node" x="825.0" y="2386.0" width="390.0" height="108.0" rx="18"/><text class="text" x="1020.0" y="2415.0" text-anchor="middle"><tspan x="1020.0" y="2415.0">Resultado: Roteiro é persistido, pertence ao</tspan><tspan x="1020.0" y="2435.0">usuário e reflete as alterações feitas;</tspan><tspan x="1020.0" y="2455.0">trechos afetados por substituição são</tspan><tspan x="1020.0" y="2475.0">recalculados.</tspan></text><circle cx="1020.0" cy="2549.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2549.0" r="10" fill="#0f172a"/>
  <text class="result-label" x="1362.0" y="1383.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1168.0" text-anchor="start"><tspan x="110.0" y="1168.0">A1 — Usuário reorganiza manualmente</tspan></text><text class="guard" x="92" y="1042.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1833.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110.0" y="1618.0" text-anchor="start"><tspan x="110.0" y="1618.0">A2 — Usuário remove ou substitui um local</tspan></text><text class="guard" x="92" y="1492.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2235.0">Fluxo excepcional encerrado</text><text class="branch-code" x="110.0" y="2068.0" text-anchor="start"><tspan x="110.0" y="2068.0">E1 — Não há combinação viável após a alteração</tspan></text><text class="guard" x="92" y="1942.0">[fluxo principal]</text>

  <g transform="translate(340.0 2644.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
