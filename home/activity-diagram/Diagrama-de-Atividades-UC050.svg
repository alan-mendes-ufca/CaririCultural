<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2620.0" viewBox="0 0 1400 2620.0" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Atividades UML — UC-050 — Consultar atrações cadastradas</title>
  <desc id="desc">Fluxo de atividades em ordem temporal, com raias por responsável e alternativas e exceções posicionadas após o fluxo principal documentado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 28px "Lato", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
      .lane-title { font: 700 17px "Lato", "DejaVu Sans", sans-serif; fill: #fff; letter-spacing: .35px; text-anchor: middle; }
      .node { fill: #fff; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .system-node { fill: #f8fbff; stroke: #2563eb; }
      .exception-node { fill: #fff7ed; stroke: #c2410c; }
      .decision { filter: url(#shadow); }
      .merge { fill: #fff; stroke: #334155; stroke-width: 2; }
      .text { font: 600 15px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .small { font: 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #172033; }
      .guard { font: italic 600 13px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .branch-code { font: 700 14px "Lato", "DejaVu Sans", sans-serif; fill: #334155; }
      .result-label { font: 500 12px "Lato", "DejaVu Sans", sans-serif; fill: #64748b; }
      .flow, .main-flow, .error-flow, .return-flow, .branch-bus { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .main-flow { stroke: #64748b; }
      .error-flow { stroke: #c2410c; marker-end: url(#error-arrow); }
      .return-flow { stroke: #64748b; stroke-dasharray: 6 5; }
      .branch-bus.no-arrow, .return-flow.no-arrow { marker-end: none; }
      .alternative-band { fill: #eff6ff; fill-opacity: .66; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .exception-band { fill: #fff7ed; fill-opacity: .82; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .legend { font: 500 13px "Lato", "DejaVu Sans", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1400" height="2620.0" fill="#f8fafc"/>
  <text class="title" x="70" y="48">Diagrama de Atividades UML — UC-050</text>
  <text class="subtitle" x="70" y="75">Consultar atrações cadastradas · fluxo principal, alternativas e exceções em ordem de ocorrência</text>
  <rect x="60.0" y="100" width="640.0" height="2350.0" rx="10" fill="#f6f7f9" stroke="#cbd5e1" stroke-width="2"/><path d="M70.0 100 H690.0 Q700.0 100 700.0 110 V150 H60.0 V110 Q60.0 100 70.0 100 Z" fill="#475569"/><text class="lane-title" x="380.0" y="132">VISITANTE</text><rect x="700.0" y="100" width="640.0" height="2350.0" rx="10" fill="#eef5ff" stroke="#bfdbfe" stroke-width="2"/><path d="M710.0 100 H1330.0 Q1340.0 100 1340.0 110 V150 H700.0 V110 Q700.0 100 710.0 100 Z" fill="#2563eb"/><text class="lane-title" x="1020.0" y="132">SISTEMA</text>
  <rect class="alternative-band" x="88" y="944.0" width="1224.0" height="208.0" rx="18"/><rect class="alternative-band" x="88" y="1406.0" width="1224.0" height="204.0" rx="18"/><rect class="exception-band" x="88" y="1864.0" width="1224.0" height="260.0" rx="18"/>
  <path class="flow" d="M380.0 197.0 V270.0"/><path class="flow" d="M380.0 338.0 V365.5 H1020.0 V393.0"/><path class="flow" d="M1020.0 461.0 V488.5 H380.0 V516.0"/><path class="flow" d="M380.0 580.0 V607.5 H1020.0 V635.0"/><path class="flow" d="M1020.0 763.0 V818.0"/><path class="main-flow" d="M948.0 860.0 H80.0 V1222.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 860.0 H1350.0 V994.0"/><path class="flow" d="M1350.0 994.0 H1020.0 V1014.0"/><path class="return-flow no-arrow" d="M1020.0 1082.0 H1382.0 V1222.0"/><path class="return-flow" d="M1382.0 1222.0 H1035.0"/><path class="flow" d="M1020.0 1237.0 V1280.0"/><path class="main-flow" d="M948.0 1322.0 H80.0 V1680.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1322.0 H1350.0 V1456.0"/><path class="flow" d="M1350.0 1456.0 H1020.0 V1476.0"/><path class="return-flow no-arrow" d="M1020.0 1540.0 H1382.0 V1680.0"/><path class="return-flow" d="M1382.0 1680.0 H1035.0"/><path class="flow" d="M1020.0 1695.0 V1738.0"/><path class="main-flow" d="M948.0 1780.0 H80.0 V2194.0 H1005.0"/><path class="branch-bus no-arrow" d="M1092.0 1780.0 H1350.0 V1914.0"/><path class="error-flow" d="M1350.0 1914.0 H1020.0 V1934.0"/><path class="error-flow" d="M1020.0 1998.0 V2036.0"/><path class="flow" d="M1020.0 2209.0 V2252.0"/><path class="flow" d="M1020.0 2320.0 V2357.0"/>
  <circle cx="380.0" cy="185" r="12" fill="#0f172a"/><rect class="node" x="185.0" y="270.0" width="390.0" height="68.0" rx="18"/><text class="text" x="380.0" y="299.0" text-anchor="middle"><tspan x="380.0" y="299.0">O visitante acessa as atrações de um equipamento</tspan><tspan x="380.0" y="319.0">cultural.</tspan></text><rect class="node system-node" x="825.0" y="393.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="422.0" text-anchor="middle"><tspan x="1020.0" y="422.0">O sistema lista as atrações publicadas e com</tspan><tspan x="1020.0" y="442.0">vínculo válido (RN-022).</tspan></text><rect class="node" x="185.0" y="516.0" width="390.0" height="64.0" rx="18"/><text class="text" x="380.0" y="553.0" text-anchor="middle"><tspan x="380.0" y="553.0">O visitante seleciona uma atração.</tspan></text><rect class="node system-node" x="825.0" y="635.0" width="390.0" height="128.0" rx="18"/><text class="text" x="1020.0" y="664.0" text-anchor="middle"><tspan x="1020.0" y="664.0">O sistema exibe as informações públicas</tspan><tspan x="1020.0" y="684.0">disponíveis: descrição, horários, localização,</tspan><tspan x="1020.0" y="704.0">valor de ingresso quando aplicável,</tspan><tspan x="1020.0" y="724.0">acessibilidade, adequação infantil, segurança do</tspan><tspan x="1020.0" y="744.0">entorno, programação e contato (RN-012).</tspan></text><polygon class="node system-node decision" points="1020.0,818.0 1092.0,860.0 1020.0,902.0 948.0,860.0"/><text class="small" x="1020.0" y="865.0" text-anchor="middle"><tspan x="1020.0" y="865.0">Condição A1?</tspan></text><rect class="node system-node" x="825.0" y="1014.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="1043.0" text-anchor="middle"><tspan x="1020.0" y="1043.0">Aciona a extensão UC-088 sem precisar publicar uma</tspan><tspan x="1020.0" y="1063.0">avaliação.</tspan></text><polygon class="merge" points="1020.0,1207.0 1035.0,1222.0 1020.0,1237.0 1005.0,1222.0"/><polygon class="node system-node decision" points="1020.0,1280.0 1092.0,1322.0 1020.0,1364.0 948.0,1322.0"/><text class="small" x="1020.0" y="1327.0" text-anchor="middle"><tspan x="1020.0" y="1327.0">Condição A2?</tspan></text><rect class="node system-node" x="825.0" y="1476.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1513.0" text-anchor="middle"><tspan x="1020.0" y="1513.0">Aciona a extensão UC-089.</tspan></text><polygon class="merge" points="1020.0,1665.0 1035.0,1680.0 1020.0,1695.0 1005.0,1680.0"/><polygon class="node system-node decision" points="1020.0,1738.0 1092.0,1780.0 1020.0,1822.0 948.0,1780.0"/><text class="small" x="1020.0" y="1785.0" text-anchor="middle"><tspan x="1020.0" y="1785.0">Condição E1?</tspan></text><rect class="node exception-node" x="825.0" y="1934.0" width="390.0" height="64.0" rx="18"/><text class="text" x="1020.0" y="1971.0" text-anchor="middle"><tspan x="1020.0" y="1971.0">O sistema não a exibe como conteúdo público.</tspan></text><circle cx="1020.0" cy="2054.0" r="18" fill="#fff" stroke="#9a3412" stroke-width="2.5"/><circle cx="1020.0" cy="2054.0" r="10" fill="#c2410c"/><polygon class="merge" points="1020.0,2179.0 1035.0,2194.0 1020.0,2209.0 1005.0,2194.0"/><rect class="node system-node" x="825.0" y="2252.0" width="390.0" height="68.0" rx="18"/><text class="text" x="1020.0" y="2281.0" text-anchor="middle"><tspan x="1020.0" y="2281.0">Resultado: Atrações publicadas são exibidas ao</tspan><tspan x="1020.0" y="2301.0">visitante.</tspan></text><circle cx="1020.0" cy="2375.0" r="18" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><circle cx="1020.0" cy="2375.0" r="10" fill="#0f172a"/>
  <text class="branch-code" x="110" y="971.0"><tspan x="110" y="971.0">A1 — O visitante identifica um dado incorreto</tspan></text><text class="guard" x="92" y="850.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1213.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1433.0"><tspan x="110" y="1433.0">A2 — O visitante deseja compartilhar a atração</tspan></text><text class="guard" x="92" y="1312.0">[fluxo principal]</text><text class="result-label" x="1362.0" y="1671.0" text-anchor="end">Retoma o fluxo principal</text><text class="branch-code" x="110" y="1891.0"><tspan x="110" y="1891.0">E1 — A atração não possui vínculo válido com um equipamento ativo</tspan></text><text class="guard" x="92" y="1770.0">[fluxo principal]</text><text class="result-label" x="1048.0" y="2059.0">Fluxo excepcional encerrado</text>
  
  <g transform="translate(340.0 2470.0)">
    <rect x="0" y="0" width="720" height="98" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect class="node" x="28" y="22" width="74" height="34" rx="12"/><text class="legend" x="116" y="44">Ação do ator</text>
    <rect class="node system-node" x="235" y="22" width="74" height="34" rx="12"/><text class="legend" x="323" y="44">Ação do sistema</text>
    <rect class="node exception-node" x="454" y="22" width="74" height="34" rx="12"/><text class="legend" x="542" y="44">Tratamento de exceção</text>
    <text class="legend" x="28" y="80">Losango maior: decisão · losango pequeno: fusão · faixa tracejada: caminho alternativo/excepcional</text>
  </g>
</svg>
