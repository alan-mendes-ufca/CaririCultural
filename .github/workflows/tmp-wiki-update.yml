name: Atualizar página Como Contribuir (temporário)
on:
  push:
    branches: [claude/sharp-allen-smaxk5]
    paths: [".github/workflows/tmp-wiki-update.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp .github/tmp-wiki/Como-Contribuir.md "$RUNNER_TEMP/wiki/01-Projeto/Como-Contribuir.md"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          git diff --cached --quiet || { git commit -m "docs: atualiza Como Contribuir com as três perguntas do template de PR"; git push origin HEAD; }
