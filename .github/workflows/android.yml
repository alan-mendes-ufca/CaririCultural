name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@CHECKOUT_V

      - uses: actions/setup-java@SETUP_JAVA_V
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@SETUP_GRADLE_V

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@UPLOAD_V
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
